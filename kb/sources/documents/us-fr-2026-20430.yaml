summary: >
  FinCEN 이 2020-12-23 공고한 비수탁지갑 관련 CVC/LTDA 거래 보고·기록·신원확인 제안규칙(85 FR 83840)을 철회한다는 연방관보 공고. 2026-10-06 게재 일정. FinCEN 은 이 NPRM 에 대해 추가 조치를 하지 않겠다고 밝혔다.

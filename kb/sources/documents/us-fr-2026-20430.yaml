curator_note: >
  이전 조사(FACT:0000011·0000012, SRC:us-federalregister tier_basis)는 '규칙 철회는 관보에 공고되지 않을 수 있다'·'관보 공고 없음'으로 기록했다. 이 공고로 비수탁지갑 규칙은 관보 철회가 실제로 게재됐다. 통합의제상 종결(2024-04-12)과 관보 철회(2026-10-06)는 별개 행정행위로 기록한다(research/2026-10-aml-landscape.md C-03). 해당 FACT 의 정정은 facts 담당 작업에서 새 줄로 처리할 것.

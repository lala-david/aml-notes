label:
  ko: "전기통신금융사기 피해 방지 및 피해자산 환급에 관한 특별법 (현행, 2026-10-02 시행)"
  en: "Special Act on the Prevention of Telecommunications Financial Fraud and Refund of Damaged Assets (current)"
  short: "통신사기피해환급법"
summary: >-
  법제처 현행본(법률 제22047호, 2026-09-29 일부개정, 2026-10-02 시행). 법률 제21503호(2026-03-31 공포, 2026-10-01 시행) 부칙과 개정 문언을 포함한다.
  제2조제1호 하목으로 가상자산거래소가 「금융회사등」에 들어가고, 제2조의5가 임시조치를 의무화한다.

summary: >
  2025-06 권고 16 개정의 배경과 적용범위를 설명하는 FATF 공식 문서.
  §54 에서 VASP 를 R.16 직접 적용 대상에서 제외하고 R.15 를 통해 간접
  적용한다는 합의를 명시한다. 각주 95 는 개정 평가기준(2022 Methodology
  Annex IV)이 "채택되었으나 미발효"임을 밝힌다.

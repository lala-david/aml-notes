curator_note: >
  【확보 경로 — 기존 차단 해소】 EUR-Lex 는 robots.txt 로 원문 경로 크롤링을
  금지하지만, 출판국 CELLAR 의 내용협상 엔드포인트로는 받을 수 있다.
    curl -L -H "Accept: application/xhtml+xml" -H "Accept-Language: eng" \
      http://publications.europa.eu/resource/celex/32023R1113
  Accept 를 text/html 로 주면 400(Illegal accept header)이고,
  application/xhtml+xml 이라야 200 이다. 이 경로로 전문 326KB 를 받아
  제14조를 축조 확인했다.

  【EUR 1 000 의 정확한 소재 — 흔한 오해】 원문 검색 결과 EUR 1 000 은
  (1) 자금이체(암호자산 아님)의 정보 검증 면제선, (2) 자기수탁 주소로/에서
  오가는 이체에서 **주소 소유·통제 여부를 평가할 의무**의 발동선으로 쓰인다.
  제14조 제1항·제2항의 정보 동반 의무 자체에는 금액 기준이 없다.
  따라서 "EU 트래블룰 임계값은 EUR 1,000" 은 틀린 서술이다.
  → REG:eu-tfr 의 기존 서술이 옳았음을 원문으로 확인했다.

label:
  ko: "규정 (EU) 2023/1113 — 자금 및 특정 암호자산 이체 시 동반정보"
  en: "Regulation (EU) 2023/1113 on information accompanying transfers of funds and certain crypto-assets"
  short: "EU TFR"
summary: >
  EU 의 트래블룰 규정 원문. 제14조가 암호자산 이체 시 암호자산서비스제공자가
  송신인·수신인 정보를 동반시킬 의무를 정한다. 자금이체에는 EUR 1,000 기준이
  여럿 있으나 암호자산 이체의 정보 동반 의무 자체에는 기준금액이 없다.
src: "SRC:eu-publications"

evidence:
  - doc: "DOC:eu-tfr-2023-1113"
    confidence: "A"
    locator: "Article 14(1)"
    quote: >
      The crypto-asset service provider of the originator shall ensure that
      transfers of crypto-assets are accompanied by the following information
      on the originator: (a) the name of the originator; (b) the originator's
      distributed ledger address …
    retrieved: "2026-07-31"

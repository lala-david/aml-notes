    locator: "第三十一条の七"
    quote: >
      법 제10조의5 제1항·제2항의 주무성령으로 정하는 사항 —
      의뢰고객이 자연인·인격 없는 사단등이면 성명, 주소 또는 식별번호 또는
      고객번호, 그리고 이전에 관한 식별부호. 법인이면 명칭, 주된 사무소
      소재지 또는 고객번호, 그리고 이전에 관한 식별부호.
      수취고객은 성명 또는 명칭과 이전에 관한 식별부호 또는 식별기호·번호.

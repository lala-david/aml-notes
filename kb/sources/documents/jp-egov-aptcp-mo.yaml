  【조문 번호 대응 — 실측으로 확인한 지도】
    第31条      → 법 제10조 (환거래 통지)
    第31条の3   → 법 제10조의2 제1호 (외국 전자결제수단등거래업자)
    第31条の6   → 법 제10조의4 제1호 (외국 암호자산교환업자)
    第31条の7   → 법 제10조의5 (암호자산 이전 통지)   ← 이 문서
    第31条の8   → 존재하지 않음 (404)

  【확정된 것 — 세 층위 전부 확인】
  법률(제10조의5) · 정령(시행령 제7조) · 성령(시행규칙 제31조의7) 을
  각각 원문으로 확인했다. 통지의무 계통 어디에도 금액 기준이 없다.
  정령의 십만엔은 特定取引 정의로서 거래시확인(CDD) 계통에만 붙는다.
  → **일본 암호자산 트래블룰에는 금액 임계가 없다.** 이제 확정 서술 가능.

  【quote 는 요약 번역이다】 원문 XML 을 조문 단위로 받아 내용을 확인했으나
  일본어 원문을 그대로 옮겨 붙일 만큼 길게 확보하지 못했다. quote 필드는
  한국어 요약이며 축조 문언이 아니다 — 인용 시 원문 재확인 필요.

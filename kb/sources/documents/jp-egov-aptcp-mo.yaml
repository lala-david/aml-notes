label:
  ko: "범죄에 의한 수익의 이전방지에 관한 법률 시행규칙"
  en: "Ordinance for Enforcement of the Act on Prevention of Transfer of Criminal Proceeds"
  short: "범수법 시행규칙"
summary: >
  범수법의 주무성령. 제31조의7이 법 제10조의5(암호자산 이전 통지의무)를 이행하며
  통지할 사항을 열거한다. **이 조문에도 금액 기준이 없다** — 법률·정령·성령
  세 층위를 모두 확인한 결과 일본 암호자산 트래블룰에는 금액 임계가 없다.

evidence:
- doc: "DOC:kr-lawgokr-vaupa"
  confidence: "A"
  locator: "제12조 제1항"
  quote: "가상자산시장을 개설ㆍ운영하는 가상자산사업자는 가상자산의 가격이나 거래량이 비정상적으로 변동하는 거래 등 대통령령으로 정하는 이상거래(이하 \"이상거래\"라 한다)를 상시 감시하고 이용자\
    \ 보호 및 건전한 거래질서 유지를 위하여 금융위원회가 정하는 바에 따라 적절한 조치를 취하여야 한다."
  retrieved: "2026-10-21"
- doc: "DOC:kr-lawgokr-vaupa"
  confidence: "A"
  locator: "제22조 제1항 제6호·제7호"
  quote: "6. 제12조제1항을 위반하여 이상거래에 대해 적절한 조치를 취하지 아니한 자 7. 제12조제2항에 따른 통보ㆍ보고를 하지 아니하거나 거짓으로 통보ㆍ보고한 자"
  retrieved: "2026-10-21"

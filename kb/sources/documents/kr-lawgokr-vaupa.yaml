label:
  ko: "가상자산 이용자 보호 등에 관한 법률 (현행, 2026-10-02 시행)"
  en: "Act on the Protection of Virtual Asset Users (current)"
  short: "가상자산이용자보호법"
summary: >-
  법제처 국가법령정보센터의 가상자산이용자보호법 현행본(법률 제21857호 타법개정, 2026-10-02 시행). 제10조(불공정거래행위 등 금지), 제12조(이상거래에 대한 감시), 제17조(과징금),
  제19조(벌칙), 제22조(과태료) 문언을 담는다.

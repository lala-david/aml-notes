curator_note: >-
  같은 MST(288765)를 efYd=20260820 으로 조회하면 2026-10-21 현재 효력 있는 제10조의10 제1호(「1백만원 이상」)가 나온다 — https://www.law.go.kr/DRF/lawService.do?OC=test&target=eflaw&MST=288765&efYd=20260820&type=XML
  . 법제처 eflaw 색인은 이 판본을 「공포일자 20260818 / 공포번호 36592 / 시행일자 20270219 / 시행예정」으로 표시한다. 언론의 2027-02-20 은 채택하지 않는다(공포일을
  08-19 로 가정한 계산으로 보임). 조문 단위 메타데이터의 「조문시행일자 20260820」은 부칙과 충돌하는 레코드 결함이다(research/2026-10-travel-rule.md F-012·F-014).

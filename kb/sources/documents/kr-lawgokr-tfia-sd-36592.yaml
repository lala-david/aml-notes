label:
  ko: "특정 금융거래정보의 보고 및 이용 등에 관한 법률 시행령 (대통령령 제36592호, 시행예정 판본)"
  en: "TFIA Enforcement Decree, Presidential Decree No. 36592 (scheduled version)"
  short: "특금법 시행령 제36592호"
summary: >-
  2026-08-18 공포된 특금법 시행령 일부개정령. 본칙은 2026-08-20 시행됐고, 부칙 제1조 단서가 제10조의2·제10조의5제6항·제10조의10·제10조의20·제16조의2제1호·제4호 개정규정을
  공포 후 6개월이 경과한 날(법제처 시행일 색인 2027-02-19)부터 시행하게 한다. 트래블룰 기준금액(100만원) 폐지와 해외 VASP·자기수탁 주소 차등 규율이 여기 들어 있다.

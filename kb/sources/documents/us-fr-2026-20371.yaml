curator_note: >
  근거 권한은 §311 이 아니라 §9714 다. 각주 1 이 OFAC 의 2026-10-01 A7 Network TCO 지정(E.O. 13581, 개정 E.O. 13863)을 인용한다 — OFAC 원 공고는 미열람이라 그 사실은 B 로 다룬다. A7 이 Garantex·Grinex·A7A5 등과 연계된다고 기술. 의견 마감은 관보 게재 후 30일 — 최종화 감시 대상.

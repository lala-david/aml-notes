label:
  ko: "FinCEN A7 네트워크 하위대리인 자금이체 금지 특별조치 제안규칙 (FR 2026-20371)"
  en: "Imposition of Special Measure Prohibiting the Transmittal of Funds Involving A7 Network Sub-Agents (NPRM)"
  short: "FR 2026-20371 A7 특별조치 NPRM"
summary: >
  FinCEN 이 Combating Russian Money Laundering Act §9714(a) 에 따라 A7 Network 가 통제하는 역외 기업(Sub-Agents)과의 거래를 러시아 불법금융 관련 주요 자금세탁 우려 거래군으로 보고 미국 금융기관의 자금이체를 금지하려는 특별조치 NPRM(RIN 1506-AB77, 도켓 FINCEN-2026-0265). 2026-10-05 관보 게재, 의견 30일. 상태 proposed.

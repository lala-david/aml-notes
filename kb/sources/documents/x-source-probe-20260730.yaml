  2026-07-30 수행한 수집 소스 접근성 실측의 1차 관찰 기록. 88개 후보 엔드포인트에
  대해 HTTP 응답·포맷·robots.txt·자동수집 허용 여부를 확인했고, 2차 조사에서 도메인별
  페치 전략(브라우저 헤더 / 표준 클라이언트 / 차단)을 추가 실측했다.
  기관·출처 노드의 존재와 엔드포인트 유효성에 대한 근거로 사용한다.

curator_note: >
  **자체 작성 문서다.** 외부 권위가 아니라 우리 자신의 직접 관찰 기록이므로,
  통상의 tier 체계(T1=법령 원문)와 성격이 다르다.

  이 문서가 정당하게 증거할 수 있는 것은 **"해당 엔드포인트가 이 날짜에 이 응답을
  반환했다"** 는 인프라 사실뿐이다. 기관의 법적 권한·관할·규제 내용에 대한 근거로
  쓰면 안 된다 — 그런 주장에는 해당 기관의 설립 근거 법령이나 공식 발간물이 필요하다.

  현재 다수의 ORG·JUR 노드가 이 문서를 증거로 삼고 있는데, 이는 **잠정 조치**다.
  각 기관의 설립 근거 문서를 확보해 재결속하고 확신도를 A/B 로 올리는 것이 과제다.
  그래서 해당 노드들의 확신도를 B 이하로 두고 review_due 를 90일 이내로 설정했다.

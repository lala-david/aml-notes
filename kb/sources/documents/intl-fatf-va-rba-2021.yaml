summary: >
  FATF 가 2021-10-28 발간한 가상자산·VASP 위험기반접근 개정 가이던스로, 2019 초판을
  통합·대체한다. 6대 개정 초점은 VA·VASP 정의 명확화, 스테이블코인, P2P 거래 위험,
  라이선스·등록, 트래블룰 이행, 감독기관 간 정보공유 원칙이다. PDF 111쪽, 인쇄 pp.1–109,
  단락 1–357.

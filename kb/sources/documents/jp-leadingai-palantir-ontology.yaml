summary: >
  Palantir Foundry 의 온톨로지를 IT 기술이 아니라 **운용 레이어(operational layer)**
  로 해설한 구조 분석서. 세계를 명사(Semantics — 객체·속성·링크)와
  동사(Kinetics — 액션·함수·동적 보안)로 모델링하고, 브랜치·리뷰 통치 절차를 통해
  AI 가 현실 업무를 안전하게 변경하게 하는 설계를 다룬다. 전 6장 + 참고문헌.

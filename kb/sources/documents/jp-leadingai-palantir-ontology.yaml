curator_note: >
  이 문서가 본 지식베이스 온톨로지의 **Semantics / Kinetics 이분(二分)의 출처**다.
  ADR-0004 에서 이를 근거로 기존 L3 정의 오류를 정정했다.

  본 저장소가 채택한 것 —
    · Semantics(명사) / Kinetics(동사) 이분
    · Kinetics = Action / Function / Dynamic security (쓰기·실행 계층)
    · Ontology Proposals: 브랜치 → 테스트 → 제안 → 리뷰 → 머지
    · Action Log: 모든 액션 실행을 객체로 모델링해 영구 기록, 대상 객체에 연결
    · 접근통제 2축: 행 단위(Restricted Views) + 속성 단위(MDO)

  본 저장소가 추가한 것 (원 출처에 없음) —
    · L2 DYNAMIC 이중시간 계층. 규제 도메인은 "언제 효력이 있었는가"와
      "우리가 언제 알았는가"를 분리해야 하므로 도메인 확장이 필요했다.

  본 저장소가 채택하지 않은 것 —
    · Foundry 백엔드 5서비스(OMS·Object DB·OSS·Actions·Funnel) 구성.
      제품 아키텍처이며 파일 기반 SSOT 설계(ADR-0003)와 층위가 다르다.
      단 Funnel 의 batch/streaming 인덱싱 구분은 수집 설계에 반영했다.

  이 문서의 Palantir 아키텍처 서술은 2차 정보다. 제품 사양을 단정 인용하기
  전에 Palantir 공식 문서로 교차 확인할 것. 본 저장소는 **설계 사고방식**만
  차용하며 제품 사양을 주장하지 않는다.

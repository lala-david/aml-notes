label:
  ko: "MLR 2017 규정 64G (비호스팅 지갑 관련 이전)"
  en: "MLR 2017 regulation 64G — transfers involving unhosted wallets"
  short: "MLR reg 64G"
summary: >
  암호자산 사업자가 비호스팅 지갑과 주고받는 이전에서 고객에게 누락 정보를 요청할 수 있고,
  요청 정보를 받지 못하면 수익자에게 암호자산을 내줄 수 없다고 정한 조문. 2026-06-30 판의
  금액은 £800(그 전 1,000 euros)이다.

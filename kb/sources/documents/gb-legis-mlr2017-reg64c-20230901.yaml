  en: "MLR 2017 regulation 64C — point-in-time version as at 1 September 2023"
  short: "MLR reg 64C (2023-09-01)"
summary: >
  legislation.gov.uk 의 시점 지정 판본. 제7A편 시행일(2023-09-01) 당시 규정 64C(4)의
  심화정보 발동 문언이 「1,000 euros」였음을 보여 준다. 기본 의무(64C(1))에는 금액이 없다.
  주석 F1 은 제7A편이 S.I. 2022/860 으로 2023-09-01 신설됐다고 표시한다.

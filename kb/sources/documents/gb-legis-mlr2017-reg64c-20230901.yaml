evidence:
  - doc: "DOC:gb-legis-mlr2017-reg64c-20230901"
    confidence: "A"
    locator: "regulation 64C(4) (2023-09-01 판) · 주석 F1"
    quote: >
      Where paragraph (3) does not apply and the transfer is equal to or exceeds
      the equivalent in cryptoassets of 1,000 euros in value (taken together with
      any other cryptoasset transfer which appears to be linked), the cryptoasset
      business of the originator must ensure that the inter-cryptoasset business
      transfer is also accompanied by the information specified in paragraph (6).
    retrieved: "2026-10-21"

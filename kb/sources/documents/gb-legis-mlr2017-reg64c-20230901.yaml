curator_note: >
  research/2026-10-travel-rule.md F-030 (T1/A). 주석 F1 「Pt. 7A inserted (1.9.2023) by
  S.I. 2022/860」 으로 신설 개정령과 시행일이 확정된다 — DOC:gb-legis-mlr2017 의
  「SI 2022/860 으로 추정」 과제를 해소하는 근거다.
  이 판본의 금액은 2026-06-29 까지 유효했다. 2026-06-30 부터는 S.I. 2026/621 이
  「£800」으로 바꿨다(DOC:gb-legis-si-2026-621).

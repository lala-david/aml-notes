  en: "The Money Laundering and Terrorist Financing (Amendment) Regulations 2026 (S.I. 2026/621)"
  short: "S.I. 2026/621"
summary: >
  2026-06-09 제정, 2026-06-30 시행(일부 2027-02-01)된 MLR 2017 개정령.
  규정 32 가 reg 64C(4)의, 규정 33 이 reg 64G(1)(b)의 「1,000 euros」를 「£800」으로 치환했다.
  규정 20 은 암호자산 사업자 간 코레스 관계 강화 CDD(reg 34A)를 신설하며, reg 1(4)에 따라
  그 부분은 2027-02-01 시행이다.

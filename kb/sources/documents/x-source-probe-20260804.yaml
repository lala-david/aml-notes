curator_note: >
  【실측 결과 — 관할별】

  🇯🇵 일본 · laws.e-gov.go.jp — **성공**
     구 도메인 elaws → laws 로 301. 조문 단위 엔드포인트가 있어 축조 확인
     가능. 전문 API 는 응답이 크면 절단됨(施行規則 제13조에서 잘림).
     가지번호 조문(제31조의3 등)의 파라미터 표기법 미해결.

  🇬🇧 영국 · legislation.gov.uk — **성공**
     /regulation/{n} 조문 단위 URL. 확보 품질 가장 좋음.
     단 "changes to legislation" 미반영 개정 배너를 확인하지 않았다.

  🇦🇺 호주 · legislation.gov.au — **부분 성공(목차만)**
     /{id}/latest/text 가 목차만 반환. 조문 본문 미확보.
     조문 단위 URL 형식을 찾지 못했다.

  🇸🇬 싱가포르 · mas.gov.sg — **실패, 연속 2회차**
     공고 페이지·PDF 모두 유지보수 화면. SRC:sg-mas 가 2026-07-30 에
     기록한 장애가 **36일째 지속**이다. 단발 장애가 아니라 구조적 문제로
     봐야 한다. 대체 경로(sso.agc.gov.sg 등) 탐색 필요.
     web.archive.org 는 이 실행 환경에서 차단되어 우회 불가.

  🇭🇰 홍콩 · elegislation.gov.hk — **실패**
     JS 앱이라 정적 페치로 본문이 안 나온다("Loading required resource").
     SFC 지침 PDF 는 추정 URL 404. HKMA 미러(brdr.hkma.gov.hk)에
     AML 지침 PDF 가 있는 것으로 보이나 미시도 — 다음 라운드 우선 경로.

  【이 기록의 용도】 소스 레지스트리에 「열어보지 않은 소스는
  enabled:false」 규율이 있다. 법령 원문도 같다. 어느 경로가 실제로
  열리는지를 측정해 두지 않으면, 다음 수집자가 같은 막다른 길을
  다시 걷는다. 실패도 자산이다.

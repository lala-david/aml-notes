curator_note: >
  【실측 결과 — 관할별】

  🇯🇵 일본 · laws.e-gov.go.jp — **성공**
     구 도메인 elaws → laws 로 301. 조문 단위 엔드포인트가 있어 축조 확인
     가능. 전문 API 는 응답이 크면 절단됨(施行規則 제13조에서 잘림).
     가지번호 조문(제31조의3 등)의 파라미터 표기법 미해결.

  🇬🇧 영국 · legislation.gov.uk — **성공**
     /regulation/{n} 조문 단위 URL. 확보 품질 가장 좋음.
     단 "changes to legislation" 미반영 개정 배너를 확인하지 않았다.

  🇦🇺 호주 · legislation.gov.au — **최초 부분 성공 → 같은 날 해결**
     /{id}/latest/text 는 목차만 반환한다. 본문은 EPUB 로 제공되며
     목차의 조문 링크가 가리키는 앵커에서 경로를 역산할 수 있다.
       …/text/original/epub/OEBPS/document_1/document_1.html  (1.97MB)
     크기 때문에 페이지 요약 도구로는 뒤가 잘린다. 직접 수신 후
     태그 제거·조문 절단이 필요하다.

  🇸🇬 싱가포르 · mas.gov.sg — **최초 실패 판정 → 오진이었다**
     장애가 아니라 **Referer 검사**다.
       고시 목록 페이지: Referer 없이도 200 정상 (263KB)
       /-/media/ PDF   : Referer 없으면 「Maintenance」 HTML (853KB)
                         고시 페이지를 Referer 로 주면 정상 PDF (373KB/43쪽)
     SRC:sg-mas 가 2026-07-30 에 기록한 「전면 장애」도 같은 오진으로
     보인다. 이 판정 때문에 싱가포르가 두 라운드 미등재로 남았다.
     → FACT:0000027 폐기, FACT:0000029 로 대체.

  🇭🇰 홍콩 — **조례 원문은 여전히 실패, 감독기관 지침으로 우회 성공**
     elegislation.gov.hk 는 어느 경로로 요청해도 7,562바이트 JS 셸만
     반환한다(`!en.pdf`, 시점 지정, `/api/` 모두 동일). 미해결.
     대신 SFC 지침 PDF 로 우회했다. **파일명은 언더스코어가 아니라
     하이픈**이라야 200 이다. 그리고 이 PDF 는 **스캔 이미지가 아니다** —
     페이지 요약 도구가 이미지로만 읽었을 뿐, `pdftotext -layout` 으로
     텍스트 레이어가 정상 추출된다(539KB). 최초의 「스캔 이미지」
     판정은 틀렸다.
     HKMA 미러(brdr.hkma.gov.hk)도 받아진다 — 단 TLS 인증서 체인이
     불완전해 검증을 끄지 않으면 실패한다(은행 대상이라 VASP 용도로는
     SFC 판이 맞다).

  【이 기록의 용도】 소스 레지스트리에 「열어보지 않은 소스는
  enabled:false」 규율이 있다. 법령 원문도 같다. 어느 경로가 실제로
  열리는지를 측정해 두지 않으면, 다음 수집자가 같은 막다른 길을
  다시 걷는다. 실패도 자산이다.

  【최초 판정 3건 중 2건이 틀렸다 — 이게 더 중요한 교훈】
  싱가포르 「장애」와 홍콩 「스캔 이미지」는 둘 다 오진이었고,
  둘 다 **도구의 한계를 대상의 속성으로 오인**한 것이다.
  200 응답에 안내 HTML 이 실려 오면 장애처럼 보이고, 요약 도구가
  PDF 를 이미지로 읽으면 스캔본처럼 보인다.
  판정 전 최소 점검 3가지를 규율로 삼는다.
    (1) 상위·인접 경로도 함께 시도했는가
    (2) 헤더(Referer·UA)를 바꿔 재시도했는가
    (3) 반환된 **본문을 실제로 읽었는가** — 상태코드만 보지 않았는가
  「접근 불가」는 대상에 대한 주장이다. 도구가 실패한 것과 다르다.

label:
  ko: "자금세탁방지·테러자금조달방지 지침 (등록법인 및 SFC 인가 VASP 대상)"
  en: "Guideline on Anti-Money Laundering and Counter-Financing of Terrorism (For Licensed Corporations and SFC-licensed Virtual Asset Service Providers)"
  short: "SFC AML 지침"
summary: >
  홍콩 증권선물위원회가 발간한 AML/CFT 지침. 제12.11절이 가상자산 이전
  트래블룰을 다루며, 여백에 근거 조문(AMLO 부칙2 제13A조)을 항별로 명시한다.
  HK$8,000 은 의무 발동선이 아니라 요구 정보 항목을 나누는 기준임이 확인된다.

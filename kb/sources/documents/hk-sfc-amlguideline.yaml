    quote: >
      12.11.5 Before carrying out a virtual asset transfer involving virtual
      assets that amount to not less than $8,000, an ordering institution must
      obtain and record the following originator and recipient information …
      12.11.6 Before carrying out a virtual asset transfer involving virtual
      assets that amount to less than $8,000, an ordering institution must
      obtain and record the following originator and recipient information:
      (a) the originator's name; (b) the number of the originator's account …
      (c) the recipient's name; and (d) the number of the recipient's account …

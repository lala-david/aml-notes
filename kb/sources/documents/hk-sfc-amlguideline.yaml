curator_note: >
  【확보 경로 — 두 번의 실패 뒤】 파일명에 언더스코어를 쓴 추정 URL 은 404 다.
  하이픈 표기(`AML-Guideline-for-LCs-and-SFC-licensed-VASPs_Eng_1-Jun-2023.pdf`)
  라야 200 이다. 또한 일반적인 페이지 요약 도구로는 본문이 이미지로만 보여
  추출에 실패했는데, 직접 수신해 `pdftotext -layout` 로 처리하면
  텍스트 레이어가 정상 추출된다(539KB). **스캔 이미지가 아니었다.**
  DOC:x-source-probe-20260804 의 「스캔 이미지」 판정은 틀렸다 — 정정한다.

  【이 문서의 특별한 가치】 SFC 가 각 문단 여백에 근거 조문을 항 단위로
  달아 두었다(s.13A(1)&(8) / s.13A(2) / s.13A(2)&(3) / s.13A(4)).
  덕분에 AMLO 원문을 직접 못 봐도 **어느 항이 무엇을 정하는지** 대응이
  잡힌다. 감독기관 자신의 조문 대응 표시이므로 2차 요약과 격이 다르다.

  【확신도 판단】 지침 문언 자체는 A 다. 다만 이것은 조례 원문이 아니라
  감독기관의 재서술이다. AMLO 부칙2 제13A조의 축조 문언은 여전히 미확보이며
  elegislation.gov.hk 는 정적 수신으로 본문이 나오지 않는다(어느 경로든
  7,562바이트 JS 셸만 반환). 조문 문언을 인용해야 할 때는 재확보 필요.

  【HKMA 미러 — 별건이지만 유용】 brdr.hkma.gov.hk 에 HKMA 판 AML 지침
  PDF 가 있다(91쪽). TLS 인증서 체인이 불완전해 검증을 끄지 않으면
  받아지지 않는다. 은행 대상이라 VASP 트래블룰에는 이 SFC 판이 맞다.

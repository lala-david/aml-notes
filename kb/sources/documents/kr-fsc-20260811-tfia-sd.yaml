  ko: "금융위원회·FIU 보도자료 — 「특정금융정보법 시행령」 개정안 국무회의 의결 (2026-08-11)"
summary: >-
  2026-08-11 국무회의 의결 발표. 트래블룰 기준금액(100만원) 폐지, 해외거래소·개인지갑 위험도별 이전 규율, 1,000만원 이상 거래 자체 의심거래 관리체계, 신고제·퇴직자 제재통보 부분
  2026-08-20 시행, 그 외 부분 공포 후 6개월 경과일 시행.

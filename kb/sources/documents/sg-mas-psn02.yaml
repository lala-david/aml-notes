  ko: "MAS 고시 PSN02 — 자금세탁방지·테러자금조달방지 (디지털지급토큰 서비스 사업자)"
  en: "MAS Notice PSN02 — Prevention of Money Laundering and Countering the Financing of Terrorism (Holders of Payment Services Licence, Digital Payment Token Service)"
  short: "MAS PSN02"
summary: >
  싱가포르 DPT 서비스 사업자의 AML/CFT 의무를 정하는 MAS 고시. 제13절이
  가치이전(value transfer) 동반정보를 정하며, S$1,500 이하와 초과를
  나누어 요구 항목을 달리한다. 이하 구간에도 의무는 존속한다.

evidence:
  - doc: "DOC:sg-mas-psn02"
    confidence: "A"
    locator: "¶13.4 · ¶13.6"
    quote: >
      13.4 … in a value transfer where the amount to be transferred or arranged
      to be transferred is below or equal to S$1,500, every payment service
      provider which is an ordering institution shall include in the message or
      payment instruction that accompanies or relates to the value transfer the
      following: (a) the name of the value transfer originator; (b) the value
      transfer originator's account number …; (c) the name of the value
      transfer beneficiary; and (d) the value transfer beneficiary's account
      number …
      13.6 … where the amount … exceeds S$1,500, every payment service provider
      which is an ordering institution shall identify the value transfer
      originator and verify the value transfer originator's identity, and
      include … the information required by paragraphs 13.4(a) to 13.4(d) and
      any of the following: (a) … address, (b) … unique identification number
      …, or (c) the date and place of birth …
    retrieved: "2026-08-04"

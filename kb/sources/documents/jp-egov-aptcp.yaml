    locator: "第十条の五第一項"
    quote: >
      暗号資産交換業者は、顧客から依頼を受けて暗号資産の移転を行う場合において、
      当該移転を受取顧客…に対して行うとき、又は受取顧客に対する当該移転を他の
      暗号資産交換業者等に委託するときは、当該依頼を行った顧客及び当該受取顧客に
      係る本人特定事項その他の事項で主務省令で定めるものを…通知して行わなければ
      ならない。

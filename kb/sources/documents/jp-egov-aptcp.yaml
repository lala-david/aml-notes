curator_note: >
  e-Gov API 로 현행 전문을 받아 제10조의5를 축조 확인했다.

  【이 문서로 확정된 것】 제10조의5 제1항·제2항 본문에 **금액 기준이 없다.**
  조문은 "顧客から依頼を受けて暗号資産の移転を行う場合において" 로 시작해
  이전 행위 자체를 요건으로 삼으며, 「政令で定める額」 류의 위임 문언이
  이 조문에는 존재하지 않는다. 금액 위임은 같은 법 제4조 제2항 등 다른
  조문에 나온다.

  【아직 확인 못 한 것】 주무성령(施行規則 420M60000F5A001)이 통지의무에
  별도 금액 한도를 두는지 여부. 施行規則 제31조는 법 제10조(환거래)를
  이행하는 조문이고 암호자산·금액 언급이 없음을 확인했으나, 법 제10조의5를
  이행하는 조문(제31조의3 내외로 추정)은 아직 원문을 못 봤다.
  → 이것이 확인되기 전에는 "일본 트래블룰에 금액 기준이 없다" 고
  단정해서는 안 된다. 확인된 것은 "법률 조문에는 없다" 까지다.

curator_note: >
  e-Gov API 로 현행 전문을 받아 제7조의 십만엔 등장 지점을 전수 확인했다.

  【십만엔이 나오는 자리 — 실측 4곳, 전부 제7조 제1항 제1호】
    レ  전자결제수단의 교환등 … 가액 10만엔 초과
    ソ  전자결제수단의 이전 행위 … 가액 10만엔 초과
    ク  암호자산의 교환등 … 가액 10만엔 초과
    ヤ  암호자산의 이전 행위 … 가액 10만엔 초과   ← 트래블룰과 혼동되는 자리

  【결정적 구분】 제7조는 「特定取引」의 정의 조문이고, 특정거래에 해당하면
  법 제4조의 **거래시확인(取引時確認 = CDD)** 의무가 발동한다.
  통지의무(트래블룰)를 정하는 법 제10조의5와는 별개 계통이다.
  따라서 이 10만엔을 "일본의 트래블룰 임계금액" 으로 옮겨 적으면
  **의무를 부과하는 조문과 수치를 정하는 조문을 뒤바꾸는** 오류가 된다.
  저장소가 INR.15 §7(b) 와 특금법 제5조의3 에서 이미 두 번 낸 유형이다.

  【문언 정밀】 「十万円を超える」 — 초과다. 이상(以上)이 아니다.
  10만엔 정확히는 포함되지 않는다.

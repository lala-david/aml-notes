summary: >
  범수법의 위임사항을 정하는 정령. 제7조가 특정거래(特定取引)를 열거하며,
  암호자산 이전은 「가액이 10만엔을 초과하는 것」이 특정거래에 해당한다.
  이 기준은 거래시확인(CDD) 의무를 발동시키는 것이지 통지의무 기준이 아니다.

summary: >
  AMLA 가 AMLR 하위 규제기술기준(RTS) 3건 — 고객확인(Art. 28(1)), 거래관계·일회성거래 식별기준(Art. 19(9)), 그룹 차원 요건(Art. 16(4)·17(3)) — 의 최종안을 2026-10-01 유럽집행위에 제출했다고 발표. 적용은 발효 후 6개월, 축구 에이전트·구단은 2029-07-10.

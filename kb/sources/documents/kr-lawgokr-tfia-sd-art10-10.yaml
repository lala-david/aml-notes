label:
  ko: "특정금융정보법 시행령 제10조의10 (트래블룰 기준금액)"
  en: "TFIA Enforcement Decree Article 10-10"
  short: "특금법 시행령 제10조의10"
summary: >
  가상자산 이체 시 송수신인 정보 제공 의무의 적용 기준금액을 정하는 시행령 조항.
  제1호가 "1백만원 이상"을 규정한다. 법률 제5조의3 은 500만원 범위 내에서
  대통령령에 위임하므로, 임계값은 법률 개정 없이 시행령만으로 변경 가능하다.

  하위법령 입법예고(2026-03-30~05-11)에서 100만원 미만까지 확대 및 수신 VASP
  정보확보 의무 신설이 제안되었다. 개정 공포 여부는 미확인 — 리서치 도시에
  korea-regime §8 참조. 제안 단계와 시행 중을 혼동하지 말 것.

summary: >
  EU 암호자산 규제법 원문. 제3조 제1항이 이 규정에서 쓰는 용어를 정의하며,
  제5호가 "crypto-asset" 의 정의다. 인가·영업행위·발행 규율의 적용 범위가
  이 정의에서 갈린다.

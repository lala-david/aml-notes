  【CTR:00001 해소, 2026-07-30】 부칙 제1조 "공포 후 6개월이 경과한 날부터 시행"
  + 공포일 2026-02-19 → 시행일 2026-08-20 으로 확정. 타 도시에의 2026-02-29 공포 /
  2026-08-29 시행 설은 반증되었다. 국회 의안정보시스템(DOC:kr-assembly-bill-2214894)
  으로 독립 교차검증 완료.

  【부수 확정】 재신고 3개월 유예(2026-11-20)는 **시행령이 아니라 법률 부칙 제3조**에
  직접 규정되어 있다. 따라서 하위법령 공포 지연과 무관하게 확정된다.

  URL 은 DRF 조회 파라미터 형태이며 영구 링크 확정이 필요하다.

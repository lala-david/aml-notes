  ko: "특정 금융거래정보의 보고 및 이용 등에 관한 법률 (법률 제21358호)"
  en: "Act on Reporting and Using Specified Financial Transaction Information (Act No. 21358)"
  short: "특금법 제21358호"
summary: >
  2026-02-19 공포, 2026-08-20 시행 예정인 특금법 개정 법률. 제7조 신고 관련 조항을
  개정하여 대주주 신고사항(제1항 제1호의2)을 신설하고, 신고 불수리 사유를 4개에서
  8개로 확대하며, 신고 수리 시 조건 부과권(제10항)을 신설한다.

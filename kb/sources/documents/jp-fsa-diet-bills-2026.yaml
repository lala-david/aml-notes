  금융청 국회 제출 법률안 페이지. 「金融商品取引法及び資金決済に関する法律の一部を改正する法律」이 2026-04-10 제출되어 2026-07-15 성립했다고 기재한다. 암호자산 규제를 자금결제법에서 금융상품거래법으로 이관하는 개정이며, 이관 조항 시행일은 2026-10-21 기준 미정이다.

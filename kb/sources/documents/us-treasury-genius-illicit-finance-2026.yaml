    quote: >
      To the extent that any money transmitter's transactions constitute a
      "transmittal of funds" under FinCEN's regulations, then the money
      transmitter must comply with the "Funds Transfer Rule" or "Travel Rule."
      Under the rule, a transmittal of funds of $3,000 or more may trigger
      certain requirements on a DASP such as an exchange

    confidence: "A"
    locator: "§ 1010.410(f)"
    quote: >
      Any transmittor's financial institution or intermediary financial
      institution located within the United States shall include in any
      transmittal order for a transmittal of funds in the amount of $3,000
      or more, information as required in this paragraph (f)

  ko: "31 CFR 1010.410 (금융기관 기록 작성·보존)"
  en: "31 CFR 1010.410 — Records to be made and retained by financial institutions"
  short: "31 CFR 1010.410"
summary: >
  미국 자금이체 기록보존·정보전달 의무의 규정 근거. (e)항이 은행 아닌
  금융기관의 기록보존을, (f)항이 이체지시에 송신인 정보를 포함시킬 의무
  (이른바 Travel Rule)를 정한다. 두 항 모두 적용 기준금액은 3,000달러다.

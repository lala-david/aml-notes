label:
  ko: "EBA AML/CFT 페이지 — 2026-01-01 AMLA 권한 이관 안내"
  en: "EBA — Anti-money laundering and countering the financing of terrorism (mandate transfer to AMLA)"
  short: "EBA→AMLA 이관 안내"
summary: >
  EBA 가 2026-01-01 부터 EU 차원의 AML/CFT 정책·가이던스 권한이 AMLA 로 넘어갔고, 기존 EBA AML/CFT 가이드라인·기준(트래블룰 가이드라인 포함)은 AMLA 가 대체할 때까지 유효하다고 안내하는 페이지(AMLAR Art. 54).

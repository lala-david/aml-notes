curator_note: >
  published 는 이관 발효일로 기재했다 — 페이지 자체의 정확한 게시일은 미확인. 같은 페이지 팩트시트의 'by 2025' 표기와 본문 날짜가 어긋나나 본문(2026-01-01)을 채택. 2026 년 이후 EU 차원 AML 가이던스는 EBA 가 아니라 AMLA 명의다.

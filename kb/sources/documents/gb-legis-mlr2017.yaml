  ko: "자금세탁·테러자금조달 및 자금이체(송금인 정보) 규정 2017"
  en: "The Money Laundering, Terrorist Financing and Transfer of Funds (Information on the Payer) Regulations 2017"
  short: "MLR 2017"
summary: >
  영국 AML 체계의 중심 2차 입법. 제7A편(Part 7A)이 암호자산 이전 시
  송신인·수신인 정보 동반 의무를 정한다. 규정 64C(1)의 기본 의무에는
  금액 기준이 없고, £800 은 추가 정보 요구를 발동시키는 별개 기준이다.

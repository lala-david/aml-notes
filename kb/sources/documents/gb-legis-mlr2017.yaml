curator_note: >
  legislation.gov.uk 에서 제7A편과 규정 64C 를 조문 단위로 받아 확인했다.

  【확보 수준이 항마다 다르다 — 인용 시 주의】
  · 64C(1) 기본 의무: 축조 확인, 문언 확보 (A)
  · 64C(4) £800 조건, (5)·(6) 정보 항목: 내용은 확인했으나 **축조 문언을
    확보하지 못했다.** 요약 수준이므로 B 를 넘기지 말 것.
    특히 (4)의 발동 조건을 「수익자 사업자가 영국 밖」 으로 볼지
    「집행 사업자 전부가 영국 소재는 아닐 것」 으로 볼지 두 표현이
    엇갈렸다. 원문 재확인 전까지 조건을 단정 서술하지 않는다.

  【개정 반영 미확인】 legislation.gov.uk 의 "changes to legislation"
  배너를 확인하지 않았다. 제7A편은 2022년 개정(SI 2022/860)으로
  신설된 것으로 보이나 그 개정령 원문을 별도 확보하지 않았다 — 과제.

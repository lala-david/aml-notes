curator_note: >
  상태 전이 근거 문서: 믹싱 §311 NPRM proposed → withdrawn(관보 2026-10-06). FinCEN 보도자료(https://www.fincen.gov/news/news-releases/fincen-announces-withdrawals-proposed-digital-asset-related-rules, 2026-10-05)는 철회를 'deregulatory agenda' 의 일부로 설명한다. RIN 표기 상충(원 NPRM 1506-AB64 vs 공고 1506-AB47)은 공고 오기로 보이며, 식별은 88 FR 72701 인용으로 한다(research/2026-10-aml-landscape.md C-02). public-inspection URL 은 게재 후 federalregister.gov 정식 문서 URL 로 바뀔 수 있다 — 스냅샷 미설정.

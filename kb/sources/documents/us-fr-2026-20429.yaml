  ko: "FinCEN CVC 믹싱 §311 제안규칙 철회 공고 (FR 2026-20429)"
  en: "Withdrawal of Proposed Rule — Special Measure Regarding CVC Mixing as a Class of Transactions of Primary Money Laundering Concern"
  short: "FR 2026-20429 믹싱 철회"
summary: >
  FinCEN 이 2023-10-23 공고한 CVC 믹싱 §311 제안규칙(88 FR 72701)을 철회한다는 연방관보 공고. 2026-10-06 게재 일정(public inspection). 사유는 합법적 활동에 대한 위축 효과와 보고 부담. 공고 머리말의 RIN 은 1506-AB47 로 적혀 있어 원 NPRM 의 RIN 1506-AB64 와 다르다.

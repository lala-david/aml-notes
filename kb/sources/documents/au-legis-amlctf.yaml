curator_note: >
  【확보 완료 — 2026-08-04】 최초에는 목차만 받았으나 같은 날 전문을 확보했다.

  【접근 경로 — 해결】 legislation.gov.au 의 `/latest/text` 는 목차만 준다.
  실제 본문은 EPUB 로 제공되며 아래 경로에 통째로 들어 있다.

    https://www.legislation.gov.au/C2006A00169/{date}/{date}/text/original/
      epub/OEBPS/document_1/document_1.html

  목차의 조문 링크가 이 파일의 `#_Toc...` 앵커를 가리키므로, 목차 응답에서
  링크 대상을 읽어 경로를 역산할 수 있다. 파일이 1.97MB 라 일반적인
  페이지 요약 도구로는 뒤가 잘린다 — 직접 수신해 태그를 제거하고
  조문 단위로 잘라내야 한다.

  【이 문서로 확정된 것】
  · 제66A조 전문 (제1항~제11항)
  · 제64조 전문 — 제66A조 제3항이 참조하는 조문
  · 두 조문 어디에도 금액 조건이 없다
  · 연혁표 "s 66A ... ad No 110, 2024" — 2024년 법률 제110호로 신설

  【미확인】 시행일 2026-03-31 은 내무부 안내 기준이며 부칙 미확인.
  전달할 정보 항목을 정하는 AML/CTF Rules 는 별도 문서이며 미확보.

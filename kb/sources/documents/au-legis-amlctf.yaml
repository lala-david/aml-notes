curator_note: >
  【확보 수준 — 목차까지만】 legislation.gov.au 가 이 법률에 대해 목차만
  반환했다. 따라서 이 문서로 확정되는 것은 **조문의 존재와 표제**뿐이다.
  제66A조의 문언·요구 정보 항목·임계값 유무는 이 문서로 확정되지 않는다.
  조문 본문 확보가 최우선 과제다.

  【2차 정보로 파악한 것 — 확정 아님】
  · 가상자산 트래블룰에 금액 임계가 없다(AUSTRAC 안내 요지)
  · 주문기관은 수취 지갑이 수탁형인지 자기수탁형인지 판별할 의무를 진다
  · 수익기관이 정보를 안전하게 수신·보호할 수 없다고 볼 합리적 근거가
    있으면 정보 전달 의무가 면제되며 그 사유를 기록해야 한다
  · 「digital currency」 정의를 「virtual asset」 으로 교체해 스테이블코인·
    NFT 를 포섭
  위 네 항목은 전부 규제기관 안내·2차 자료 요지이며 조문으로 확인하지
  않았다. B 를 넘겨 인용하지 말 것.

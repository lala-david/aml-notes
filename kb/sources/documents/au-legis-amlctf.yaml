label:
  ko: "자금세탁방지 및 테러자금조달방지법 2006 (호주)"
  en: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006"
  short: "AML/CTF Act 2006"
summary: >
  호주 AML 체계의 근간 법률. 제5편(Part 5)이 「가치 이전에 관한 의무」를 정하며,
  2024년 개정으로 제66A조(가상자산 이전 관련 주문기관·수익기관 의무)가 신설되었다.
  가상자산 관련 개정은 2026-03-31 시행되었다.

label:
  ko: "호주 연방법령등록부"
  en: "Federal Register of Legislation (Australia)"
  short: "legislation.gov.au"
summary: >
  호주 연방 법령의 공식 등록·발간처. 법률·규칙의 현행 반영본을 제공한다.
  2026-08-04 실측 시 목차는 받았으나 조문 본문은 받지 못했다.
tier: "T1"
tier_basis: >
  호주 정부가 연방 법령 원문을 직접 발간하는 공식 경로. 법적 효력 있는 판본.
publisher_kind: "government"
base_url: "https://www.legislation.gov.au"
language: "en"
paywall: false
tags: ["au", "statute-text"]
created_at: "2026-08-04"
updated_at: "2026-08-04"
review_due: "2026-11-02"
curator_note: >
  【접근 경로 — 실측 제약】
    /{id}/latest/text 로 요청하면 **목차만** 반환되고 조문 본문이 오지 않는다.
    AML/CTF Act 2006(C2006A00169)은 분량이 커서 특히 그렇다.
    조문 단위 URL 형식을 아직 찾지 못했다 — 재검토 과제.
    영국 legislation.gov.uk 의 /regulation/{n} 같은 경로가 있는지 확인할 것.

  목차만으로도 「조문이 존재하고 표제가 무엇인가」는 T1 으로 확정된다.
  그러나 조문 문언·임계값은 확정되지 않는다. 이 구분을 지키지 않으면
  목차를 근거로 조문 내용을 지어내게 된다.

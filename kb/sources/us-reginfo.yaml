summary: >
  미국 행정관리예산처 정보규제국(OIRA)이 반기 단위로 발간하는 연방기관 규칙제정 계획.
  RIN 단위로 규칙의 진행 상태(Proposed / Final / Long-Term / Completed)를 추적한다.
  **연방관보가 보여주지 않는 규칙 철회를 탐지할 수 있는 유일한 공개 경로다.**

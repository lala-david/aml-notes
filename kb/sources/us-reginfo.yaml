curator_note: >
  이 출처의 존재 이유는 **소멸 경로 감시**다.
  2차 조사 실측: Travel Rule $250 하향안(2025-04-16 철회)과 비수탁 지갑 규칙(2024-04-12 철회)
  둘 다 연방관보 철회공고 없이 통합의제상 "Completed Actions" 로만 종결되었다.
  같은 기관이 ABLV 건(89 FR 79184)에서는 관보 공고를 냈으므로 형식 선택은 의도적이다.
  → 관보 API 만 감시하면 철회된 제안이 영원히 proposed 상태로 남는 좀비 노드가 된다.

  함정: pubId 202604 는 미발행 상태다. **빈 응답을 "규칙 없음"으로 오독하면 안 된다.**
  발간 여부를 먼저 확인한 뒤 내용을 해석할 것.

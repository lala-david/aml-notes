curator_note: >
  수집 인프라 주의 — fatf-gafi.org 는 robots.txt 자체가 403 을 반환하며
  표준 HTTP 클라이언트에 403 을 준다. 브라우저 헤더 일체(User-Agent·Accept·
  Sec-Fetch-*·Upgrade-Insecure-Requests)를 붙인 요청만 200 을 반환한다.
  robots 정책을 확인할 수 없으므로 자동수집을 하지 않고 수동·이메일 경로를 쓴다.
  FATF 는 RSS 를 제공하지 않는다(후보 3건 전부 실패 실측, 2026-07-30).
  → ingest/config/sources.yaml 의 FEED:intl-fatf-publications 는 robots_ok: false, disabled.

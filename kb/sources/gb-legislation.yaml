id: "SRC:gb-legislation"
type: "SRC"
layer: "semantic"
label:
  ko: "영국 법령 데이터베이스"
  en: "legislation.gov.uk"
  short: "legislation.gov.uk"
summary: >
  영국 국립문서보관소(The National Archives)가 운영하는 법령 원문 공식 제공처.
  1차 법률·2차 입법(SI)의 개정 반영본을 조문 단위 URL 로 제공한다.
  2026-08-04 실측 시 정상 응답했다.
tier: "T1"
tier_basis: >
  영국 정부가 자국 법령 원문을 직접 발간하는 공식 경로. 관보에 준하는 권위.
publisher_kind: "government"
base_url: "https://www.legislation.gov.uk"
language: "en"
paywall: false
tags: ["gb", "statute-text"]
created_at: "2026-08-04"
updated_at: "2026-08-04"
review_due: "2026-11-02"
curator_note: >
  【접근 경로 — 실측】 조문 단위로 바로 받을 수 있어 축조 확인에 유리하다.
    법령 전체:  /uksi/{year}/{no}
    편(Part):   /uksi/{year}/{no}/part/{n}
    조문:       /uksi/{year}/{no}/regulation/{n}
  SRC:gb-govuk(정부 포털)과는 별개 경로다. gov.uk 는 부처 발표를,
  이쪽은 법령 원문을 제공한다. 혼동하지 말 것.

  【주의 — 개정 반영 시차】 legislation.gov.uk 는 조문에 "changes to
  legislation" 배너로 미반영 개정을 표시한다. 원문 인용 시 그 배너 유무를
  함께 확인해야 한다. 이번 수집에서는 배너 확인을 하지 않았다 — 재검토 과제.

label:
  ko: "싱가포르 통화청"
  en: "Monetary Authority of Singapore"
summary: >
  DPT·DTSP 라이선스 주체이자 중앙은행. 고시·가이드라인을 PDF 로 발간한다.
  미디어 경로는 Referer 검사가 있어 직접 요청 시 안내 페이지가 돌아온다.
tier: "T1"
tier_basis: >
  감독기관·정부기관이 자기 소관 사항을 직접 발간하는 공식 경로.
publisher_kind: "central-bank"
base_url: "https://www.mas.gov.sg"
language: "en"
paywall: false
tags: ["sg"]
created_at: "2026-07-30"
updated_at: "2026-08-04"
review_due: "2027-01-30"
curator_note: >
  【2026-08-04 정정 — 「전면 장애」는 오진이었다】
  이 노드는 2026-07-30 에 「사이트 전면 장애로 접근 불가」로 기록됐고,
  08-04 재시도에서도 같은 판정을 내려 「36일 지속」으로 적었다.
  둘 다 틀렸다. MAS 는 **핫링크 차단**을 하고 있을 뿐이다.

    · 고시 목록 페이지 — Referer 없이도 정상 응답 (263KB)
    · `/-/media/…` PDF — Referer 없으면 「Maintenance」 HTML 반환,
      해당 고시 페이지를 Referer 로 넣으면 정상 PDF 반환

  이 오진 때문에 싱가포르가 두 라운드 동안 미등재로 남았다.
  → FACT:0000029 · DOC:sg-mas-psn02 참조.

  【교훈 — 수집 규율에 반영할 것】 「사이트 장애」로 판정하기 전에
  반환된 본문을 실제로 읽어야 한다. 200 응답에 안내 HTML 이 실려 오는
  패턴은 장애와 접근 제어를 구별하지 않으면 똑같이 보인다.
  최소한 (1) 상위 페이지도 함께 시도, (2) Referer·UA 변경 재시도,
  (3) 반환 본문의 title 확인 — 세 가지는 하고 판정할 것.

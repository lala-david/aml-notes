id: "SRC:jp-egov"
type: "SRC"
layer: "semantic"
label:
  ko: "일본 e-Gov 법령검색"
  en: "e-Gov Law Search (Japan)"
  short: "e-Gov"
summary: >
  일본 정부의 법령 원문 공식 제공 경로. 총무성 운영. 법률·정령·성령의 현행 조문을
  API 로 제공하며, 2026-08-04 실측 시 정상 응답했다.
tier: "T1"
tier_basis: >
  일본국 정부가 자국 법령 원문을 직접 발간하는 공식 경로. 관보에 준하는 권위.
publisher_kind: "government"
base_url: "https://laws.e-gov.go.jp"
language: "ja"
paywall: false
tags: ["jp", "statute-text"]
created_at: "2026-08-04"
updated_at: "2026-08-04"
review_due: "2026-11-02"
curator_note: >
  【접근 경로 — 실측】 구 도메인 elaws.e-gov.go.jp 는 laws.e-gov.go.jp 로 301
  영구이동한다. 구 도메인으로 요청하면 리다이렉트되므로 신 도메인을 직접 쓸 것.

    법령 전문:  https://laws.e-gov.go.jp/api/1/lawdata/{lawId}
    조문 단위:  https://laws.e-gov.go.jp/api/1/articles;lawId={lawId};article={n}

  전문 API 는 응답이 크면 뒤가 잘린다(施行規則 420M60000F5A001 실측 시 제13조에서
  절단). 특정 조문을 확인할 때는 조문 단위 엔드포인트를 쓰는 편이 안전하다.
  다만 「제31조의3」 같은 가지번호 조문의 article 파라미터 표기법은 아직
  확인하지 못했다 — 재검토 과제.

  【확보한 법령 ID】
    419AC0000000022  犯罪による収益の移転防止に関する法律 (법률)
    420CO0000000020  同 施行令 (정령)
    420M60000F5A001  同 施行規則 (주무성령)

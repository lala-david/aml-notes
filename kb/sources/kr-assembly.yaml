curator_note: >
  【수집 경로】 1파는 접근에 실패했으나 2파에서 확인되었다 —
  POST `/bill/bi/bill/sch/findSchPaging.do`, **인증키 불요**.
  열린국회정보 OpenAPI(인증키 필요)와 별개 경로다.

  이 출처의 가치는 **독립성**이다. 법제처와 국회는 별개 기관이므로, 두 곳의
  공포일자가 일치하면 단일 출처 확인보다 강한 근거가 된다. CTR:00001 이
  이 방식으로 해소되었다.

# ─────────────────────────────────────────────────────────────
# 불변식 (validator 강제)
# ─────────────────────────────────────────────────────────────
invariants:
  - id: I-1
    rule: "모든 노드는 evidence 를 1개 이상 갖는다"
    # SRC 는 세계에 대한 주장이 아니라 출처 인프라 기술(記述)이다. 대신 tier_basis 를 강제한다(SRC-6).
    exempt_classes: [CONCEPT, CAP, SRC]
  - id: I-2
    rule: "PROV 는 정확히 하나의 REG 에 PART_OF 로 연결된다"
  - id: I-3
    rule: "STATE.valid_from < STATE.valid_to 또는 valid_to == null"
  - id: I-4
    rule: "동일 (subject, attribute) 의 유효 STATE 구간은 겹치지 않는다"
  - id: I-5
    rule: "EVT.occurred_on <= EVT.announced_on"
  - id: I-6
    rule: "CAUSED 엣지는 from.occurred_on <= to.occurred_on"
  - id: I-7
    rule: "모든 FACT 는 EVIDENCED_BY 로 최소 1개 DOC 에 연결된다"
  - id: I-8
    rule: "confidence C 또는 D 인 노드는 review_due 가 90일 이내"
  - id: I-9
    rule: "ID 는 id_pattern 을 만족한다"
  - id: I-10
    rule: "고립 노드(엣지 0개)가 없다"
    severity: warn
  - id: I-11
    rule: "EQUIVALENT_TO 는 양방향으로 존재한다"
  - id: I-12
    rule: "어떤 노드·문서에도 비공개 조직 관련 문자열이 포함되지 않는다"
    severity: error
  - id: T-2
    rule: "CAUSED 엣지의 basis 는 temporal_only 가 아니다"
  - id: T-1
    rule: "모든 EVT 는 date_precision 을 명시한다"

# 신선도 SLA (일 단위)
freshness_sla:
  sanctions_state: 1
  reg_lifecycle: 7
  proposed_legislation: 14
  vasp_license: 30
  enforcement: 30
  incident: 30
  vendor: 90
  low_confidence_any: 90
  typology: 180
  technique: 180

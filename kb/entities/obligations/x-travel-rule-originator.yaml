id: "OBL:x-travel-rule-originator"
type: "OBL"
layer: "semantic"
label:
  ko: "송신인 정보 전달 의무"
  en: "Originator information transmission requirement"
  short: "트래블룰(송신인)"
aliases: ["travel rule originator obligation", "송금인 정보 제공 의무"]
summary: >
  가상자산 이체 시 송신 사업자가 수신 사업자에게 송신인 식별정보를 이체와 동시에
  또는 사전에 전달해야 하는 의무. 관할에서 탈각된 추상 의무이며, 각국 조문이
  IMPOSES 엣지로 이를 가리키고 임계값·자기수탁 취급 등 관할별 차이는 엣지
  한정자에 담긴다.

curator_note: >
  이 노드는 관할 비교표의 축이다. 리서치 도시에에서 확인된 관할별 임계값을
  각국 PROV 노드의 IMPOSES 한정자로 연결하면 비교표가 질의 결과로 생성된다.

  현재 결속: 한국(100만원). 검증 대기 중인 관할별 값 —
  미국 $3,000(us-regime 도시에: 시행 중, $250 하향안은 2025-04-16 철회),
  EU 임계값 없음(eu-uk-regime 도시에: EUR 1,000 은 자기수탁 소유확인 트리거일 뿐),
  영국 £800, 싱가포르 SGD 1,500, 홍콩 HKD 8,000, 일본·호주 전건.
  각각 해당 관할 PROV 노드 생성 후 연결할 것.

  SATISFIED_BY 의 sufficiency 를 partial 로 둔 이유: 메시징 프로토콜만으로는
  sunrise problem(상대 VASP 미도입)과 자기수탁 지갑 케이스를 해소하지 못한다.

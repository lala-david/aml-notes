id: "OBL:x-travel-rule-originator"
type: "OBL"
layer: "semantic"
label:
  ko: "송신인 정보 전달 의무"
  en: "Originator information transmission requirement"
  short: "트래블룰(송신인)"
aliases: ["travel rule originator obligation", "송금인 정보 제공 의무"]
summary: >
  가상자산을 보낼 때, 보내는 쪽 사업자가 받는 쪽 사업자에게 "누가 보냈는지"를 이체와 동시에 또는 그 전에
  알려야 하는 의무. 나라를 가리지 않는 공통 형태로 적어 둔 것이며, 이 의무를 실제로 정하는 조문은
  나라마다 다르다. 기준금액이나 개인지갑 취급 같은 나라별 차이는 각 조문 쪽에 붙어 있다.
obl_kind: "information-transmission"

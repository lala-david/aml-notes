summary: >
  송수신 사업자 간 이체 당사자 정보를 표준 데이터 모델로 교환하는 통제 수단.
  IVMS101 데이터 모델과 프로토콜 구현(TRP·TRISA·OpenVASP 및 상용 네트워크)으로
  구성된다. 상대 사업자가 동일 네트워크에 없으면 작동하지 않는다(sunrise problem).

id: "CONCEPT:x-virtual-asset"
type: "CONCEPT"
layer: "semantic"
label:
  ko: "가상자산"
  en: "Virtual asset"
aliases: ["virtual asset", "crypto-asset", "암호자산", "디지털자산"]
summary: >
  규제 대상이 되는 디지털 가치 표상. **관할마다 정의가 다르며 그 차이가
  규제 적용 범위를 가른다.** FATF 는 "virtual asset", EU 는 "crypto-asset",
  한국은 "가상자산"이라는 서로 다른 용어와 정의를 쓴다.
definition_ko: >
  경제적 가치를 지니고 전자적으로 거래 또는 이전될 수 있는 전자적 증표
  (한국 특금법 제2조제3호 계열 정의). 각국 정의의 정확한 문언은 DEFINES 엣지로
  연결된 조문(PROV)을 참조할 것.
definition_en: >
  A digital representation of value that can be digitally traded or transferred
  and used for payment or investment purposes (FATF 계열 정의).
contested: true
tags: ["definition", "cross-jurisdiction", "contested"]
created_at: "2026-07-30"
updated_at: "2026-07-30"
review_due: "2026-10-28"
curator_note: >
  **contested: true** — 이 개념은 관할마다 다르게 정의된다. 여기 적은 정의는
  요약이며 **법적 근거로 인용하면 안 된다.** 반드시 DEFINES 엣지로 연결된
  조문 원문(PROV.text_orig)을 확인할 것.

  【DEFINES 연결 현황 — 2026-07-31】
    [등재] 특금법 제2조제3호 (PROV:kr-tfia-art2-3) — 확신도 B
    [등재] 가상자산이용자보호법 제2조 (PROV:kr-vaupa-art2) — 확신도 B, 특금법과 EQUIVALENT_TO
    [등재] MiCA 제3조(1)(5) "crypto-asset" (PROV:eu-mica-art3-1-5) — 확신도 C
    [미등재] FATF Glossary "virtual asset" — 미등재. 권고안 PDF 의 Glossary 절을 확보해야 한다
    [미등재] 미국 — BSA 는 가상자산 전용 정의를 두지 않고 MSB 정의의
       "other value that substitutes for currency" 문언으로 포섭한다(31 CFR 1010.100(ff)).
       즉 **정의 조항이 없는 것 자체가 특징**이므로 그 사실을 어떻게 표현할지 판단 필요.

  등재된 셋 모두 **원문 문언(text_orig) 미확보**다. 정의 조항은 제외 열거가
  규제 범위를 직접 가르므로 축조 확인 없이 인용하면 안 된다.

  하위 개념(NARROWER)으로 스테이블코인·NFT 등을 분리 등재할 것.

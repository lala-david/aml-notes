curator_note: >
  【모델링 주의】 ASAP 는 기관이 아니라 금융보안원이 운영하는 플랫폼이다. 법정 지정(정보공유분석기관)을 받는 주체는
  금융보안원이다. 금융보안원 자체의 ORG 노드가 없어 이 노드가 둘을 함께 대표한다 — 금융보안원 ORG 신설 시
  이 노드를 그쪽으로 MERGED_INTO 하거나 플랫폼 노드로 남길지 결정할 것. org_kind 열거값에 「정보공유 인프라」가
  없어 association 으로 두었다(금융보안원은 금융회사 회원 기반 기관).

  【가상자산거래소 참여】 2025-10-29 출범 자료에는 가상자산거래소가 참여기관으로 명시되지 않았고 DAXA 의장이 업계
  대표로 참석했다. 2026-01-28 자료는 「순차 참여 확대」 대상으로, 2026-08-04 자료는 법령상 대상기관으로 적는다.
  2026-10-21 현재 실제 연동 여부는 어느 자료에서도 확인되지 않는다.

  성과 수치(186.5억원·2,705계좌)는 금융당국 공표치이며 독립 검증된 값이 아니다.

label:
  ko: "금융보안원 보이스피싱 정보공유·분석 AI 플랫폼 (ASAP)"
  en: "Financial Security Institute — AI-based anti-phishing Sharing & Analysis Platform (ASAP)"
  short: "ASAP"
aliases: ["ASAP", "AI-based anti-phishing Sharing & Analysis Platform", "금융보안원 ASAP", "정보공유분석기관"]
plain: >
  금융회사들이 보이스피싱 의심 계좌 정보를 실시간으로 나눠 보는 금융보안원의 공동 플랫폼입니다. 2026-08-04 부터
  금융보안원이 법에 따른 정보공유분석기관이 됐고, 가상자산거래소도 대상기관에 들어갑니다.
summary: >
  금융보안원이 2025-10-29 출범시킨 보이스피싱 정보공유·분석 플랫폼. 참여 금융회사 약 130개가 9개 유형·90개
  항목을 실시간 공유하고, FDS 가 탐지한 의심계좌와 수사기관 정보로 공동 AI 탐지모델을 만든다. 출범 후 12주간
  (2025-10-29~2026-01-21) 186.5억원 피해 방지·2,705개 계좌 조치를 금융당국이 공표했다. 법률 제21320호 시행일
  2026-08-04 에 금융보안원이 통신사기피해환급법상 「정보공유분석기관」으로 지정됐다.

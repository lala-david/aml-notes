id: "ROLE:x-ontologist"
type: "ROLE"
layer: "kinetic"
label:
  ko: "온톨로지 관리자"
  en: "Ontologist"
summary: >
  클래스·술어 정의를 변경하고 식별자 발급 규칙을 관리한다. 노드 병합·폐기 권한을
  가지며, 온톨로지 변경에는 ADR 작성이 필수다.
is_agent: false
tags: ["governance", "human", "schema"]
can_execute:
  - "ACTION:x-amend-node"
cannot_execute:
  - "ACTION:x-transmit-originator-info"
scope:
  node_types: ["*"]
  writable_paths: ["kb/schema/", "kb/entities/"]
  properties_readonly: ["id", "created_at"]
constraints:
  - "클래스·술어 추가·변경 시 ADR 을 작성한다"
  - "기존 술어의 의미를 변경하지 않는다 — 새 술어를 만들고 구 술어를 deprecate 한다"
  - "노드를 삭제하지 않는다 — status: deprecated 또는 merged 로만"
  - "발급된 ID 를 변경하지 않는다"
created_at: "2026-07-30"
updated_at: "2026-07-30"
review_due: "2027-01-30"
curator_note: >
  2026-07-30 작업에서 ADR-0004(Kinetic 계층 정정)·DELEGATES_TO 술어 신설·
  식별자 규격 수정을 이 역할로 수행했으나 노드가 없어 ALOG 가 댕글링 참조를 냈다.
  K-3 검사가 이를 잡았다.

  can_execute 가 x-amend-node 하나뿐인 것은 나머지 온톨로지 액션
  (x-merge-node · x-deprecate-node 등)이 아직 노드로 등재되지 않았기 때문이다.
  → 03-kinetic-layer.md §3.1 표의 11개 액션 전량 등재가 과제다.

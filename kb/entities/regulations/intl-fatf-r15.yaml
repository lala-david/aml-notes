curator_note: >
  이 노드가 가상자산 트래블룰 계보의 실제 뿌리다 — R.16 이 아니다 (CTR:00002).
  2025-06 개정으로 확대된 정보요건은 INR.15 각주 48(→INR.16 §9 참조)을 경유해
  간접 유입되며, 법적 근거 자체는 INR.15 §7(b)에 머문다.

  binding: soft-law — 권고안은 조약이 아니다. 그러나 회색명단 등재 위험이
  사실상의 강제력을 만든다. 이 이중성은 IMPLEMENTS 엣지의 fidelity 한정자로
  각국 이행 충실도를 기록해 표현한다.

  확신도 B — 현재 증거가 특금법 문서의 상호참조뿐이다. 이용자보호법 자체의
  법령 원문(법령ID 확보 필요)으로 재결속하고 조문을 PROV 로 분리할 것.
  OC 발급 후 law.go.kr 에서 수집 가능하다.

  【2축 구조】 특금법 제2조제1호 하목·제3호가 이 법 제2조를 참조하므로,
  가상자산 정의가 두 법 사이에 결합되어 있다. 정의 변경 시 양쪽 모두 영향받는다.
  → CONCEPT:x-virtual-asset 의 DEFINES 엣지로 표현할 것.

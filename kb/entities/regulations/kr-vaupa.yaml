id: "REG:kr-vaupa"
type: "REG"
layer: "semantic"
label:
  ko: "가상자산 이용자 보호 등에 관한 법률"
  en: "Act on the Protection of Virtual Asset Users"
  short: "가상자산이용자보호법"
aliases: ["이용자보호법", "가상자산법", "VAUPA"]
plain: >
  이용자를 보호하고 시세조종 같은 불공정거래를 처벌하는 법률입니다. 자금세탁을 막는 특금법과 짝을 이루며, 두 법이
  "가상자산"의 뜻을 서로 참조합니다.
summary: >
  가상자산 이용자 보호와 불공정거래 규율을 담당하는 법률. 2024-07-19 시행.
  예치금 보호·이상거래 감시 의무·불공정거래 처벌을 규정한다.
  특금법(AML)과 2축을 이루며 가상자산 정의를 상호참조한다.
reg_kind: "statute"
binding: "binding"
language: "ko"
tags: ["korea", "user-protection", "market-abuse"]

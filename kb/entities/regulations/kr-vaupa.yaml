curator_note: >
  【2026-10-21 갱신】 이용자보호법 자체 원문(법제처 lsiSeq=290735, efYd=20261002)으로 재결속해 확신도를
  A 로 올렸다(FACT:0000212). 제12조(이상거래에 대한 감시)를 PROV:kr-vaupa-art12 로 분리했다. 제12조의
  하위 규범 — 시행령 제18조(이상거래의 범위)와 금융위 고시 「가상자산시장조사업무규정」 제3조·제4조 — 은
  아직 REG 노드가 없어 DELEGATES_TO 엣지 대신 PROV:kr-vaupa-art12 의 curator_note 에 적었다 → REG 신설 과제.

  ISSUED_BY → ORG:kr-fsc 는 소관 부처 기준의 잠정 처리다(발령 주체 모델링 미해결 — REG:kr-tfia 와 동일 논점).

  【2축 구조】 특금법 제2조제1호 하목·제3호가 이 법 제2조를 참조하므로,
  가상자산 정의가 두 법 사이에 결합되어 있다. 정의 변경 시 양쪽 모두 영향받는다.
  → PROV:kr-vaupa-art2 의 DEFINES 엣지로 표현했다. 통신사기피해환급법 제2조제1호 하목도 이 법 제2조제2호·
  제4호를 인용해 「가상자산거래소」를 정의한다(REG:kr-tsf-act).

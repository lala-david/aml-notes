id: "REG:kr-vaupa"
type: "REG"
layer: "semantic"
label:
  ko: "가상자산 이용자 보호 등에 관한 법률"
  en: "Act on the Protection of Virtual Asset Users"
  short: "가상자산이용자보호법"
aliases: ["이용자보호법", "가상자산법", "VAUPA"]
plain: >
  이용자를 보호하고 시세조종 같은 불공정거래를 처벌하는 법률입니다. 자금세탁을 막는 특금법과 짝을 이루며, 두 법이
  "가상자산"의 뜻을 서로 참조합니다. 거래소에 시세조종 같은 이상거래를 늘 감시하라는 의무(제12조)도 여기 있습니다.
summary: >
  가상자산 이용자 보호와 불공정거래 규율을 담당하는 법률. 제정 법률 제19563호(2023-07-18 공포),
  2024-07-19 시행. 2026-10-21 기준 현행본은 법률 제21857호(2026-08-04 타법개정, 2026-10-02 시행).
  예치금·가상자산 보관, 불공정거래 금지(제10조), 이상거래 상시감시(제12조), 과징금(제17조)·벌칙(제19조)·
  과태료(제22조)를 규정한다. 특금법(AML)과 2축을 이루며 가상자산 정의를 상호참조한다.
reg_kind: "statute"
citation: "법률 제21857호 (2026-08-04 공포, 2026-10-02 시행, 타법개정, 현행) ← 제정 법률 제19563호 (2023-07-18 공포, 2024-07-19 시행)"

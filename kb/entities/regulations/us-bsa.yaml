curator_note: >
  【2026-10-21 갱신 — 기준일 상태】
  · Travel Rule: 31 CFR 1010.410(f) "$3,000 or more" in-force(DOC:us-lii-cfr-1010-410).
    재무부 2026-03 의회보고서 각주 63 이 송금업자인 DASP 에도 적용됨을 재확인.
    1010.410 에 걸린 미시행 개정(89 FR 72274)은 투자자문업자 규칙의 (e)(6) 제외목록 수정,
    2028-01-01 연기 — 가상자산 트래블룰과 무관.
  · $250 하향안(RIN 1506-AB41, 85 FR 68005, 2020-10-27): withdrawn 2025-04-16(통합의제).
  · 비수탁지갑 NPRM(85 FR 83840, 2020-12-23): **withdrawn — 연방관보 철회 공고 2026-10-06**
    (DOC:us-fr-2026-20430). 통합의제상 종결(2024-04-12)과 관보 철회(2026-10-06)는 별개 행정행위.
  · CVC 믹싱 §311 NPRM(88 FR 72701, 2023-10-23, 원 RIN 1506-AB64): **withdrawn — 관보
    2026-10-06**(DOC:us-fr-2026-20429). 철회 공고의 RIN 표기는 1506-AB47(비수탁지갑과 동일) —
    공고 오기로 보며 88 FR 72701 인용으로 식별. Fall 2025 통합의제의 "최종조치 목표 2027-12"는
    더 이상 유효하지 않다.
  · A7 Network 하위대리인 자금이체 금지 특별조치 NPRM(RIN 1506-AB77, 관보 2026-10-05):
    proposed. 근거는 §311 이 아니라 Combating Russian Money Laundering Act §9714.
  · OFAC 2026 축(이 노드의 엣지 아님, 산문 참고): Operation Economic Outcast(2026-08-24~),
    BitBank 등 지정(2026-09-17, E.O. 13902), A7 Network TCO 지정(2026-10-01, B — FinCEN NPRM 각주 인용).

  【폐기된 이전 서술(2026-07-30) — 기록용】
  "CVC 믹싱 §311 규칙은 proposed, 최종조치 목표 2027-12", "위 철회 2건 모두 연방관보 공고 없음"
  → 2026-10-06 관보 공고 2건으로 둘 다 틀리게 됐다. FACT:0000011·0000012 의 "관보 공고 없음"
  서술은 facts 담당 작업에서 새 줄(정정)로 처리해야 한다 — 이 노드에서는 덮어쓰지 않음.

  남은 과제: 31 CFR 1010.100(ff) MSB 정의 조문을 PROV 로 분리.

  ISSUED_BY 를 ORG:us-fincen 으로 둔 것은 잠정 처리다. BSA 는 의회 제정 법률이고
  FinCEN 은 집행·규칙제정 기관이므로, 한국 REG:kr-tfia 와 동일한 문제가 있다.
  → 발행 주체 모델링을 ADR 로 확정할 것 (REG:kr-tfia curator_note 참조).

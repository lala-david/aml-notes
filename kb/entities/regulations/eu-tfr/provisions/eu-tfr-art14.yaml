curator_note: >
  CELLAR 내용협상으로 전문을 받아 축조 확인했다(DOC:eu-tfr-2023-1113 참조).
  text_orig 는 제14조 제1항 전문이다. 제2항(수신인 정보)은 별도 조문 노드가
  아니라 이 노드의 범위에 함께 두었다 — 필요해지면 분리한다.

  【임계값 없음의 근거】 원문에서 EUR 1 000 이 나오는 자리를 전수 확인했다.
  암호자산 관련 등장은 자기수탁 주소 소유·통제 평가 의무(제14조 제5항,
  제16조 제2항)뿐이고, 정보 동반 의무 자체에는 금액 기준이 없다.
  따라서 IMPOSES 한정자에 threshold 를 넣지 않았다.
  "EU 트래블룰 임계값 EUR 1,000" 은 흔한 오해다.

  valid_from(2024-12-30)은 TFR 적용개시일로 알려진 값이며 MiCA 의 CASP 적용
  개시일과 같다. 이 문서의 최종 조항으로 직접 확인하지 않았다 — 제39조
  (적용개시)를 축조 확인해 채울 것. 재검토 과제.

  자기수탁 주소 평가 의무(EUR 1,000)는 트래블룰과 성격이 다른 별개 의무이므로
  OBL 을 새로 만들어 걸어야 한다 — 미등재. 과제로 남긴다.

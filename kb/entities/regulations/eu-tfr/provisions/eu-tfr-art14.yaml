id: "PROV:eu-tfr-art14"
type: "PROV"
layer: "semantic"
label:
  ko: "EU 자금이체규정 제14조 (암호자산 이체 시 동반정보)"
  en: "TFR Article 14 — Information accompanying transfers of crypto-assets"
  short: "TFR 제14조"
plain: >
  EU 에서 암호자산을 보낼 때 누가 보냈는지를 함께 넘기라고 정한 조항입니다. 금액과 상관없이 모든 이체에
  적용된다는 점이 한국·미국과 다릅니다.
summary: >
  암호자산서비스제공자가 암호자산 이체에 송신인 정보를 동반시킬 의무의 근거 조항.
  이름·분산원장 주소·계정번호·주소지(또는 생년월일과 출생지)를 요구하며,
  **정보 동반 의무 자체에는 기준금액이 없다.** EUR 1,000 은 자기수탁 주소의
  소유·통제 여부를 평가할 의무를 발동시키는 별개의 기준이다.
parent_reg: "REG:eu-tfr"
citation_path: "Article 14"
heading: "Information accompanying transfers of crypto-assets"
language: "en"
text_orig: >
  The crypto-asset service provider of the originator shall ensure that
  transfers of crypto-assets are accompanied by the following information on
  the originator: (a) the name of the originator; (b) the originator's
  distributed ledger address, in cases where a transfer of crypto-assets is
  registered on a network using DLT or similar technology, and the crypto-asset
  account number of the originator, where such an account exists and is used to
  process the transaction; (c) the originator's crypto-asset account number, in
  cases where a transfer of crypto-assets is not registered on a network using
  DLT or similar technology; (d) the originator's address, including the name of
  the country, official personal document number and customer identification
  number, or, alternatively, the originator's date and place of birth; and
  (e) subject to the existence of the necessary field in the relevant message
  format, and where provided by the originator to its crypto-asset service
  provider, the current LEI or, in its absence, any other available equivalent
  official identifier of the originator.
tags: ["eu", "travel-rule", "crypto-asset", "no-threshold"]

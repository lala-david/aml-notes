curator_note: >
  2026-07-30 저장소는 이 규정의 최신본을 제2024-1호(2024-06-27)로 기록했다(FACT:0000018). 2026-08-20
  제2026-2호, 2026-10-02 제2026-3호로 두 번 개정됐다(FACT:0000209). 제2026-3호의 개정 내용은 법제처
  XML 에 개정이유가 없어 확인하지 못했다.

  제2026-2호 부칙: 본칙 2026-08-20 시행, 제26조(환산 기준)·제28조의2·제31조제3호는 「공포 후 6개월이
  경과한 날」 시행, 시행 전 신고 사업자에 대해 별표2 제1호가목(부채비율)·별표3 은 시행 후 1년이 경과한 날부터
  적용. 「공포 후 6개월」의 기산점이 미확정이라 제28조의2 시행일은 2027-02-19 또는 2027-02-21 로 갈린다
  (FACT:0000206) — 산문에는 날짜를 확정하지 말고 「2027-02 중, 미확정」으로 쓴다.

  같은 FIU 고시 계열의 「자금세탁방지 및 공중협박자금조달금지에 관한 업무규정」(AML 업무규정, 고시 제2025-2호,
  2025-10-22 발령, 2026-01-22 시행 — 보고서 연대기 표)은 별개 규범이며 이 노드에 포함하지 않는다.

id: "REG:kr-fiu-supervisory-rule"
type: "REG"
layer: "semantic"
label:
  ko: "특정 금융거래정보 보고 및 감독규정"
  en: "Regulation on Reporting and Supervision of Specified Financial Transaction Information"
  short: "감독규정(FIU 고시)"
aliases: ["특금법 감독규정", "FIU 감독규정", "특정 금융거래정보 보고 및 감독규정"]
plain: >
  특금법과 시행령이 "자세한 기준은 FIU 가 고시하라"고 넘긴 부분을 담은 FIU 고시입니다. 2027년부터 해외 거래소·
  개인지갑으로 보낼 때의 허용 기준과 1천만원 감시 금액이 여기 적혀 있습니다.
summary: >
  금융정보분석원장이 고시하는 행정규칙. 2026-10-21 기준 현행본은 고시 제2026-3호(2026-10-02 발령·시행)이며,
  직전 제2026-2호(2026-08-20 발령·시행)가 외국 가상자산사업자·자기수탁 주소와의 거래 기준(제28조의2)을
  두었다. 제28조의2 는 부칙에 따라 「공포 후 6개월이 경과한 날」부터 시행하며 2026-10-21 기준
  enacted-not-in-force 다. 「특정 금융거래정보 보고 등에 관한 검사 및 제재규정」과는 별개의 행정규칙이다.
reg_kind: "subordinate-rule"
citation: "금융정보분석원 고시 제2026-3호 (2026-10-02 발령·시행, 일부개정, 현행) ← 제2026-2호 (2026-08-20 발령·시행, 일부개정; 제26조·제28조의2·제31조제3호는 공포 후 6개월 경과일 시행)"

curator_note: >
  확신도 C — 리서치 도시에(eu-uk-regime, T1 28건)에서 사실은 확인되었으나
  아직 KB 에 DOC 노드로 등재하지 않았다. EUR-Lex CELEX 32023R1114 를 DOC 으로
  만들어 재결속할 것. **최우선 재검토 과제.**

  **발효일(entry into force)과 적용개시일(date of application)을 구분할 것.**
  발효 2023-06-29 ≠ 적용개시 2024-12-30. 이 혼동이 EU 규정에서 가장 흔한 오류다.
  상태 이력은 STATE 레코드로 분리 관리해야 한다.

  EUR-Lex 는 robots.txt 로 원문 경로 크롤링을 금지한다. CELLAR SPARQL
  (SRC:eu-publications) 을 써야 한다.

  【2026-10-21 갱신】
  · 원문 DOC(DOC:eu-mica-2023-1114, CELLAR 내용협상으로 확보)를 HAS_JURISDICTION·노드 증거에
    추가 — 위 "DOC 노드 미등재" 과제는 해소. x-source-probe 증거는 이력으로 남긴다.
  · 인가 통계: ESMA 임시 CASP 등록부 2026-10-19 갱신본 379행·고유 LEI 376개, 본국별
    DE 109·FR 36·NL 29·CY 25·MT 23, 인가 종료일 기재 2건(DOC:eu-esma-casps-20261019).
    행 수 ≠ 사업자 수(동일 LEI 다중행 3건). 등록부는 주간 갱신되므로 수치는 METRIC 로 옮길 후보.
  · MiCA 재검토: AMLA 가 2026-10-07 집행위 MiCA 재검토 의견수렴에 AML 우선과제 5개
    (스테이킹·대출, DeFi 통제자 정의, 무인가 스테이블코인, ART 발행자, 국경간 감독 정보요건)를 제출
    (https://www.amla.europa.eu/amla-identifies-amlcft-priorities-review-mica_en). 개정은 입법 제안 전.
  · ISSUED_BY ORG:eu-commission 은 잠정이다 — MiCA 는 유럽의회·이사회 규정이다. 발행 주체
    모델링 ADR 확정 시 함께 정리할 것.


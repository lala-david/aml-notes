curator_note: >
  한국 REG:kr-tfia-sd 와 같은 구조적 위치다 — 법률이 위임한 실무 숫자가
  여기 모여 있으므로 법 개정 없이 이것만 바꿔도 기준이 달라진다.
  감시 우선순위가 높다.

  【이 노드를 만든 이유】 산문 계층이 이 시행령 제7조의 10만엔을
  「일본 트래블룰 임계금액」 으로 옮겨 적고 있었다. 조문을 노드로 분리해
  두어야 그 오귀속이 다시 발생하지 않는다.

  개정 이력·공포일은 미확인. published(2008-02-01)는 제정 정령번호에서
  추정한 값이 아니라 e-Gov 메타의 제정일이며, 현행본의 최종개정
  정령번호는 확인하지 않았다 — 재검토 과제.

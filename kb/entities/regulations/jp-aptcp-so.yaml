id: "REG:jp-aptcp-so"
type: "REG"
layer: "semantic"
label:
  ko: "범죄에 의한 수익의 이전방지에 관한 법률 시행령"
  en: "Enforcement Order of the Act on Prevention of Transfer of Criminal Proceeds"
  short: "범수법 시행령"
aliases: ["犯罪による収益の移転防止に関する法律施行令", "犯収法施行令", "범수법 시행령"]
plain: >
  범수법이 정부에 넘긴 세부사항을 채운 정령입니다. "어떤 거래부터 고객확인을 해야 하는가"의 금액 기준이
  여기 있습니다. 자주 트래블룰 기준으로 잘못 인용되는 10만엔이 이 문서의 제7조에 있습니다.
summary: >
  범수법의 위임사항을 정하는 정령. 제7조가 특정거래(特定取引)를 유형별로 열거하며
  각 유형의 금액 기준을 정한다. 암호자산의 교환·이전은 가액 10만엔 초과 시
  특정거래가 되어 거래시확인(CDD) 의무가 발동한다.
  **이 금액은 통지의무(트래블룰) 기준이 아니다.**
reg_kind: "decree"

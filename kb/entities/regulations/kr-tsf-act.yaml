id: "REG:kr-tsf-act"
type: "REG"
layer: "semantic"
label:
  ko: "전기통신금융사기 피해 방지 및 피해자산 환급에 관한 특별법"
  en: "Special Act on the Prevention of Telecommunications Financial Fraud and Refund of Damaged Assets"
  short: "통신사기피해환급법"
aliases: ["통신사기피해환급법", "보이스피싱 특별법", "전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법"]
plain: >
  보이스피싱 피해를 막고 돌려받게 하는 법입니다. 2026-10-01 부터 가상자산거래소도 은행처럼 의심 계정의 출금을
  멈추고, 피해자에게 돌려주는 절차를 따라야 합니다. 한국 FDS(이상금융거래탐지)의 실질적인 법적 근거입니다.
summary: >
  금융회사등에 자체점검을 상시 실시해 피해의심거래계좌등으로 추정되면 이체·송금·출금·가상자산 이전을 지연·일시정지
  하는 임시조치(제2조의5), 금융거래 목적 확인(제2조의6), 지급정지(제4조)와 피해환급을 의무화한다. 법률 제21503호
  (2026-03-31 공포, 2026-10-01 시행)가 가상자산거래소를 「금융회사등」에 넣고 제명을 「피해자산 환급」으로 바꿨다.
  법률 제21320호(2026-02-03 공포, 2026-08-04 시행)는 정보공유분석기관(제13조의4)과 동의 없는 의심정보 공유 근거를,
  법률 제20368호(2024-02-27 공포, 2024-08-28 시행)는 거래목적 확인·한도제한 계좌 등을 도입했다.

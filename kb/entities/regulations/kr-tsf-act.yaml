curator_note: >
  【FDS 의 법적 지위】 한국 전자금융 FDS 는 전자금융감독규정(고시 제2026-29호)에 용어조차 없는 가이드라인·자율배상
  영역이다. 보이스피싱 계열 FDS 의 실질적 법정 근거가 이 법 제2조의5(「자체점검을 상시적으로 실시」)다
  (fds 도시에 F-001~F-011). 가상자산이용자보호법 제12조(시장감시)·특금법 제4조(STR)와는 목적·산출물이 다르다.

  【가상자산거래소 편입 — FACT:0000210】 제2조제1호 하목이 가상자산이용자보호법 제2조제2호·제4호를 인용해
  「가상자산거래소」를 정의한다 — 술어 REFERENCES 가 스키마에 없어 엣지로 표현하지 않았다. 부칙 제2조는 가상자산
  피해자 규정을 시행 전 범행에도 적용한다. 부칙 제3조~제5조: 임시조치·거래목적 확인·지급정지 개정규정은 시행
  이후 발생 건부터 적용.

  【정보공유분석기관】 법률 제21320호 시행일(2026-08-04)에 금융위가 금융보안원을 정보공유분석기관으로 지정했다
  (ORG:kr-fsi-asap). 가상자산거래소는 법령상 대상기관이나 2026-10-21 현재 실제 연동 여부는 확인되지 않았다.

  【법률 제20368호】 공포일·시행일(2024-08-28)은 fds 도시에 F-017(금융위 보도자료 T2 + law.go.kr 부칙 목록) 기준이며
  이 노드의 DOC 로 직접 결속하지 않았다.

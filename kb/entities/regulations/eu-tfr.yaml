label:
  ko: "자금이체규정 (TFR)"
  en: "Transfer of Funds Regulation"
  short: "TFR"
aliases: ["TFR", "Regulation (EU) 2023/1113"]
summary: >
  자금 및 특정 암호자산 이체 시 당사자 정보 첨부를 요구하는 EU 규정.
  가상자산 이체에는 **임계값이 없다** — 모든 이체에 적용된다.
  EUR 1,000 은 자기수탁 지갑 주소의 소유 확인 의무를 발동시키는 기준이지
  정보 첨부 면제선이 아니다.

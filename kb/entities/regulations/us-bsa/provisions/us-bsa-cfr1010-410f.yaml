id: "PROV:us-bsa-cfr1010-410f"
type: "PROV"
layer: "semantic"
label:
  ko: "31 CFR 1010.410(f) (이체지시 동반정보 — 트래블룰)"
  en: "31 CFR 1010.410(f) — Travel Rule"
  short: "31 CFR 1010.410(f)"
plain: >
  미국에서 돈을 보낼 때 3,000달러 이상이면 보내는 사람 정보를 이체지시에 넣어 함께 보내라고 정한 규정입니다.
  가상자산을 직접 언급하지는 않고, 거래소를 송금업자로 보는 다른 규정을 거쳐 적용됩니다.
summary: >
  미국 트래블룰의 규정 근거. 미국 내 송신 금융기관·중개 금융기관은
  **3,000달러 이상**의 자금이체에 대해 송신인 성명·계좌번호·주소·금액·실행일과
  수신 금융기관 정보를 이체지시에 포함시켜야 한다. 조문 자체는 가상자산을
  언급하지 않으며, 가상자산사업자 적용은 MSB 정의를 경유한다.
parent_reg: "REG:us-bsa"
citation_path: "31 CFR 1010.410(f)"
heading: "Records to be made and retained by financial institutions"
language: "en"
text_orig: >
  Any transmittor's financial institution or intermediary financial institution
  located within the United States shall include in any transmittal order for a
  transmittal of funds in the amount of $3,000 or more, information as required
  in this paragraph (f): (1) A transmittor's financial institution shall include
  in a transmittal order, at the time it is sent to a receiving financial
  institution, the following information: (i) The name and, if the payment is
  ordered from an account, the account number of the transmittor; (ii) The
  address of the transmittor …; (iii) The amount of the transmittal order;
  (iv) The execution date of the transmittal order; (v) The identity of the
  recipient's financial institution;

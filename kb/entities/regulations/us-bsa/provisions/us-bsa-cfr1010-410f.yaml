curator_note: >
  eCFR API 로 title-31 2026-07-29 발행본을 받아 (e)항·(f)항을 축조 확인했다.
  3,000달러 기준은 두 항 모두에 나온다. (e)는 기록보존(Recordkeeping Rule),
  (f)가 정보전달(Travel Rule)이다 — 흔히 뭉뚱그리지만 별개 항이다.

  【확신도가 갈리는 지점】 조문 문언은 A 다. 그러나 이 조문이 가상자산에
  적용된다는 명제는 조문 안에 없다. "transmittal of funds" 를 규율할 뿐이고,
  가상자산사업자는 MSB 정의(31 CFR 1010.100(ff)(5)(i)(A) 의 "other value
  that substitutes for currency")를 거쳐 포섭된다. 그 조문과 FinCEN 2019
  지침을 등재하기 전까지 IMPOSES 엣지는 B 를 넘길 수 없다.
  → 최우선 재검토 과제. 한국 사례에서 이미 같은 유형의 오류를 냈다 —
  "의무를 부과하는 조문" 과 "적용 범위를 정하는 조문" 은 다르다.

  【시행 예정 개정】 89 FR 72274 (2024-09-04 공포) 개정이 두 차례 연기되어
  2028-01-01 시행 예정이다(91 FR 36, 2026-01-02).
  [2026-07-31 기록] 「개정 내용은 이 조문 본문에 없으므로 연방관보 원문을 따로 확보해야 한다.」
  → [2026-10-21 해소, 보고서 부록 A-21] 89 FR 72274 는 투자자문업자 AML/CFT 규칙
  (FR 2024-19260)이 **(e)(6) 제외목록**에 투자자문업자를 추가한 개정이다. (f)항(트래블룰)의
  문언·금액을 바꾸지 않으며 가상자산 트래블룰과 무관하다(LII 주석 + Federal Register API 요약,
  research/2026-10-travel-rule.md F-038, T1/A).
  FinCEN·FRB 의 임계값 250달러 하향안(RIN 1506-AB41; 85 FR 68005, 2020-10-27)은 이와
  별개이며 **2025-04-16 철회**(withdrawn)되었다 — Spring 2025 Unified Agenda 「Completed
  Actions — Withdrawn 04/16/2025」, 연방관보 별도 철회 고시 없음(F-037).
  「US 2025 개정 제안 $1,000」 같은 안은 존재가 확인되지 않는다.

  【가상자산 적용 근거 보강 — 2026-10-21】 재무부 2026-03 의회보고서 각주 63 이 송금업자인
  DASP 에 Travel Rule 이 「$3,000 or more」에서 적용될 수 있다고 직접 서술한다(F-040, T1/A).
  IMPOSES 엣지에 A 증거를 추가했다. 2026-07-31 의 B 증거(eCFR 문언만으로는 적용 경로 미확인)는
  당시 판단 기록으로 남긴다 — 크로스워크는 최소 확신도를 표시하므로 B 로 보일 수 있으나,
  적용 경로는 이제 1차 문서로 확인됐다. MSB 정의(31 CFR 1010.100(ff)) PROV 등재는 여전히 과제.
  2026-10-21 기준 상태: in-force, 기준 USD 3,000 「or more」(이상), 2026-08-04 이후 변경 없음.

  valid_from 은 비워 두었다. 이 조문의 최초 시행일을 원문으로 확인하지
  않았고, 추정으로 채우면 시점 질의가 조용히 틀린 답을 낸다.

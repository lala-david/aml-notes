curator_note: >
  eCFR API 로 title-31 2026-07-29 발행본을 받아 (e)항·(f)항을 축조 확인했다.
  3,000달러 기준은 두 항 모두에 나온다. (e)는 기록보존(Recordkeeping Rule),
  (f)가 정보전달(Travel Rule)이다 — 흔히 뭉뚱그리지만 별개 항이다.

  【확신도가 갈리는 지점】 조문 문언은 A 다. 그러나 이 조문이 가상자산에
  적용된다는 명제는 조문 안에 없다. "transmittal of funds" 를 규율할 뿐이고,
  가상자산사업자는 MSB 정의(31 CFR 1010.100(ff)(5)(i)(A) 의 "other value
  that substitutes for currency")를 거쳐 포섭된다. 그 조문과 FinCEN 2019
  지침을 등재하기 전까지 IMPOSES 엣지는 B 를 넘길 수 없다.
  → 최우선 재검토 과제. 한국 사례에서 이미 같은 유형의 오류를 냈다 —
  "의무를 부과하는 조문" 과 "적용 범위를 정하는 조문" 은 다르다.

  【시행 예정 개정】 89 FR 72274 (2024-09-04 공포) 개정이 두 차례 연기되어
  2028-01-01 시행 예정이다(91 FR 36, 2026-01-02). 개정 내용은 이 조문
  본문에 없으므로 연방관보 원문을 따로 확보해야 한다.
  FinCEN 이 오래 추진해 온 임계값 250달러 하향안(RIN 1506-AB41)은 이와
  별개이며 2025-04 철회되었다(FACT 기록 있음).

  valid_from 은 비워 두었다. 이 조문의 최초 시행일을 원문으로 확인하지
  않았고, 추정으로 채우면 시점 질의가 조용히 틀린 답을 낸다.

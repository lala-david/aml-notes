curator_note: >
  e-Gov 원문으로 등재했다. 제10조의5는 PROV 노드로 분리했다.

  【ISSUED_BY 미기재 — 의도적】 범수법의 주무대신은 단일 기관이 아니라
  국가공안위원회와 복수 성청이 소관을 나눈다(내각부·총무성·법무성·재무성·
  후생노동성·농림수산성·경제산업성·국토교통성 공동 성령 체계가 그 증거).
  FIU 기능은 경찰청 JAFIC 가 수행한다. 어느 하나를 발행 주체로 적으면
  틀린다. REG:us-bsa·REG:kr-tfia 가 남긴 「발행 주체 모델링 ADR」 과제가
  해결되기 전까지 비워 둔다. 추측으로 채우지 않는다.

  【미등재 — 과제】
  · 시행일 2023-06-01 은 부칙 원문으로 아직 확인하지 않았다. FSA 공표자료
    (2023-05-26 의견공모 결과)에 근거한 2차 정보이므로 valid_from 을
    채우지 않았다. 부칙 확인 후 FACT 로 등재할 것.
  · 자금결제법(암호자산교환업 등록제)은 별도 REG 노드로 미등재.
  · 제10조의3(전자결제수단 이전 통지의무)도 미등재 — 스테이블코인 트래블룰
    근거이므로 우선순위 높음.

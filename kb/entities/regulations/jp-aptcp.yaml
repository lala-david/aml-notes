id: "REG:jp-aptcp"
type: "REG"
layer: "semantic"
label:
  ko: "범죄에 의한 수익의 이전방지에 관한 법률"
  en: "Act on Prevention of Transfer of Criminal Proceeds"
  short: "범수법"
aliases: ["犯罪による収益の移転防止に関する法律", "犯収法", "범수법", "APTCP"]
plain: >
  일본의 자금세탁방지 기본법입니다. 암호자산 거래소가 코인을 보낼 때 보내는 사람과 받는 사람 정보를 상대
  거래소에 넘기라는 의무가 이 법 제10조의5에 있습니다.
summary: >
  일본 AML 체계의 근간 법률. 특정사업자에게 거래시확인·기록보존·의심거래신고
  의무를 부과한다. 2022년 개정으로 제10조의5(암호자산 이전 시 통지의무)가
  신설되어 트래블룰의 법적 근거가 되었으며 2023-06-01 시행되었다.
  자금결제법상 암호자산교환업 등록제와는 별개 법률이다.

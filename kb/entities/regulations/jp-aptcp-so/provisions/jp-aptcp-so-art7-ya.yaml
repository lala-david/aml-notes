curator_note: >
  e-Gov API 로 시행령 전문을 받아 십만엔 등장 지점을 전수 확인했다.
  제7조 제1항 제1호에 네 곳(レ·ソ·ク·ヤ)이며 전부 특정거래 정의다.
    レ 전자결제수단 교환등 / ソ 전자결제수단 이전 /
    ク 암호자산 교환등   / ヤ 암호자산 이전   ← 이 노드

  【이 노드의 존재 이유 — 오귀속 방지】
  「일본 트래블룰 임계금액 10만엔」 이라는 서술이 널리 퍼져 있고
  이 저장소 산문(notes/3-crypto-aml/travel-rule.md)에도 그렇게 적혀 있다.
  그러나 10만엔은 여기, 즉 **거래시확인(CDD) 발동 기준**에 있다.
  트래블룰 근거인 법 제10조의5 본문에는 금액 기준이 없다.
  저장소가 이미 두 번 낸 오류와 같은 유형이다 —
  INR.15 §7(b) 에 §7(a) 의 CDD 기준을 붙인 건, 특금법 제5조의3 에
  시행령 수치를 붙인 건. **세 번째다.**
  → 이 노드를 근거로 산문을 정정할 것.

  【문언 정밀】 「十万円を超える」 = 초과. 「以上」(이상)이 아니다.
  정확히 10만엔인 이전은 특정거래가 아니다.
  산문의 "일본 100,000엔" 표기는 이 포함/불포함 구분을 지운다.

  【IMPOSES 엣지 미기재 — 의도적】 이 조문이 발동시키는 것은 거래시확인
  의무인데, 해당 OBL 노드가 저장소에 없다(현재 OBL 은 트래블룰 하나뿐).
  없는 노드를 가리키게 하거나 트래블룰 OBL 에 걸면 오귀속이 코드로
  고착된다. OBL:x-cdd 등재 후 연결할 것 — 과제.

  【미확인】 이 시행령 조문의 시행일·개정 이력. 2023년 개정으로 암호자산
  항목이 들어온 것으로 보이나 부칙을 확인하지 않았다.

label:
  ko: "범수법 시행령 제7조 제1항 제1호 ヤ (암호자산 이전 — 특정거래)"
  en: "APTCP Enforcement Order Art. 7(1)(i)(ya) — crypto-asset transfer as specified transaction"
  short: "범수법 시행령 제7조 ヤ"
plain: >
  일본에서 암호자산을 10만엔 넘게 옮기면 "특정거래"가 되어 거래소가 고객 신원을 확인해야 한다는 조문입니다.
  트래블룰 금액 기준으로 자주 잘못 인용되지만, 이건 고객확인 기준입니다.
summary: >
  암호자산교환업자가 관리하는 고객 암호자산을 고객 의뢰로 이전시키는 행위 중
  **가액이 10만엔을 초과하는 것**을 특정거래(特定取引)로 지정하는 조항.
  특정거래에 해당하면 법 제4조의 거래시확인(取引時確認 = CDD) 의무가 발동한다.
  통지의무(트래블룰, 법 제10조의5)와는 별개 계통이며,
  **이 금액을 트래블룰 임계값으로 인용하는 것은 오귀속이다.**

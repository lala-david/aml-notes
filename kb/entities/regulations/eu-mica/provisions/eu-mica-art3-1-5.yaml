curator_note: >
  확신도 C — 증거가 자체 실측 기록뿐이다. **정의 조문을 원문으로 확보하지
  않았다.** eu-uk-regime 도시에는 MiCA 를 T1 28건으로 조사했으나 EUR-Lex HTML/PDF 가
  도구에서 절단되어 축조 문언을 못 가져왔다.

  EUR-Lex 는 robots.txt 로 원문 경로 크롤링을 금지한다. CELLAR SPARQL
  (SRC:eu-publications) 로 CELEX 32023R1114 를 조회해야 한다.
  → 확보 후 text_orig 를 채우고 DOC 을 만들어 재결속할 것. **최우선 재검토 과제.**

  【왜 중요한가】 정의가 다르면 같은 자산이 한 관할에서는 규제 대상이고 다른
  관할에서는 아니다. 이 차이가 규제 차익(regulatory arbitrage)의 출발점이다.

id: "PROV:eu-mica-art3-1-5"
type: "PROV"
layer: "semantic"
label:
  ko: "MiCA 제3조 제1항 제5호 (crypto-asset 정의)"
  en: "MiCA Article 3(1)(5) — definition of crypto-asset"
  short: "MiCA 제3조(1)(5)"
parent_reg: "REG:eu-mica"
citation_path: "Article 3(1)(5)"
heading: "Definitions"
language: "en"
text_orig: >
  'crypto-asset' means a digital representation of a value or of a right that
  is able to be transferred and stored electronically using distributed ledger
  technology or similar technology;
plain: >
  EU 가 무엇을 규제 대상으로 볼지 정한 조항입니다. 한국이나 FATF 가 쓰는 정의와 범위가 달라서, 같은 자산이
  한쪽에서는 규제 대상이고 다른 쪽에서는 아닐 수 있습니다.
summary: >
  EU 가 규율하는 "crypto-asset" 의 정의 조항. 분산원장 또는 유사 기술로 전자적으로
  이전·저장될 수 있는 가치 또는 권리의 디지털 표상을 가리킨다.
  한국 특금법의 "가상자산", FATF 의 "virtual asset" 과 **범위가 일치하지 않는다.**

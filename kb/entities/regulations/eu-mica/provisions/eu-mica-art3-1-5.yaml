curator_note: >
  【2026-07-31 승급 C → A】 원문을 확보해 축조 확인했다. 이전 판정은
  "증거가 자체 실측 기록뿐" 이었고 EUR-Lex 크롤링 금지가 걸림돌이었다.
  출판국 CELLAR 내용협상으로 우회했다 —
    curl -L -H "Accept: application/xhtml+xml" -H "Accept-Language: eng" \
      http://publications.europa.eu/resource/celex/32023R1114
  Accept 를 text/html 로 주면 400 이고 application/xhtml+xml 이라야 200 이다.
  SPARQL 을 짤 필요가 없었다.

  【왜 중요한가】 정의가 다르면 같은 자산이 한 관할에서는 규제 대상이고 다른
  관할에서는 아니다. 이 차이가 규제 차익(regulatory arbitrage)의 출발점이다.

  【범위 차이 — 아직 미검증】 한국 "가상자산"·FATF "virtual asset" 과 범위가
  일치하지 않는다는 서술은 유지하되, 세 정의를 축조 대조한 기록은 아직 없다.
  FATF Glossary 원문을 확보해 셋을 나란히 놓고 차이를 조문 단위로 적을 것.
  → 재검토 과제.

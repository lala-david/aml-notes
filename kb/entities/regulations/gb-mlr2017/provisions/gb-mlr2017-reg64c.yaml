  # threshold 한정자를 두지 않는다 — 기본 의무에 금액 기준이 없다.
  # €1,000/£800 은 정보 항목을 늘리는 기준이지 의무를 발동시키는 기준이 아니므로
  # qualifiers.threshold 에 넣으면 EU·일본과 같은 오귀속이 된다. → depth_thresholds 참조.
  - predicate: "IMPOSES"
    to: "OBL:x-travel-rule-originator"
    qualifiers:
      scope_note: >
        기본 의무에 금액 기준 없음. 전달 사슬의 모든 암호자산 사업자가 영국에서 영업하면
        (3)항(요청 시 3영업일 내 (6)항 정보 제공), 그렇지 않으면 (4)항이 적용되어
        연결 이전 합산 1,000 euros(2023-09-01~2026-06-29) / £800(2026-06-30~) 이상이면
        (6)항 심화정보를 동반해야 한다. (8) 송신인 정보는 독립 신뢰 출처로 검증,
        (9) 완전 준수 전 이전 금지.

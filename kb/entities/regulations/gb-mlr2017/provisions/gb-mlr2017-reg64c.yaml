id: "PROV:gb-mlr2017-reg64c"
type: "PROV"
layer: "semantic"
label:
  ko: "MLR 2017 규정 64C (암호자산 사업자 간 이전 — 동반정보)"
  en: "MLR 2017 regulation 64C — Information accompanying inter-cryptoasset business transfers"
  short: "MLR 2017 reg 64C"
plain: >
  영국 거래소가 다른 거래소로 코인을 보낼 때 보내는 사람 정보를 함께 넘기라는 조문입니다. 금액과 상관없이
  기본 정보는 항상 보내야 합니다. 주소·생년월일 같은 항목이 추가로 붙는 기준은 2023-09-01~2026-06-29 에는
  1,000유로 상당, 2026-06-30 부터는 £800 입니다.
summary: >
  영국 암호자산 트래블룰의 근거 조항(2023-09-01 시행, S.I. 2022/860 으로 제7A편 신설).
  송신인 측 암호자산사업자는 이전에 규정 64C(5)의 정보(송신인·수신인 성명, 법인명,
  계좌번호 또는 고유거래식별자)를 동반시켜야 한다. **이 기본 의무에는 금액 기준이 없다.**
  심화정보((6)항)를 붙이는 (4)항 기준은 시점에 따라 다르다 — 「1,000 euros」
  (2023-09-01~2026-06-29) / 「£800」(2026-06-30~, S.I. 2026/621 규정 32). 둘 다
  「equal to or exceeds」(이상)이며 연결된 이전을 합산한다.
parent_reg: "REG:gb-mlr2017"
citation_path: "regulation 64C"
heading: "Information accompanying cryptoasset transfers"
language: "en"
text_orig: >
  (1) … the cryptoasset business of the originator must ensure that the
  cryptoasset transfer is accompanied by the information specified in
  paragraph (5).
  (4) [2023-09-01 판] Where paragraph (3) does not apply and the transfer is
  equal to or exceeds the equivalent in cryptoassets of 1,000 euros in value
  (taken together with any other cryptoasset transfer which appears to be
  linked), the cryptoasset business of the originator must ensure that the
  inter-cryptoasset business transfer is also accompanied by the information
  specified in paragraph (6).
  [2026-06-30~: 「1,000 euros」 → 「£800」 (S.I. 2026/621 reg 32)]
# 정보 심화 기준 — 의무 발동 기준이 아니므로 IMPOSES.threshold 에 넣지 않는다.
# 시점 질의를 위해 구간별로 분리 기재한다. valid_to 는 마지막 유효일(포함)이다.

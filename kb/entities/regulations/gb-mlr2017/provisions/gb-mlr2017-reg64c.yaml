id: "PROV:gb-mlr2017-reg64c"
type: "PROV"
layer: "semantic"
label:
  ko: "MLR 2017 규정 64C (암호자산 사업자 간 이전 — 동반정보)"
  en: "MLR 2017 regulation 64C — Information accompanying inter-cryptoasset business transfers"
  short: "MLR 2017 reg 64C"
plain: >
  영국 거래소가 다른 거래소로 코인을 보낼 때 보내는 사람 정보를 함께 넘기라는 조문입니다. 금액과 상관없이
  기본 정보는 항상 보내야 하고, £800 이상이면 주소·생년월일 같은 항목이 추가로 붙습니다.
summary: >
  영국 암호자산 트래블룰의 근거 조항. 송신인 측 암호자산사업자는 이전에
  규정 64C(5)의 정보(송신인·수신인 성명, 법인명, 계좌번호 또는 고유거래식별자)를
  동반시켜야 한다. **이 기본 의무에는 금액 기준이 없다.**
  £800 은 규정 64C(4)에서 (6)항의 추가 정보를 요구하는 별개 기준이며,
  연결된 이전을 합산해 판단한다.
parent_reg: "REG:gb-mlr2017"
citation_path: "regulation 64C"
heading: "Information accompanying cryptoasset transfers"
language: "en"
text_orig: >
  (1) … the cryptoasset business of the originator must ensure that the
  cryptoasset transfer is accompanied by the information specified in
  paragraph (5).
tags: ["gb", "travel-rule", "crypto-asset", "no-threshold-on-base-duty"]

curator_note: >
  legislation.gov.uk 조문 단위 URL 로 규정 64C 를 확인했다.

  【확보 수준 — 항마다 다르다】 text_orig 는 (1)항만 축조 문언이다.
  (4)·(5)·(6)항은 내용을 확인했으나 문언을 확보하지 못했다.
    (5) 송신인·수신인 성명 / 법인이면 등록·상호명 / 계좌번호 또는 고유거래식별자
    (6) 법인: 고객식별번호 또는 등록사무소·주된영업소 주소
        개인: 고객식별번호 또는 주소 또는 여권·신분증·출생증명서 번호
              또는 생년월일·출생지
  (4)항의 발동 조건은 두 표현이 엇갈렸다 — 「수익자 사업자가 영국 밖」 대
  「집행 사업자 전부가 영국 소재는 아닐 것」. 원문 재확인 전까지 단정하지
  않는다. **재검토 과제.**

  【£800 을 threshold 한정자에 넣지 않은 이유】 EU TFR 제14조와 같은 판단이다.
  이 금액은 의무를 발동시키지 않고 정보 항목의 깊이를 정한다.
  qualifiers.threshold 에 넣으면 관할 비교표가 「영국 트래블룰 임계 £800」
  이라는 틀린 표를 자동 생성하게 된다. 일본 건(CTR:00006)과 같은 유형의
  오귀속이 코드로 고착되는 경로다.

  【관할 비교에서 드러난 구조】 EU·영국·싱가포르·일본을 원문으로 확인한
  결과, 「트래블룰 임계금액」을 단일 숫자로 적을 수 있는 관할이 드물다.
  대부분 의무 자체엔 기준이 없고 금액은 정보 깊이를 나눈다.
  산문의 임계금액 비교표는 이 구조를 표현하지 못한다 — 정정 대상.

  valid_from 은 비워 두었다. 제7A편 신설 개정령을 확보하지 않았다.

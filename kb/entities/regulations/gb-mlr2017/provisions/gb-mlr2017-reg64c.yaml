curator_note: >
  【2026-10-21 갱신 — 보고서 부록 A-22】 research/2026-10-travel-rule.md F-030~F-032.
  · IMPOSES 엣지 valid_from: null → 2023-09-01. 2026-08-04 기록은 「시점 불명(null)」이었고
    값을 주장하지 않았으므로 정정이 아니라 미확정 칸 채움이다. recorded_at 을 2026-10-21 로 갱신.
  · scope_note 의 「£800 단일값」 → 구간 분리. 2026-08-04 조회 시점의 현행 문언으로는
    £800 이 맞았지만, 2023-09-01~2026-06-29 의 거래에는 1,000 euros 가 적용된다.
    시점 질의를 위해 depth_thresholds 에 두 구간을 따로 적었다.
  · (3)·(4) 발동 조건 확정 — 「every cryptoasset business in the transfer chain … carries on
    business in the UK」이면 (3), 아니면 (4)(F-032). 2026-08-04 의 「두 표현이 엇갈림」 과제 해소.
  · 짝 조문: reg 64G(비호스팅 지갑, PROV:gb-mlr2017-reg64g), reg 34A(코레스 강화 CDD,
    2027-02-01 시행, PROV:gb-mlr2017-reg34a).

  【£800·€1,000 을 threshold 한정자에 넣지 않은 이유】 EU TFR 제14조와 같은 판단이다.
  이 금액은 의무를 발동시키지 않고 정보 항목의 깊이를 정한다. qualifiers.threshold 에 넣으면
  관할 비교표가 「영국 트래블룰 임계 £800」이라는 틀린 표를 자동 생성한다(CTR:00006 유형).

  【text_orig】 (1)항과 (4)항(2023-09-01 판)만 축조 문언이다. (5)·(6)·(8)·(9)는 내용 요지만
  확보했다(F-032, 인용 125자 제한).

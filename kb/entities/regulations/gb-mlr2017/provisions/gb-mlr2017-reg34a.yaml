curator_note: >
  보고서 부록 A-22 신설. research/2026-10-travel-rule.md F-034 (T1/A).
  상태: enacted-not-in-force(2027-02-01 시행). PART_OF 엣지 valid_from 을 시행일로 두어
  시점 질의가 2027-02-01 전에는 이 조문을 현행으로 세지 않게 했다.
  트래블룰 자체(정보 전달)가 아니라 FATF 「counterparty VASP due diligence」의 영국판으로,
  트래블룰 운영과 직결된다. 대응하는 OBL 노드가 없어 IMPOSES 는 걸지 않았다.
  review_due 는 시행일 직후로 잡았다 — 시행 전환 확인.

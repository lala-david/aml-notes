id: "PROV:gb-mlr2017-reg64g"
type: "PROV"
layer: "semantic"
label:
  ko: "MLR 2017 규정 64G (비호스팅 지갑 관련 이전)"
  en: "MLR 2017 regulation 64G — cryptoasset transfers involving unhosted wallets"
  short: "MLR 2017 reg 64G"
plain: >
  영국 거래소가 개인 지갑(비호스팅 지갑)과 코인을 주고받을 때 적용되는 조문입니다. 거래소는 고객에게
  빠진 정보를 요청할 수 있고, 요청한 정보를 받지 못하면 코인을 내줄 수 없습니다. 지갑 소유를 증명하라는
  의무는 없습니다.
summary: >
  비호스팅 지갑 이전에서 암호자산 사업자는 고객(송신인 또는 수익자)에게 누락 정보를 요청할 수 있고,
  고객이 수익자이며 연결 이전 합산 금액이 기준 이상이면 송신인 심화정보도 요청할 수 있다.
  요청 여부는 위험평가(관계·이전의 목적·성격, 금액·빈도, 관계 지속기간)에 따른다.
  요청 정보를 받지 못하면 「must not make the cryptoasset available to the beneficiary」.
  (1)(b)의 금액은 1,000 euros(2023-09-01~2026-06-29) → £800(2026-06-30~, S.I. 2026/621 규정 33).

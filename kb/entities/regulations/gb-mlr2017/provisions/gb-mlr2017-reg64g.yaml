curator_note: >
  보고서 부록 A-22 신설. research/2026-10-travel-rule.md F-033(T1/A)·F-031.
  【IMPOSES 엣지 미기재 — 의도적】 이 조문은 송신인 정보 「전달」 의무(OBL:x-travel-rule-originator)가
  아니라 비호스팅 지갑 이전의 정보 요청 재량·지급 보류를 정한다. 대응하는 추상 의무 노드가
  저장소에 없어 추측으로 걸지 않았다 — OBL 신설 과제.
  【관할 비교】 EU(검증 방법 열거)·스위스(소유 증명 필수)·한국 2027(동일인만 허용)과 달리
  영국은 소유 증명 의무가 없다. 소유 검증 방법은 JMLSG 가이던스 영역(미확인).

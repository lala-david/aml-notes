curator_note: >
  이 권고에는 서로 다른 세 일자가 존재한다 (CTR:00003) —
    standard_revised_on          = 2025-06-18 (기준 개정 공표)
    national_implementation_deadline = 2030-12-31 (각국 이행 기대시한)
    methodology_effective_on     = 미정 (2022 Methodology Annex IV, 각주 95
                                   "adopted by the FATF but are not yet in effect")
  결과적으로 현재 진행 중인 5차 라운드 상호평가는 구 R.16 기준으로 채점된다.
  단일 "개정일" 필드로 뭉치면 어느 질문에도 답할 수 없으므로 STATE 로 분리 관리한다.

  VASP 직접 적용 제외 — 트래블룰을 이 권고에 직결하는 서술은 오류다.
  근거는 REG:intl-fatf-r15 (INR.15 §7(b)). FACT:0000006 참조.

  de minimis 임계값은 USD/EUR 1,000 으로 변경 없음. 바뀐 것은 초과 시 요구정보
  확대(송금인 주소, 수취인 국가·도시, 자연인 생년월일, 법인 BIC/LEI 등).

  【2026-10-21 갱신 — 네 번째 일자】
    guidance_consultation = 2026-06-24 ~ 2026-08-21 (개정 R.16 이행 가이던스 초안 공개의견수렴)
    guidance_final        = 미발간 (2026-10-21 기준, proposed)
  근거는 B — FATF 의견수렴 페이지가 접근 차단(JS 챌린지)이라 FIAU Malta 요약
  (https://fiaumalta.org/news/latest-updates-from-the-fatf/)과 2차 해설로만 확인. DOC 미등재.
  2026-10-26~30 FATF 총회 성과문에서 최종본 여부를 확인할 것 — review_due 를 그 직후로 당겼다.

  위 마지막 단락의 "확대 정보항목(송금인 주소, 수취인 국가·도시, 생년월일, BIC/LEI)"과
  methodology_effective_on(Annex IV 미발효)은 2026-10 조사에서 **재확인되지 않았다**(보고서 부록 B #5).
  설명서로 이번에 확인된 것은 para 33(de minimis ≤ USD/EUR 1,000)·54(VASP 는 R.15 경유)·
  59(2030년 말) 세 가지다. 재확인 전까지 산문에 확대 항목을 단정해 쓰지 말 것.


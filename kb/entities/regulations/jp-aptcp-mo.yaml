curator_note: >
  일본 범수법 체계는 법률 → 정령(시행령) → 성령(시행규칙) 세 층위다.
  트래블룰을 정확히 서술하려면 세 층위를 모두 봐야 한다는 것이
  이번 수집의 교훈이다. 법률만 보면 「금액 기준 없음」이 확정되지 않고,
  정령만 보면 십만엔을 트래블룰 기준으로 오인한다.

  이 성령은 복수 부처 공동령이라 REG:jp-aptcp 와 같은 이유로
  ISSUED_BY 를 비워 둔다.

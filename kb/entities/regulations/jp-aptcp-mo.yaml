id: "REG:jp-aptcp-mo"
type: "REG"
layer: "semantic"
label:
  ko: "범죄에 의한 수익의 이전방지에 관한 법률 시행규칙"
  en: "Ordinance for Enforcement of the Act on Prevention of Transfer of Criminal Proceeds"
  short: "범수법 시행규칙"
aliases: ["犯罪による収益の移転防止に関する法律施行規則", "犯収法施行規則", "범수법 시행규칙"]
plain: >
  범수법이 "자세한 항목은 부처가 정하라"고 넘긴 부분을 채운 성령입니다. 코인을 보낼 때 상대 거래소에 정확히
  무엇을 알려야 하는지가 제31조의7에 적혀 있습니다.
summary: >
  범수법의 주무성령. 복수 부처 공동령이다. 제31조의7이 법 제10조의5를
  이행하여 암호자산 이전 시 통지할 사항(의뢰고객·수취고객의 본인특정사항과
  이전 식별부호)을 정한다. 이 조문에도 금액 기준이 없다.
reg_kind: "ordinance"
citation: "平成20年内閣府・総務省・法務省・財務省・厚生労働省・農林水産省・経済産業省・国土交通省令第1号"

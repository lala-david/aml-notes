id: "REG:kr-tfia-sd"
type: "REG"
layer: "semantic"
label:
  ko: "특정 금융거래정보의 보고 및 이용 등에 관한 법률 시행령"
  en: "Enforcement Decree of the Act on Reporting and Using Specified Financial Transaction Information"
  short: "특금법 시행령"
aliases: ["특금법 시행령", "특정금융정보법 시행령"]
plain: >
  특금법이 "자세한 건 정부가 정하라"고 넘긴 부분을 채운 규정입니다. 트래블룰 100만원 같은 실무 숫자가 여기
  있어서, 법을 안 고쳐도 이것만 바꾸면 기준이 달라집니다.
summary: >
  특금법의 위임사항을 구체화하는 대통령령. 트래블룰 적용 기준금액(제10조의10),
  고객확인 절차, 신고 요건 등을 정한다. 법률이 정한 상한 범위 안에서
  시행령만 개정해도 실무 기준이 바뀌므로 감시 우선순위가 높다.
reg_kind: "decree"
citation: "대통령령 제35947호 (2025-12-30 공포, 2026-01-02 시행, 타법개정)"

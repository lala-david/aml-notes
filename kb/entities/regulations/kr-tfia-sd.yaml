curator_note: >
  【2026-10-21 정정】 2026-07-30 판의 citation 「대통령령 제35947호 (2025-12-30 공포, 2026-01-02 시행,
  타법개정)」과 「AML 실체 규정 개정은 미공포」(FACT:0000007·0000008) 서술은 낡았다.
  2026-08-11 국무회의 의결 → 2026-08-18 대통령령 제36592호 공포(EVT:kr-tfia-sd-36592-promulgated-2026)
  → 2026-08-20 본칙 시행. 부칙 제1조 단서로 제10조의2·제10조의5제6항·제10조의10·제10조의20·
  제16조의2제1호·제4호는 2027-02-19 시행(법제처 시행일 색인; 언론의 02-20 은 기각). 이어
  대통령령 제36728호(2026-09-29 공포, 타법개정)가 2026-10-02 부터 현행본이다(FACT:0000203·0000208).
  제35947호 증거는 연혁 기록으로 남긴다.

  두 가지를 혼동하지 말 것: 「현행본 번호」(제36728호, 타법개정)와 「AML 실체 개정 번호」
  (제36592호)는 다르다. 현행본 XML 은 시행 전 조문(「모든 경우」)을 이미 보여 주므로, 시점 판단은
  efYd 파라미터로 판본을 지정해 읽어야 한다.

  ISSUED_BY 를 두지 않았다. 대통령령의 발령 주체 모델링은 REG:kr-tfia 와 동일한
  미해결 논점이다 (ADR 대상).

curator_note: >
  현행 시행본은 **타법개정**(2025-12-30 공포)이며, AML 실체 규정 개정
  (트래블룰 기준금액 폐지 등)은 2026-07-30 기준 미공포다 — FACT:0000007·0000008.
  두 가지를 혼동하지 말 것: 시행령이 최근 개정되었다는 사실과
  AML 관련 개정이 이루어졌다는 사실은 별개다.

  ISSUED_BY 를 두지 않았다. 대통령령의 발령 주체 모델링은 REG:kr-tfia 와 동일한
  미해결 논점이다 (ADR 대상).

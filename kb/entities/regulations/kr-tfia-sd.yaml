id: "REG:kr-tfia-sd"
type: "REG"
layer: "semantic"
label:
  ko: "특정 금융거래정보의 보고 및 이용 등에 관한 법률 시행령"
  en: "Enforcement Decree of the Act on Reporting and Using Specified Financial Transaction Information"
  short: "특금법 시행령"
aliases: ["특금법 시행령", "특정금융정보법 시행령"]
plain: >
  특금법이 "자세한 건 정부가 정하라"고 넘긴 부분을 채운 규정입니다. 트래블룰 100만원 같은 실무 숫자가 여기
  있어서, 법을 안 고쳐도 이것만 바꾸면 기준이 달라집니다. 실제로 2026-08-18 개정으로 100만원 기준이
  2027-02-19 부터 없어집니다.
summary: >
  특금법의 위임사항을 구체화하는 대통령령. 트래블룰 정보제공 기준(제10조의10), 외국 가상자산사업자·
  자기수탁 주소와의 거래 조치(제10조의20), 고객확인 절차, 신고 요건 등을 정한다. 법률이 정한 범위 안에서
  시행령만 개정해도 실무 기준이 바뀌므로 감시 우선순위가 높다.
reg_kind: "decree"
citation: "대통령령 제36728호 (2026-09-29 공포, 2026-10-02 시행, 타법개정, 현행) ← 대통령령 제36592호 (2026-08-18 공포, 일부개정; 본칙 2026-08-20 시행, 제10조의10·제10조의20 등 2027-02-19 시행)"
promulgated: "2026-08-18"
binding: "binding"
language: "ko"

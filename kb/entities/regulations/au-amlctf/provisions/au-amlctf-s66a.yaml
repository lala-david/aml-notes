curator_note: >
  【본문 확보 완료 — 2026-08-04】 최초 등재 시 목차만 확보해 text_orig 를
  비우고 IMPOSES 도 걸지 않았다. 같은 날 전문을 확보해 둘 다 채웠다.
  확보 경로는 DOC:au-legis-amlctf 참조(EPUB HTML 직접 수신 후 태그 제거).

  【유보가 절반만 맞았다 — 기록해 둔다】 등재 시 「2차 자료는 (2)·(5)항을
  상대방 실사로 서술하므로 트래블룰 OBL 에 걸면 오귀속」이라고 유보했다.
  원문 확인 결과 (2)·(5)항이 상대방 실사인 것은 맞다. 그러나
  **(3)항이 정보 전달 의무를 부과한다** — "must pass on the information
  specified in the AML/CTF Rules for the purposes of subsection 64(3)".
  즉 이 조문은 실사와 트래블룰을 한 조문에 담고 있다.
  표제만으로 판단을 미룬 것은 옳았고, 결론은 IMPOSES 를 거는 쪽이다.

  【금액 조건 없음 — 두 조문 모두 확인】
  제66A조 제1항은 "This section applies to the transfer of a virtual asset"
  로 자산 유형만으로 적용 범위를 정한다. 참조 대상인 제64조도
  "if an ordering institution commences to provide the designated service
  covered by item 29 of table 1 in section 6" 로 서비스 제공 사실만 요건이며
  금액이 없다. 두 조문 전문에서 금액 표현을 찾지 못했다.
  → 호주는 EU·영국·일본과 같은 「의무 무임계」 유형이다.

  【남은 층위 — AML/CTF Rules】 전달할 정보 **항목**은 AML/CTF Rules 에
  위임돼 있다(제64조 제2항·제3항). 일본의 주무성령, 영국의 reg 64C(5)·(6)
  과 같은 위치다. Rules 가 금액별로 항목을 나누는지는 미확인이므로
  「정보 심화 기준 없음」을 확정 서술로 쓰지 않는다.
  일본 건에서 배운 대로 **위임된 하위 규범을 봐야 끝난다.**

  【신설 연혁】 법령 연혁표에서 "s 66A ... ad No 110, 2024" 확인 —
  2024년 법률 제110호로 신설. 시행일 2026-03-31 은 내무부 안내 기준이며
  부칙으로 확인하지 않았다.

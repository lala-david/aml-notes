    qualifiers:
      scope_note: >
        금액 기준 없음 — 제66A조·제64조 본문 모두 금액 조건이 없다.
        전달할 정보 항목은 AML/CTF Rules 에 위임(제64조 제3항 경유).
        수익기관이 FATF 이행법상 등록 의무가 있으면서 미등록이면
        서비스 제공 자체가 금지된다(제66A조 제4항).
        수익기관이 안전 수신·기밀 보호 불가라고 볼 합리적 근거가 있으면
        전달 의무 면제 + 사유 기록 의무(제66A조 제9항).

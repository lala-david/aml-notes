id: "PROV:au-amlctf-s66a"
type: "PROV"
layer: "semantic"
label:
  ko: "AML/CTF법 제66A조 (가상자산 이전 — 주문기관·수익기관 의무)"
  en: "AML/CTF Act s 66A — Obligations of ordering and beneficiary institutions relating to virtual asset transfers"
  short: "AML/CTF법 제66A조"
plain: >
  호주에서 가상자산을 보낼 때 보내는 쪽·받는 쪽 사업자가 각각 져야 할 의무를 정한 조문입니다. 일반 송금과
  달리 가상자산만 따로 떼어 규정했습니다. 2026년 3월 31일부터 시행 중입니다.
summary: >
  호주 가상자산 트래블룰의 근거 조항. 가치 이전 사슬(value transfer chain)에서
  주문기관(ordering institution)과 수익기관(beneficiary institution)이
  가상자산 이전에 관해 지는 의무를 정한다. 일반 가치 이전 의무(제64~66조)와
  **별도 조문으로 분리**된 점이 이 관할의 특징이다.
parent_reg: "REG:au-amlctf"
citation_path: "section 66A"
heading: "Obligations of ordering and beneficiary institutions relating to virtual asset transfers"
language: "en"
text_orig: >
  Scope (1) This section applies to the transfer of a virtual asset.
  Ordering institution obligations (2) Before commencing to provide the
  designated service covered by item 29 of table 1 in section 6, an ordering
  institution must undertake due diligence to determine, on reasonable
  grounds, whether the virtual asset wallet to which the virtual asset is
  being transferred is: (a) a custodial wallet controlled by a person who is
  licensed or registered under a law that gives effect to the FATF
  Recommendations; or (b) a custodial wallet controlled by a person who is not
  required to be licensed or registered under a law that gives effect to the
  FATF Recommendations; or (c) a custodial wallet controlled by a person who
  is required to be licensed or registered under a law that gives effect to
  the FATF Recommendations, but is not so licensed or registered; or (d) a
  self-hosted wallet controlled by the payee.
  (3) The ordering institution must pass on the information specified in the
  AML/CTF Rules for the purposes of subsection 64(3) relating to the transfer
  of value to a beneficiary institution if the beneficiary institution is:
  (a) a person who is licensed or registered under a law that gives effect to
  the FATF Recommendations; or (b) a person who is not required to be licensed
  or registered under a law that gives effect to the FATF Recommendations.
  (4) An ordering institution must not provide the designated service covered
  by item 29 of table 1 in section 6 if this would involve passing on a
  transfer message for a transfer of value to a person: (a) who is required to
  be licensed or registered under a law that gives effect to the FATF
  Recommendations; but (b) is not so licensed or registered.
  … Civil penalty (8) Subsections (2) to (7) are civil penalty provisions.
  Exceptions (9) Subsection (3) does not apply if: (a) either: (i) the
  ordering institution has established on reasonable grounds that the
  beneficiary institution is not capable of receiving the information
  securely; or (ii) the ordering institution reasonably believes that there is
  a risk that the beneficiary institution is not capable of safeguarding the
  confidentiality of the information; and (b) the ordering institution makes
  and keeps a record of the reasons for not passing on the information.
tags: ["au", "travel-rule", "virtual-asset", "no-threshold"]

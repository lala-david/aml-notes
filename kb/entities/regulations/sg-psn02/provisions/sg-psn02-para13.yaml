label:
  ko: "PSN02 제13절 (가치이전 동반정보)"
  en: "PSN02 paragraph 13 — Value Transfers"
  short: "PSN02 §13"
plain: >
  싱가포르에서 가상자산을 보낼 때 무엇을 함께 넘겨야 하는지 정한 조항입니다. 금액이 얼마든 양쪽 이름과
  계좌번호는 넘겨야 하고, 1,500싱가포르달러를 넘으면 송신인 신원확인과 주소·신분증번호가 더해집니다.
summary: >
  싱가포르 가상자산 트래블룰의 근거 조항. 주문기관은 이전에 수반되는 메시지에
  송신인·수신인 정보를 포함시켜야 한다. **의무 자체에 금액 조건이 없다.**
  S$1,500 이하이면 4항목(양측 성명·계좌번호 또는 고유거래참조번호),
  초과이면 송신인 **신원확인·검증** 의무가 더해지고 주소·고유식별번호 또는
  생년월일·설립지 중 하나가 추가된다.
parent_reg: "REG:sg-psn02"
citation_path: "paragraph 13"
heading: "Value Transfers"
language: "en"
text_orig: >
  13.4 Subject to paragraph 13.5, in a value transfer where the amount to be
  transferred or arranged to be transferred is below or equal to S$1,500,
  every payment service provider which is an ordering institution shall
  include in the message or payment instruction that accompanies or relates to
  the value transfer the following: (a) the name of the value transfer
  originator; (b) the value transfer originator's account number (or unique
  transaction reference number where no account number exists); (c) the name of
  the value transfer beneficiary; and (d) the value transfer beneficiary's
  account number (or unique transaction reference number where no account
  number exists).
  13.6 Subject to paragraph 13.8, in a value transfer where the amount to be
  transferred or arranged to be transferred exceeds S$1,500, every payment
  service provider which is an ordering institution shall identify the value
  transfer originator and verify the value transfer originator's identity, and
  include in the message or payment instruction that accompanies or relates to
  the value transfer the information required by paragraphs 13.4(a) to 13.4(d)
  and any of the following: (a) the value transfer originator's (i) residential
  address, or (ii) registered or business address, and if different, principal
  place of business, as may be appropriate; (b) the value transfer originator's
  unique identification number (such as an identity card number, birth
  certificate number or passport number, or where the value transfer originator
  is not a natural person, the incorporation number or business registration
  number); or (c) the date and place of birth, incorporation or registration of
  the value transfer originator (as may be appropriate).
tags: ["sg", "travel-rule", "dpt", "no-threshold-on-base-duty"]

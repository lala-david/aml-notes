curator_note: >
  MAS 고시 원문(2025-06-30 최종개정본)을 받아 제13절을 축조 확인했다.

  【경계값 — 관할마다 다르다】 PSN02 는 "below or equal to S$1,500" /
  "exceeds S$1,500" 로 가른다. 따라서 **정확히 S$1,500 은 하위 구간**이다.
  홍콩은 "not less than $8,000" 이라 정확히 HK$8,000 이 상위 구간이고,
  일본 시행령은 "十万円を超える" 라 정확히 10만엔이 제외된다.
  비교표에서 「이상/초과」를 뭉뚱그리면 세 관할의 경계가 각각 틀린다.

  【이 관할만의 특징 — 신원확인 의무가 금액에 걸린다】 다른 B형 관할은
  금액이 **정보 항목**만 나누는데, 싱가포르는 S$1,500 초과 시
  "shall identify … and verify the value transfer originator's identity"
  로 **CDD 성격의 의무**가 추가된다. 즉 정보 심화와 신원확인 강화가
  같은 문턱에 걸려 있다. 「정보 심화 기준」 한 마디로 요약하면
  이 부분이 지워지므로 scope_note 에 명시했다.

  【¶13.5 완화 — 국내 중개기관 한정】 싱가포르 소재 중개기관 앞으로는
  고유거래참조번호 + 수신인 정보만 보낼 수 있다. 단 추적 가능성 보장,
  당국·법집행 요청 시 제공, 수익기관에는 전체 제공이 조건이다.
  국경 간 이전에는 적용되지 않는다.

  【미확인 — 2026-08-04 기록】 ¶13.8(¶13.6 의 예외)의 내용을 확인하지 않았다.
  → 【2026-10-21 해소, 보고서 부록 A-30】 ¶13.8 은 S$1,500 초과 이전에서 싱가포르 소재
  중개기관 앞으로 고유거래참조번호 + 수익자 정보만 보내고 나머지는 3영업일 내 제공하는 완화다
  (¶13.5 의 초과 구간판). research/2026-10-travel-rule.md F-047 (T1/A).
  · 효력: 2024-04-04(¶1.2), 개정분 2025-07-01(2025-06-30 최종개정) — IMPOSES valid_from 을
    2024-04-04 로 채웠다(null 에서 채움, recorded_at 2026-10-21).
  · ¶13.9 「immediately and securely」, ¶13.11 미준수 시 이전 실행 금지, ¶13.12·¶13.14 수익기관의
    누락정보 탐지·집행·거절·보류 정책. ¶13 에 비호스팅 지갑 전용 조항 없음(확인 범위).
  · MAS 집행조치 색인(2026-05-25~2026-10-14 구간, 1쪽만 점검)에 ¶13 관련 건 없음(B).
  · 2026-10-21 기준 in-force, 2026-08-04 이후 변경 없음.
  남은 과제: 이 고시가 DPT 서비스 전반을 다루므로 「가상자산 이전」과
  「가치이전」의 범위가 완전히 일치하는지 제2절 정의를 확인해야 한다.

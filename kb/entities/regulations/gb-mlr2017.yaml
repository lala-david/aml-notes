curator_note: >
  제7A편의 규정 64C 를 PROV 노드로 분리했다.

  【ISSUED_BY 미기재 — 의도적】 MLR 2017 은 재무부(HM Treasury)가 제정한
  2차 입법이고 FCA 는 암호자산 사업자 등록·감독 기관이다. 제정 주체와
  집행 주체가 다르다. ORG:gb-hmt·ORG:gb-fca 가 모두 저장소에 있으나
  어느 술어로 무엇을 걸지는 「발행 주체 모델링 ADR」 과제에 걸려 있다
  (REG:us-bsa·REG:kr-tfia 와 동일 사유). 추측으로 채우지 않는다.

  【2026-10-21 갱신 — 보고서 부록 A-22】
  · 제7A편 신설 개정령 S.I. 2022/860 확정(legislation.gov.uk 64C 2023-09-01 판 주석 F1).
    시행일 2023-09-01 → PROV:gb-mlr2017-reg64c 의 valid_from 채움.
  · S.I. 2026/621(2026-06-09 제정·2026-06-30 시행) 반영 — reg 64C(4)·64G(1)(b)
    1,000 euros → £800. 산문·KB 의 「£800」은 2026-06-30 이후에만 맞다.
  · PROV 신설: reg 64G(비호스팅 지갑), reg 34A(2027-02-01 시행, enacted-not-in-force).

  【미등재 — 과제】
  · 암호자산 활동을 RAO 규제활동으로 편입하는 전환(JUR:gb 서술 참조)은
    별개 법령 계통이며 미등재.
  · 규정 64D·64E·64F·64H(수익자 측 의무·미비 정보 처리 등) 미등재. 64G 는 등재.

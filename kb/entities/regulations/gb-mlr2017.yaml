id: "REG:gb-mlr2017"
type: "REG"
layer: "semantic"
label:
  ko: "영국 자금세탁방지규정 2017"
  en: "Money Laundering, Terrorist Financing and Transfer of Funds (Information on the Payer) Regulations 2017"
  short: "MLR 2017"
aliases: ["MLR 2017", "MLRs", "SI 2017/692", "영국 MLR"]
plain: >
  영국의 자금세탁방지 핵심 규정입니다. 2022년 개정령(S.I. 2022/860)으로 암호자산 편이 새로 붙어 2023-09-01
  부터, 거래소가 코인을 보낼 때 송신인 정보를 함께 보내야 합니다. 금액이 얼마든 기본 정보는 보내야 합니다.
summary: >
  영국 AML 체계의 중심 2차 입법(Statutory Instrument). FCA 등록제·고객확인·
  기록보존 의무의 근거이며, 제7A편(Part 7A)이 암호자산 이전 시 정보 동반
  의무를 정한다(S.I. 2022/860 으로 신설, 2023-09-01 시행). 기본 의무(규정 64C(1))에는
  금액 기준이 없고, 추가 정보 항목을 요구하는 별개 기준은 1,000 euros(2023-09-01~2026-06-29)
  → £800(2026-06-30~, S.I. 2026/621)이다. 같은 개정령이 신설한 코레스 관계 강화 CDD
  (규정 34A)는 2027-02-01 시행 예정(enacted-not-in-force)이다.

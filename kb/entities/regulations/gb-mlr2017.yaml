curator_note: >
  제7A편의 규정 64C 를 PROV 노드로 분리했다.

  【ISSUED_BY 미기재 — 의도적】 MLR 2017 은 재무부(HM Treasury)가 제정한
  2차 입법이고 FCA 는 암호자산 사업자 등록·감독 기관이다. 제정 주체와
  집행 주체가 다르다. ORG:gb-hmt·ORG:gb-fca 가 모두 저장소에 있으나
  어느 술어로 무엇을 걸지는 「발행 주체 모델링 ADR」 과제에 걸려 있다
  (REG:us-bsa·REG:kr-tfia 와 동일 사유). 추측으로 채우지 않는다.

  【미등재 — 과제】
  · 제7A편을 신설한 개정령(SI 2022/860 으로 추정) 원문 미확보.
    신설 시점을 확인해야 valid_from 을 채울 수 있다.
  · 암호자산 활동을 RAO 규제활동으로 편입하는 전환(JUR:gb 서술 참조)은
    별개 법령 계통이며 미등재.
  · 규정 64D 이후(수익자 측 의무·미비 정보 처리) 미등재.

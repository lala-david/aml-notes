curator_note: >
  【ISSUED_BY 를 채운 이유 — 다른 관할과 다르다】 지금까지 REG 노드는
  「제정 주체와 집행 주체가 달라」 ISSUED_BY 를 비워 왔다(us-bsa·kr-tfia·
  gb-mlr2017·jp-aptcp·au-amlctf). 여기는 다르다. PSN02 는 의회 제정 법률이
  아니라 **MAS 가 자기 이름으로 발령한 고시**이며, 고시 본문이 발령 근거와
  주체를 명시한다. 발행 주체가 명확하므로 채웠다.

  【근거 법률 — 통설 정정】 제1.1절이 금융서비스시장법 2022 제16조를
  발령 근거로 명시한다. 「MAS PSA 근거」라는 서술이 널리 퍼져 있으나
  PSA 는 DPT 서비스 **라이선스**의 근거다. 두 법률을 구별해야 한다.
  → REG:sg-psa(미등재) 와의 관계를 엣지로 표현할 것. 과제.

  【미등재 — 과제】
  · 금융서비스시장법 2022 (FSMA) 및 지급서비스법 2019 (PSA)
  · PSN02 제13절 이외 조항 (CDD·기록보존·STR)
  · 자기수탁 지갑 관련 요건

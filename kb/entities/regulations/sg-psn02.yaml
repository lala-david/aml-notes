id: "REG:sg-psn02"
type: "REG"
layer: "semantic"
label:
  ko: "MAS 고시 PSN02 (디지털지급토큰 서비스 AML/CFT)"
  en: "MAS Notice PSN02 — AML/CFT for Digital Payment Token Service"
  short: "PSN02"
aliases: ["PSN02", "MAS Notice PSN02", "PS-N02"]
plain: >
  싱가포르 가상자산 사업자가 지켜야 할 자금세탁방지 규정입니다. 코인을 보낼 때 금액과 상관없이 이름·계좌를
  넘겨야 하고, 1,500싱가포르달러를 넘으면 신원확인까지 해야 합니다.
summary: >
  싱가포르 DPT(디지털지급토큰) 서비스 라이선스 보유자의 AML/CFT 의무를
  정하는 MAS 고시. 금융서비스시장법 2022 제16조에 근거해 발령된다.
  제13절이 가치이전 동반정보를 정하며, S$1,500 이하/초과로 요구 항목이
  갈린다. 이하 구간에도 4항목 의무가 존속한다.

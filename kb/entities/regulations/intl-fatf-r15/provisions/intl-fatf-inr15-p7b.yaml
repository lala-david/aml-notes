curator_note: >
  ⚠️ 【2026-07-30 정정】 초기 등재 시 IMPOSES 한정자에 threshold: 1000 / currency: USD 를
  넣었으나 **오류였다.** 원문 전문 확보 결과 §7(b) 에는 임계값 문언이 없다.

  USD/EUR 1 000 은 **§7(a) 의 CDD 임시거래 기준**이다 —
  "The occasional transactions designated threshold above which VASPs are required
  to conduct CDD is USD/EUR 1 000." 이는 R.10(고객확인) 소관이지 R.16(정보전달) 소관이 아니다.
  두 임계값을 혼동한 것이며, 업계에서도 흔한 혼동이다.

  → threshold 를 null 로 두고, CDD 임계값은 별도 PROV 노드(INR.15 §7(a))와
  별도 의무(OBL:x-occasional-transaction-cdd)로 분리 등재할 것. **재검토 과제.**

  【각주 49 의 규범적 의의】 "It is not necessary for this information to be attached
  directly to the virtual asset transfers." — 트래블룰 정보가 온체인에 첨부될 필요가 없다는
  근거 조항이다. 오프체인 메시징 프로토콜(TRP·TRISA·상용 네트워크)이 허용되는 원천이며,
  CTL:x-travel-rule-messaging 의 정당성 근거다.

  【기준서와 채점기준의 참조 불일치】 권고안 각주 48 은 INR.16 **¶9** 를 가리키나,
  시행 중인 평가방법론 c.15.9 각주 91 은 여전히 INR.16 **¶6** 을 가리킨다.
  Annex IV(개정 채점기준)가 미발효이기 때문이며, 상호평가는 구 기준으로 채점된다.
  → 이 이원화 자체를 FACT 로 기록했다.

  text_orig 의 위첨자 각주 표기는 [48]·[49] 로 치환했다(원문은 위첨자).
  항번호 서식("7. " 뒤 공백 2칸, "R. 16" 의 마침표 뒤 공백)은 원문 그대로 보존했다.

id: "PROV:intl-fatf-inr15-p7b"
type: "PROV"
layer: "semantic"
label:
  ko: "FATF 권고 15 해석주석 제7항(b) — 가상자산 이체 정보요건"
  en: "INR.15 paragraph 7(b) — VA transfer information requirements"
  short: "INR.15 §7(b)"
summary: >
  가상자산 이체 시 송신 VASP 가 송신인·수신인 정보를 확보·보유하고 수신 VASP 에
  즉시·안전하게 전달할 의무의 국제기준 근거 조항. 수신 VASP 의 보유 의무와
  당국 요청 시 제공 의무도 함께 규정한다. 2025-06 R.16 개정으로 확대된 정보요건은
  각주 48(→INR.16 ¶9)을 경유해 이 조항으로 유입된다.
parent_reg: "REG:intl-fatf-r15"
citation_path: "INR.15 §7(b)"
heading: "INTERPRETIVE NOTE TO RECOMMENDATION 15 (NEW TECHNOLOGIES)"
language: "en"
text_orig: >
  7.  With respect to the preventive measures, the requirements set out in
  Recommendations 10 to 21 apply to VASPs, subject to the following qualifications:

  (a)  R. 10 – The occasional transactions designated threshold above which VASPs
  are required to conduct CDD is USD/EUR 1 000.

  (b) R. 16 – Countries should ensure that originating VASPs obtain and hold
  required and accurate originator information and required beneficiary
  information[48] on virtual asset transfers, submit[49] the above information to
  the beneficiary VASP or financial institution (if any) immediately and securely,
  and make it available on request to appropriate authorities. Countries should
  ensure that beneficiary VASPs obtain and hold required originator information and
  required and accurate beneficiary information on virtual asset transfers and make
  it available on request to appropriate authorities. Other requirements of R. 16
  (including monitoring of the availability of information, and taking freezing
  action and prohibiting transactions with designated persons and entities) apply on
  the same basis as set out in R. 16. The same obligations apply to financial
  institutions when sending or receiving virtual asset transfers on behalf of a
  customer.
footnotes:
  "48": "As defined in INR. 16, paragraph 9, or the equivalent information in a virtual asset context."
  "49": "The information can be submitted either directly or indirectly. It is not necessary for this information to be attached directly to the virtual asset transfers."
tags: ["fatf", "travel-rule", "virtual-assets"]

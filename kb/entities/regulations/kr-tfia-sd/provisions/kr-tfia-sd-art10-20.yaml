curator_note: >
  【입법예고안과 공포본의 차이】 2026-03-30 입법예고안은 1,000만원 이상 거래를 「위험도와 관계없이
  의심거래로 보아」 보고하게 했다(자동 STR). 공포본 제7호나목은 「자체적인 의심거래 감시체계를
  구축ㆍ운영할 것」이다(FACT:0000204). 「1천만원 이상 자동 STR」 서술은 공포본 기준으로 틀렸다.

  「개인지갑」이라는 용어는 법령에 없다 — 법령상 표현은 「독점적인 관리 권한을 가지지 않은 가상자산주소」다.
  소유 증명 방법은 시행령도 고시(제28조의2제4항)도 정하지 않는다.

  이 조문의 제1호~제6호 등 기존 문언은 등재하지 않았다 — 이 노드는 제36592호가 개정한 제7호·제8호만 다룬다.
  수취 VASP 측 정보 확보 의무(제10조의5제6항)는 도시에가 문언을 확보하지 못해 별도 PROV 로 만들지 않았다.

  IMPOSES 엣지를 두지 않았다 — 이 의무(상대방 VASP 평가·자기수탁 주소 거래 제한·자체 감시체계)에 맞는
  OBL 노드가 아직 없다(OBL:x-travel-rule-originator 는 송신인 정보 전달 의무라 맞지 않음). → OBL 신설 과제.

id: "PROV:kr-tfia-sd-art10-20"
type: "PROV"
layer: "semantic"
label:
  ko: "특금법 시행령 제10조의20 제7호·제8호 (외국 가상자산사업자·자기수탁 주소와의 이전거래)"
  en: "TFIA Enforcement Decree Article 10-20 items 7-8"
  short: "시행령 제10조의20 제7호·제8호"
plain: >
  2027-02-19 부터 해외 거래소나 개인지갑으로 가상자산을 보낼 때 지켜야 할 기준을 정한 조항입니다. 구체적인 기준과
  1천만원이라는 금액은 FIU 고시에 다시 넘깁니다.
summary: >
  대통령령 제36592호가 개정한 조문(2027-02-19 시행, 2026-10-21 기준 enacted-not-in-force). 제7호는 외국
  가상자산사업자와의 이전거래에서 FIU 고시 방법으로 AML 조치를 평가하고 고시 기준에 맞게 거래할 것(가목),
  「1천만원 이상의 범위에서 금융정보분석원장이 정하여 고시하는 금액 이상」 거래에 자체 의심거래 감시체계를
  구축·운영할 것(나목)을 요구한다. 제8호는 「독점적인 관리 권한을 가지지 않은 가상자산주소」(자기수탁 지갑)를
  이용하는 상대방과의 이전거래에 고시 기준 준수(가목)와 제7호나목 이행(나목)을 요구한다.
parent_reg: "REG:kr-tfia-sd"
citation_path: "제10조의20 제7호·제8호"
language: "ko"
text_orig: >
  (제8호 본문) 가상자산사업자가 독점적인 관리 권한을 가지지 않은 가상자산주소를 이용하는 거래 상대방과
  가상자산 이전거래를 하는 경우에는 다음 각 목의 사항을 이행할 것 / (제7호나목) 자체적인 의심거래 감시체계를
  구축ㆍ운영할 것 / (제7호나목 금액) 1천만원 이상의 범위에서 금융정보분석원장이 정하여 고시하는 금액 이상 —
  인용은 travel-rule 도시에 F-015·F-020 이 옮긴 문언까지만이다
tags: ["korea", "travel-rule", "self-hosted-wallet", "counterparty-due-diligence", "enacted-not-in-force"]

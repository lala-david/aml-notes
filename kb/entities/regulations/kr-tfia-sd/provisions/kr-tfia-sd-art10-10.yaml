  【감시 우선순위가 높은 이유】 법률 개정 없이 이 조문만 바꾸면 실무가 바뀐다.
  개정령안은 기준금액 자체를 폐지해 "가치ㆍ수량과 관계없이 모든 경우"로 바꾸는데
  (FACT:0000008), 2026-07-30 기준 미공포다.


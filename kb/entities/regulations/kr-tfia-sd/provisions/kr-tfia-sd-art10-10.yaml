id: "PROV:kr-tfia-sd-art10-10"
type: "PROV"
layer: "semantic"
label:
  ko: "특금법 시행령 제10조의10 (가상자산 이체 시 정보제공 기준금액)"
  en: "TFIA Enforcement Decree Article 10-10"
  short: "시행령 제10조의10"
plain: >
  실무에서 쓰는 100만원이라는 숫자가 실제로 적혀 있는 곳입니다. 법률이 아니라 정부가 정하는 규정이라, 국회를
  거치지 않고 바뀔 수 있습니다.
summary: >
  가상자산 이체 시 송수신인 정보제공 의무의 **적용 기준금액을 실제로 정하는 조문**.
  제1호가 "1백만원 이상"을 규정한다. 법률 제5조의3 이 500만원 범위에서 위임하고
  제6조제3항이 VASP 적용을 위임한 결과 이 조문이 최종 기준을 확정한다.

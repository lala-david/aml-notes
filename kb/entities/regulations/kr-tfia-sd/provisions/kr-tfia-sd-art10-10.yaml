id: "PROV:kr-tfia-sd-art10-10"
type: "PROV"
layer: "semantic"
label:
  ko: "특금법 시행령 제10조의10 (가상자산 이전 시 정보제공)"
  en: "TFIA Enforcement Decree Article 10-10"
  short: "시행령 제10조의10"
plain: >
  실무에서 쓰는 100만원이라는 숫자가 실제로 적혀 있는 곳입니다. 2027-02-18 까지는 100만원 이상만 대상이고,
  2027-02-19 부터는 금액과 상관없이 다른 거래소로 보내는 모든 이전이 대상이 됩니다.
summary: >
  가상자산사업자가 다른 가상자산사업자에게 가상자산을 이전할 때 송·수신 고객 정보를 제공할 의무의
  **적용 범위를 실제로 정하는 조문**. 2022-03-25~2027-02-18 판 제1호는 「1백만원 이상」(A형),
  대통령령 제36592호로 개정된 2027-02-19 판 제1호는 「모든 경우」다. 2027 판은 성명·주소는 이전과 동시에,
  주민등록번호 등은 요청을 받은 날부터 3영업일 이내에 제공하게 한다.
parent_reg: "REG:kr-tfia-sd"
citation_path: "제10조의10 제1호~제4호"
language: "ko"
text_orig: >
  [2026-08-20 판, 2026-10-21 현재 효력] 1. 정보제공은 금융정보분석원장이 정하여 고시하는 환산 기준에 따라
  가상자산사업자가 다른 가상자산사업자에게 1백만원 이상에 상당하는 가상자산을 이전하는 경우에 할 것
  / [2027-02-19 판, enacted-not-in-force] 1. 정보제공은 가상자산사업자가 다른 가상자산사업자에게 가상자산을
  이전하는 모든 경우에 할 것 … (제4호 중) 제3호에 따른 정보는 정보제공을 요청받은 날부터 3영업일 이내에
  제공할 것 — 인용은 travel-rule 도시에 F-013·F-014 가 옮긴 문언까지만이며, 제2호·제3호·제4호 전문은
  원문 대조가 필요하다
tags: ["korea", "travel-rule", "threshold"]

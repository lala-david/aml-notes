curator_note: >
  **이 노드가 위임 구조의 종착점이다.** 법률만 보면 임계값을 알 수 없고,
  시행령까지 따라와야 실무 기준이 나온다. 그래서 임계값 한정자를 법률 조문
  (PROV:kr-tfia-art5-3)에서 이 노드로 옮겼다 — 2026-07-30 정정.

  【2026-10-21 정정】 2026-07-30 판은 IMPOSES 엣지 하나(threshold 1,000,000 / valid_to null)와
  「개정령안 미공포」 서술을 담고 있었다. 대통령령 제36592호가 2026-08-18 공포되어
  (EVT:kr-tfia-sd-36592-promulgated-2026) 이 조문 개정규정은 2027-02-19 시행으로 확정됐다
  (부칙 제1조 단서 「공포 후 6개월이 경과한 날」, 법제처 시행일 색인 20270219). 그래서 엣지를
  ① 2022-03-25~2027-02-18 threshold 1,000,000 KRW ② 2027-02-19~ threshold null 로 분할했다
  (FACT:0000200·0000201·0000202). 언론 보도의 2027-02-20 은 채택하지 않는다(CTR:00004 재판정).
  「개정령안 미공포」 서술은 삭제했다. 첫 엣지는 2026-07-30 에 valid_to null 로 기록됐던 것이다.

  2027 판의 추가정보(제3호, 주민등록번호 등)는 금액이 아니라 **요청**으로 발동된다 — 금액이
  정보 깊이를 가르는 B형과도 다르다. 1천만원은 이 조문이 아니라 시행령 제10조의20 제7호나목과
  감독규정 제28조의2 제3항 소관이다(PROV:kr-tfia-sd-art10-20).

  valid_from(2022-03-25)은 보고서 본문(2022-03-25 시행령 제10조의10 「1백만원 이상」)과 travel-rule
  도시에 타임라인 기준이다. review_due 는 시행일 직후로 잡았다 — 2027-02-19 법제처 「현행」 전환과
  금융위 시행 보도자료로 재확인할 것.

plain: >
  이용자보호법이 정한 "가상자산"의 뜻입니다. 특금법이 이 조항을 그대로 가져다 쓰기 때문에, 여기가 바뀌면 두 법의
  적용 범위가 함께 움직입니다.
summary: >
  가상자산이용자보호법의 정의 조항. 특금법 제2조제1호 하목·제3호가 이 조문을
  참조하므로, 두 법의 가상자산 정의가 결합되어 있다. 한쪽이 개정되면 다른 쪽의
  적용 범위도 함께 움직인다.

id: "PROV:kr-vaupa-art12"
type: "PROV"
layer: "semantic"
label:
  ko: "가상자산이용자보호법 제12조 (이상거래에 대한 감시)"
  en: "VAUPA Article 12 — surveillance of abnormal trading"
  short: "이용자보호법 제12조"
parent_reg: "REG:kr-vaupa"
citation_path: "제12조 제1항·제2항"
heading: "이상거래에 대한 감시"
language: "ko"
plain: >
  거래소가 시세조종 같은 불공정거래가 의심되는 거래를 늘 지켜보고, 의심되면 금융당국에 알리라고 정한 조항입니다.
  보이스피싱이나 계정 탈취를 막는 FDS 와는 다른 제도이고, 자금세탁 의심거래보고(STR)와도 다릅니다.
summary: >
  가상자산시장을 개설·운영하는 가상자산사업자(거래소)에게 대통령령으로 정하는 이상거래의 상시 감시와 금융위가
  정하는 적절한 조치(①), 제10조 위반이 의심되면 지체 없이 금융위·금감원장에게 통보하고 혐의가 충분히 증명된
  경우 등 고시된 경우에는 수사기관에 신고 후 보고할 의무(②)를 부과한다. 위반 시 각각 1억원 이하 과태료
  (제22조제1항제6호·제7호). 시행 2024-07-19.
text_orig: >
  제12조(이상거래에 대한 감시) ① 가상자산시장을 개설ㆍ운영하는 가상자산사업자는 가상자산의 가격이나
  거래량이 비정상적으로 변동하는 거래 등 대통령령으로 정하는 이상거래(이하 "이상거래"라 한다)를 상시 감시하고
  이용자 보호 및 건전한 거래질서 유지를 위하여 금융위원회가 정하는 바에 따라 적절한 조치를 취하여야 한다.
  ② 제1항의 가상자산사업자는 제1항에 따른 업무를 수행하면서 제10조를 위반한 사항이 있다고 의심되는 경우에는
  지체 없이 금융위원회 및 금융감독원장 … 에게 통보하여야 한다. 다만, 제10조를 위반한 혐의가 충분히 증명된 경우
  등 금융위원회가 정하여 고시하는 경우에는 지체 없이 수사기관에 신고하고 그 사실을 금융위원회 및 금융감독원장에게
  보고하여야 한다.
tags: ["korea", "market-abuse", "market-surveillance"]

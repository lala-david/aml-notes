curator_note: >
  【위임 구조 — 엣지 미표현】 제12조①의 「대통령령으로 정하는 이상거래」는 시행령 제18조(가격·거래량 비정상 변동,
  풍문·보도, 그 밖에 공정한 거래질서를 해칠 우려 — 모두 불공정거래 금지의무 위반 우려에 결속)가, 「금융위원회가
  정하는 바에 따라 적절한 조치」는 가상자산시장조사업무규정 제3조(거래유의 안내·조회공시·주문 수량·횟수 제한·
  거래 중지)가, ② 단서의 「금융위원회가 정하여 고시하는 경우」는 같은 규정 제4조(혐의 충분 증명·수사기관 요청)가
  정한다. 두 하위 규범의 REG 노드가 아직 없어 DELEGATES_TO 엣지를 두지 않았다 → REG 신설 과제.

  【범위】 이상거래 정의가 「불공정거래 우려」에 결속되어 있으므로 보이스피싱·계정탈취 탐지(FDS)는 이 조문의
  범위 밖이다 — 그쪽 법정 근거는 통신사기피해환급법 제2조의5(REG:kr-tsf-act). 산출물도 차단이 아니라 통보·신고다.
  의무 주체는 가상자산시장을 개설·운영하는 사업자로 한정된다(지갑·보관업자는 제12조 의무 없음).

  맞는 OBL 노드(시장감시 의무)가 없어 IMPOSES 엣지를 두지 않았다 → OBL 신설 과제.

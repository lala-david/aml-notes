curator_note: >
  e-Gov API 로 현행 전문을 받아 제1항·제2항을 축조 확인했다.
  text_orig 는 제1항 전문이다. 제2항(재위탁 시 통지)은 이 노드 범위에 함께 둔다.

  【미확인 과제 해소 — 2026-08-04】 최초 등재 시 「주무성령이 금액 한도를
  두는지 미확인」을 최우선 과제로 남겼고, 같은 날 해소했다.
  施行規則 제31조의7 이 법 제10조의5 를 이행하는 조문이며 금액 기준이 없다
  (PROV:jp-aptcp-mo-art31-7). e-Gov 조문 단위 엔드포인트에 枝番을
  URL 인코딩(article=31%E3%81%AE7)해 확보했다.
  → 이로써 IMPOSES 엣지를 B 에서 A 로 올렸다.

  【이제 확정 서술 가능】 법률(제10조의5)·정령(시행령 제7조)·성령(시행규칙
  제31조의7) 세 층위를 각각 원문으로 확인했다. 통지의무 계통 어디에도
  금액 조건이 없다. 정령의 십만엔은 特定取引 정의로서 거래시확인(CDD)
  계통에만 붙는다. EU TFR 제14조와 같은 수준의 근거를 갖췄다.
  **일본 암호자산 트래블룰에는 금액 임계가 없다.**

  【흔한 오귀속 — 경고】 시행령 제7조 제1항 제1호 ヤ 의 「10만엔 초과」를
  이 조문의 임계값으로 옮겨 적는 서술이 널리 퍼져 있다. 그것은 특정거래
  정의이고 거래시확인(CDD) 의무를 발동시키는 기준이다.
  → PROV:jp-aptcp-so-art7-ya 참조.

  valid_from 은 비워 두었다. 2023-06-01 시행이라는 2차 정보가 있으나
  부칙 원문으로 확인하지 않았다. 추정으로 채우면 시점 질의가 조용히 틀린다.

curator_note: >
  e-Gov API 로 현행 전문을 받아 제1항·제2항을 축조 확인했다.
  text_orig 는 제1항 전문이다. 제2항(재위탁 시 통지)은 이 노드 범위에 함께 둔다.

  【확신도가 갈리는 지점 — us-bsa 와 같은 구조】
  조문 문언은 A 다. 그러나 IMPOSES 엣지는 B 다. 이유는 두 가지다.
  (1) 통지할 「사항」이 주무성령 위임이라 의무의 실질 내용이 조문 안에 없다.
  (2) 주무성령이 금액 한도를 두는지 확인하지 못했다.
  施行規則(420M60000F5A001) 제31조는 법 제10조(환거래)를 이행하는 조문이며
  암호자산·금액 언급이 없음을 확인했으나, 법 제10조의5를 이행하는 조문은
  아직 원문을 못 봤다. e-Gov 전문 API 가 제13조에서 절단되고, 가지번호
  조문의 article 파라미터 표기법을 확인하지 못한 것이 원인이다.
  → **최우선 재검토 과제.** 이것이 풀려야 「일본 트래블룰 임계금액」 질문에
  답할 수 있다.

  【임계값 없음을 확정으로 적지 않은 이유】 EU TFR 제14조는 원문에서
  EUR 1 000 등장 지점을 전수 확인한 뒤에 threshold 한정자를 비웠다.
  여기는 위임된 하위 규범을 아직 안 봤으므로 같은 수준의 근거가 없다.
  「조문에 없다」와 「제도에 없다」는 다르다.

  【흔한 오귀속 — 경고】 시행령 제7조 제1항 제1호 ヤ 의 「10만엔 초과」를
  이 조문의 임계값으로 옮겨 적는 서술이 널리 퍼져 있다. 그것은 특정거래
  정의이고 거래시확인(CDD) 의무를 발동시키는 기준이다.
  → PROV:jp-aptcp-so-art7-ya 참조.

  valid_from 은 비워 두었다. 2023-06-01 시행이라는 2차 정보가 있으나
  부칙 원문으로 확인하지 않았다. 추정으로 채우면 시점 질의가 조용히 틀린다.

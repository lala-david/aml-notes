id: "PROV:jp-aptcp-art10-5"
type: "PROV"
layer: "semantic"
label:
  ko: "범수법 제10조의5 (암호자산 이전에 관한 통지의무)"
  en: "APTCP Article 10-5 — Notification obligation on transfer of crypto-assets"
  short: "범수법 제10조의5"
plain: >
  일본 거래소가 고객 요청으로 코인을 다른 거래소 고객에게 보낼 때, 보내는 사람과 받는 사람 정보를 상대
  거래소에 함께 통지하라는 조문입니다. 조문 자체에는 얼마 이상이라는 금액 조건이 없습니다.
summary: >
  일본 가상자산 트래블룰의 법적 근거 조항. 암호자산교환업자가 고객 의뢰로
  암호자산을 이전할 때, 수취고객의 자산을 관리하는 다른 암호자산교환업자등에게
  의뢰고객·수취고객의 본인특정사항 등을 통지해야 한다.
  **조문 본문에 금액 기준이 없다.** 통지할 사항의 범위는 주무성령에 위임된다.
  정령이 지정한 국가·지역에 소재하는 외국 암호자산교환업자는 적용에서 제외된다.
parent_reg: "REG:jp-aptcp"
citation_path: "第十条の五"
heading: "暗号資産の移転に係る通知義務"
language: "ja"
text_orig: >
  暗号資産交換業者は、顧客から依頼を受けて暗号資産の移転を行う場合において、
  当該移転を受取顧客（当該移転を受ける者であって、他の暗号資産交換業者又は
  外国暗号資産交換業者（資金決済に関する法律第二条第十七項に規定する外国
  暗号資産交換業者をいい、政令で定める国又は地域に所在するものを除く。）
  （以下この条において「他の暗号資産交換業者等」という。）の顧客として
  暗号資産の管理を当該他の暗号資産交換業者等に委託しているものをいう。
  以下この条及び第二十二条第二項第三号において同じ。）に対して行うとき、
  又は受取顧客に対する当該移転を他の暗号資産交換業者等に委託するときは、
  当該依頼を行った顧客及び当該受取顧客に係る本人特定事項その他の事項で
  主務省令で定めるものを当該受取顧客のために当該移転に係る暗号資産の管理を
  する他の暗号資産交換業者等（当該委託を受けた者を除く。）又は当該委託を
  受けた者に通知して行わなければならない。
tags: ["jp", "travel-rule", "crypto-asset", "no-threshold-in-text"]

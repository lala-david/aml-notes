curator_note: >
  【2026-07-30 정정】 초기 등재 시 IMPOSES 한정자에 threshold: 1000000 을 넣었으나
  **위치가 틀렸다.** 이 조문은 기준금액을 정하지 않는다 — 500만원 범위에서 대통령령에
  위임할 뿐이다. 실제 기준금액 100만원은 시행령 제10조의10 제1호가 정한다.
  → 임계값 한정자를 PROV:kr-tfia-sd-art10-10 으로 이관하고, 여기에는 DELEGATES_TO 를 두었다.

  같은 유형의 오류를 FATF 조문에서도 냈다(INR.15 §7(b) 에 §7(a) 의 CDD 임계값을 붙임).
  **"의무를 부과하는 조문"과 "수치를 정하는 조문"이 다를 수 있다**는 것이 교훈이다.

  【3단 위임 구조】
    법률 제5조의3    — 500만원 범위 내 위임
    법률 제6조제3항  — VASP 적용 시 대통령령 위임 (PROV 미등재 — 과제)
    시행령 제10조의10 제1호 — "1백만원 이상" 확정
  따라서 임계값은 **법률 개정 없이 시행령만으로 변경 가능**하다. 감시 우선순위가 높은 이유이며,
  실제로 개정령안이 기준금액 폐지를 추진 중이다 (FACT:0000008, 미공포).

  valid_from(2022-03-25)은 트래블룰 시행일로 알려진 값이나 이 문서로 직접 확인되지
  않았다. 시행령 부칙 확인 필요 → 재검토 과제.

  text_orig 미확보 — OC 발급 후 lawService.do target=lawjosub 으로 채울 것.

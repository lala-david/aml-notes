id: "PROV:kr-tfia-art6-p3"
type: "PROV"
layer: "semantic"
label:
  ko: "특금법 제6조 제3항 (가상자산사업자에 대한 적용 위임)"
  en: "TFIA Article 6(3) — delegation for VASP application"
  short: "특금법 제6조제3항"
plain: >
  거래소에는 이 의무를 어떻게 적용할지를 다시 정부에 넘기는 조항입니다. 법률만 읽으면 여기서 막히고, 실제 숫자는
  시행령까지 가야 나옵니다.
summary: >
  가상자산사업자에 대한 정보제공 의무의 구체적 적용 방식을 대통령령에 위임하는 조문.
  제5조의3(전신송금 정보제공)이 일반 원칙과 상한을 정하고, 이 조문이 VASP 적용을
  위임하며, 시행령 제10조의10이 기준금액을 확정하는 3단 구조의 **중간 고리**다.

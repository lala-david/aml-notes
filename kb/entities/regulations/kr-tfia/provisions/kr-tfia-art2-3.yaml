  【2축 상호참조】 특금법 제2조제1호 하목·제3호가 가상자산이용자보호법 제2조를
  참조한다. 즉 두 법의 정의가 결합되어 있어, 한쪽이 바뀌면 양쪽 적용 범위가 함께
  움직인다. 이용자보호법 조문도 PROV 로 등재해 DEFINES 를 이중으로 걸어야 한다.

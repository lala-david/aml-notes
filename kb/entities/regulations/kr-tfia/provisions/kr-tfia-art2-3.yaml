  en: "TFIA Article 2(3) — definition of virtual asset"
  short: "특금법 제2조제3호"
plain: >
  무엇을 "가상자산"으로 볼지 정한 조항입니다. 여기 들어오면 규제를 받고 빠지면 안 받으므로, 제외 목록이 규제
  범위를 직접 가릅니다.
summary: >
  특금법상 "가상자산"의 정의 조항. 경제적 가치를 지니고 전자적으로 거래·이전될 수
  있는 전자적 증표를 가리키되, 제외 대상을 열거하는 방식으로 범위를 좁힌다.
  가상자산이용자보호법 제2조와 상호참조 관계에 있다.

id: "REG:au-amlctf"
type: "REG"
layer: "semantic"
label:
  ko: "자금세탁방지 및 테러자금조달방지법 2006"
  en: "Anti-Money Laundering and Counter-Terrorism Financing Act 2006"
  short: "AML/CTF Act 2006"
aliases: ["AML/CTF Act", "AML/CTF Act 2006", "호주 AML/CTF법"]
plain: >
  호주의 자금세탁방지 기본법입니다. 2024년에 크게 고쳐서 가상자산 사업자도 정식으로 규제 대상이 됐고, 그
  부분은 2026년 3월 31일부터 시행 중입니다.
summary: >
  호주 AML 체계의 근간 법률. AUSTRAC 이 감독한다. 제5편이 가치 이전(value
  transfer)에 관한 의무를 정하며, 2024년 개정법(AML/CTF Amendment Act 2024)이
  「digital currency」를 「virtual asset」으로 교체하고 제66A조를 신설해
  가상자산 이전에 트래블룰을 적용했다. 가상자산 관련 개정은 2026-03-31 시행.
reg_kind: "statute"
citation: "Act No. 169 of 2006 (C2006A00169)"
binding: "binding"
language: "en"

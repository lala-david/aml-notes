curator_note: >
  확신도 C — 도시에 확인 사실이나 DOC 노드 미등재. CELEX 32024R1624 확보 필요.

  **"EU 신 AML 체계가 시행 중"은 오류다.** MiCA·TFR 은 적용 중이나
  AML 본체(AMLR·AMLD6)는 2027-07-10 까지 미적용이다. 이 비대칭이 EU 서술의
  가장 흔한 오류원이며, 리서치 1파도 이를 지적했다.
  → lifecycle STATE 를 enacted(적용 전)로 기록해야 한다.

id: "PROV:hk-amlo-sch2-s13a"
type: "PROV"
layer: "semantic"
label:
  ko: "AMLO 부칙2 제13A조 (가상자산 이전 — 동반정보)"
  en: "AMLO Schedule 2 section 13A — Information accompanying virtual asset transfers"
  short: "AMLO 부칙2 §13A"
plain: >
  홍콩에서 가상자산을 다른 기관으로 보낼 때 송신인·수신인 정보를 함께 넘기라는 조문입니다. 금액이 얼마든
  이름과 계좌번호는 넘겨야 하고, 8,000홍콩달러 이상이면 주소나 신분증번호가 추가로 붙습니다.
summary: >
  홍콩 가상자산 트래블룰의 근거 조항. 주문기관은 가상자산 이전 시
  송신인·수신인 정보를 취득·기록하고 수익기관에 안전하게 즉시 제출해야 한다.
  **의무 자체에 금액 조건이 없다.** HK$8,000 은 요구 항목을 나누는 기준으로,
  미만이면 4항목(양측 성명·계좌번호), 이상이면 송신인의 주소·고객식별번호·
  신분증번호 또는 생년월일·출생지가 추가된다.
parent_reg: "REG:hk-amlo"

curator_note: >
  【항별 대응 — SFC 지침 여백 표시 기준】
    s.13A(1) & (8)  적용 범위 — 주문기관·중개기관·수익기관 정의 (¶12.11.4)
    s.13A(2)        HK$8,000 이상 요구 항목 5종 (¶12.11.5)
    s.13A(2) & (3)  HK$8,000 미만 요구 항목 4종 (¶12.11.6)
    s.13A(4)        수익기관에 안전하게·즉시 제출 (¶12.11.9·12.11.10)

  【HK$8,000 을 threshold 한정자에 넣지 않은 이유】
  EU·영국과 같은 판단이다. 이 금액은 의무를 발동시키지 않는다 —
  미만 거래에도 4항목 의무가 그대로 걸린다. 한정자에 넣으면
  관할 비교표가 「홍콩 임계 HK$8,000」 이라는 틀린 표를 자동 생성한다.

  【text_orig 미기재 — 의도적】 조례 축조 문언을 확보하지 못했다.
  SFC 지침은 감독기관의 재서술이며 조문 자체가 아니다.
  지침 문언을 text_orig 에 넣으면 원문인 척하는 서술이 된다 —
  PROV:jp-aptcp-mo-art31-7 과 같은 판단.
  elegislation.gov.hk 우회 경로 확보가 과제로 남는다.

  【용어 주의】 지침이 "not less than $8,000" / "less than $8,000" 으로
  가르므로 **정확히 HK$8,000 은 상위 구간**이다. 영국 £800(이상),
  싱가포르 S$1,500(초과, 즉 1,500 은 하위 구간)과 경계 처리가 다르다.
  비교표에 「8,000 이상 / 1,500 초과」를 뭉뚱그리면 경계값이 틀린다.

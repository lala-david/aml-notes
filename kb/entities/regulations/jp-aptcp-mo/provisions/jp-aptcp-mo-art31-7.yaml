curator_note: >
  e-Gov 조문 단위 엔드포인트로 확인했다(枝番 URL 인코딩 article=31%E3%81%AE7).

  【이 노드가 닫은 질문】 PROV:jp-aptcp-art10-5 가 「주무성령이 금액 한도를
  두는지 미확인」을 최우선 과제로 남겼다. 이 조문이 그 주무성령이고,
  금액 기준이 없다. 따라서 법률·정령·성령 세 층위 전부에서
  통지의무에 금액 조건이 붙지 않음이 확정됐다.

  【text_orig 미기재】 조문 내용은 확인했으나 일본어 축조 문언을 그대로
  옮길 만큼 확보하지 못했다. 요약만 있는 상태에서 text_orig 를 채우면
  원문인 척하는 서술이 된다 — PROV:au-amlctf-s66a 와 같은 판단이다.
  원문 문언 확보를 과제로 남긴다.

  【술어 정정 이력】 처음에 IMPLEMENTS 로 걸었다가 검증기에 차단됐다
  (ONT-3, 치역 위반: IMPLEMENTS 는 REG→REG 로 국제기준 이행 관계다).
  국내 법령 위계의 수직 위임은 DELEGATES_TO 이며, 상위 규범 쪽인
  PROV:jp-aptcp-art10-5 에 걸었다. 검증기가 설계대로 작동했다.

id: "PROV:jp-aptcp-mo-art31-7"
type: "PROV"
layer: "semantic"
label:
  ko: "범수법 시행규칙 제31조의7 (암호자산 이전 통지사항)"
  en: "APTCP Enforcement Ordinance Art. 31-7 — items to be notified on crypto-asset transfer"
  short: "범수법 시행규칙 제31조의7"
plain: >
  코인을 다른 거래소로 보낼 때 상대에게 정확히 무엇을 알려야 하는지 항목을 정한 조문입니다. 보내는 사람은
  이름·주소, 받는 사람은 이름과 식별부호입니다. 금액 조건은 없습니다.
summary: >
  법 제10조의5가 주무성령에 위임한 통지사항을 정하는 조항.
  의뢰고객이 자연인·인격 없는 사단등이면 성명, 주소 또는 식별번호 또는
  고객번호, 이전에 관한 식별부호. 법인이면 명칭, 주된 사무소 소재지 또는
  고객번호, 이전에 관한 식별부호. 수취고객은 성명·명칭과 식별부호.
  **이 조문에도 금액 기준이 없다.**

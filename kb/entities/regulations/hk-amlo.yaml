id: "REG:hk-amlo"
type: "REG"
layer: "semantic"
label:
  ko: "자금세탁 및 테러자금조달 방지 조례"
  en: "Anti-Money Laundering and Counter-Terrorist Financing Ordinance"
  short: "AMLO"
aliases: ["AMLO", "Cap. 615", "打擊洗錢及恐怖分子資金籌集條例"]
plain: >
  홍콩의 자금세탁방지 기본 조례입니다. 부칙2 제13A조가 가상자산을 보낼 때 송신인·수신인 정보를 함께
  넘기라고 정합니다. 금액과 무관하게 의무가 발생하고, 8,000홍콩달러를 넘으면 항목이 늘어납니다.
summary: >
  홍콩 AML 체계의 근간 조례. 2022년 개정으로 VASP 라이선스 제도가 도입되었고
  SFC 가 인가·감독한다. 부칙2(Schedule 2) 제13A조가 가상자산 이전 시
  동반정보 의무를 정한다. 의무 자체에는 금액 조건이 없으며 HK$8,000 은
  요구되는 정보 항목을 나누는 기준이다.

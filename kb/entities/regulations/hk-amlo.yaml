curator_note: >
  【확보 수준】 조례 원문을 직접 보지 못했다. elegislation.gov.hk 가
  정적 수신에 본문을 주지 않는다. 근거는 SFC 지침이 여백에 단
  조문 대응 표시다 — 감독기관 자신의 표시라 신뢰도는 높으나
  축조 문언은 아니다.

  【ISSUED_BY 확신도 C — 잠정】 SFC 는 VASP 감독·인가 기관이고 조례는
  입법회 제정이다. 다른 관할(REG:us-bsa·kr-tfia·gb-mlr2017·jp-aptcp·
  au-amlctf)에서는 같은 이유로 ISSUED_BY 를 비웠다. 여기만 채운 것은
  일관성이 없다 — 「발행 주체 모델링 ADR」 확정 시 함께 정리할 것.
  당장 지우지 않는 이유는 이 노드가 고립되지 않게 하기 위함이며,
  그 사정을 여기 남긴다.

  【미등재 — 과제】
  · 부칙2 제13A조 축조 문언 (elegislation 우회 경로 필요)
  · 2022년 개정조례(VASP 제도 도입) 및 시행일 부칙
  · 자기수탁 지갑 관련 요건 (지침 ¶12.14)
  · 부칙2 제12조 등 일반 전신송금 조문

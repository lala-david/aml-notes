curator_note: >
  생애주기 상태는 이 노드의 속성이 아니라 kb/states/ 의 STATE 레코드로 관리한다
  (L1 에 시간을 넣지 않는 원칙).

  【2026-10-21 정정】 2026-07-30 판의 citation 「법률 제19563호(현행 시행본) / 법률 제21358호
  (2026-08-20 시행 예정)」은 둘 다 낡았다. 법률 제21358호(대주주 심사·신고 조건부 수리·퇴직자
  제재통보)는 2026-08-20 시행됐고(in-force, EVT:kr-tfia-21358-effective-2026), 이어 법률
  제21857호(2026-08-04 공포, 타법개정)가 2026-10-02 부터 현행본이다(FACT:0000207).
  2026-01-29 본회의 통과 보도자료는 제5조의3(가상자산 이전 시 정보제공) 개정을 언급하지 않는다 —
  트래블룰 변화는 법률이 아니라 시행령(대통령령 제36592호)에서 일어났다.

  kb/states/2026.jsonl 의 STATE:00001(lifecycle, 법률 제19563호)·STATE:00002
  (pending_amendment_law_no=21358, valid_to null)은 이 정정에 맞춰 마감해야 하나 이 작업 범위
  밖이다 → 재검토 과제.

  ISSUED_BY 를 ORG:kr-kofiu 로 둔 것은 잠정 처리다. 법률의 발의·공포 주체는
  국회·정부이며 FIU 는 집행기관이므로, ORG:kr-nabo / ORG:kr-fsc 노드 생성 후
  정정해야 한다. → 재검토 과제.

  IMPLEMENTS → REG:intl-fatf-r16 엣지는 두지 않는다 — CTR:00002 판정대로 VASP 트래블룰의
  국제 근거는 INR.15 §7(b) 다.

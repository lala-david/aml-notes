curator_note: >
  생애주기 상태는 이 노드의 속성이 아니라 kb/states/ 의 STATE 레코드로 관리한다
  (L1 에 시간을 넣지 않는 원칙). 현행 시행본은 법률 제19563호(공포 2023-07-18,
  시행 2024-07-19, 타법개정)이며, 법률 제21358호가 2026-08-20 시행 예정이다.

  ISSUED_BY 를 ORG:kr-kofiu 로 둔 것은 잠정 처리다. 법률의 발의·공포 주체는
  국회·정부이며 FIU 는 집행기관이므로, ORG:kr-nabo / ORG:kr-fsc 노드 생성 후
  정정해야 한다. → 재검토 과제.

  IMPLEMENTS → REG:intl-fatf-r16 엣지가 누락되어 있다. FATF 도시에 검증 완료 후
  추가할 것. 현재 추가하면 미검증 노드 참조가 되므로 보류.

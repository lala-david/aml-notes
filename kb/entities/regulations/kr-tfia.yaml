id: "REG:kr-tfia"
type: "REG"
layer: "semantic"
label:
  ko: "특정 금융거래정보의 보고 및 이용 등에 관한 법률"
  en: "Act on Reporting and Using Specified Financial Transaction Information"
  short: "특금법"
aliases: ["특정금융정보법", "특금법", "TFIA", "특정금융거래정보법"]
plain: >
  한국에서 자금세탁을 막기 위한 기본 법률입니다. 2020년 개정으로 거래소도 여기 들어와, 신고하고 고객을 확인하고
  수상한 거래를 보고할 의무를 지게 됐습니다.
summary: >
  대한민국 자금세탁방지 기본법. 2020년 개정으로 가상자산사업자를 규제 대상에
  편입하여 신고 의무(제7조), 고객확인(제5조의2), 가상자산 이전 시 정보제공(제5조의3·제6조제3항),
  의심거래보고(제4조) 등을 부과한다. 가상자산 정의는 가상자산이용자보호법 제2조를 상호참조한다.
reg_kind: "statute"
citation: "법률 제21857호 (2026-08-04 공포, 2026-10-02 시행, 타법개정, 현행) ← 법률 제21358호 (2026-02-19 공포, 2026-08-20 시행)"

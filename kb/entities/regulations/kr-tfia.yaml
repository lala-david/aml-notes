id: "REG:kr-tfia"
type: "REG"
layer: "semantic"
label:
  ko: "특정 금융거래정보의 보고 및 이용 등에 관한 법률"
  en: "Act on Reporting and Using Specified Financial Transaction Information"
  short: "특금법"
aliases: ["특정금융정보법", "특금법", "TFIA", "특정금융거래정보법"]
summary: >
  대한민국 자금세탁방지 기본법. 2020년 개정으로 가상자산사업자를 규제 대상에
  편입하여 신고 의무(제7조), 고객확인(제5조의2), 트래블룰(제5조의3), 의심거래보고
  등을 부과한다. 가상자산 정의는 가상자산이용자보호법 제2조를 상호참조한다.
reg_kind: "statute"

curator_note: >
  【시행일 미확정】 FIU 고시 제2026-2호 부칙은 제28조의2 를 「공포 후 6개월이 경과한 날」부터 시행한다.
  발령일 2026-08-20 을 기산점으로 하면 2027-02-21 이 되어 시행령 제10조의20(2027-02-19)과 이틀
  어긋날 수 있다(FACT:0000206). 2026-10-21 기준 enacted-not-in-force. 법제처 행정규칙 시행일 색인 또는
  FIU 안내로 확정한 뒤 valid_from 을 엣지에 기록할 것 — 그 전에는 날짜를 확정 기재하지 않는다.

  【자기수탁 지갑】 거래소 자율규제였던 「본인 지갑만 허용」(외부지갑 등록제)이 이 조문으로 고시 의무가 된다.
  소유 증명 방법은 정하지 않는다(EU EBA/GL/2024/11 ¶83 의 방법 열거와 대비).

  【sunrise 대응의 법령화】 저위험 요건 나목 「가상자산 이전 시 정보제공의무 등 자금세탁방지의무를 이행하고
  있을 것」 — 상대 관할의 트래블룰 시행 여부가 허용 요건이 된다(travel-rule 도시에 F-017 note).

  IMPOSES 엣지를 두지 않았다 — 맞는 OBL 노드가 없다(PROV:kr-tfia-sd-art10-20 curator_note 참조).

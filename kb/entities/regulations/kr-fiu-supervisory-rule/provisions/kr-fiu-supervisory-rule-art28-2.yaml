id: "PROV:kr-fiu-supervisory-rule-art28-2"
type: "PROV"
layer: "semantic"
label:
  ko: "감독규정 제28조의2 (외국 가상자산사업자 등과의 가상자산 이전거래 기준)"
  en: "KoFIU Supervisory Regulation Article 28-2"
  short: "감독규정 제28조의2"
plain: >
  해외 거래소를 위험도에 따라 세 갈래(허용 / 본인 간만 허용 / 제한)로 나누고, 개인지갑과는 본인 지갑끼리만
  주고받게 하며, 1천만원 이상 거래에는 자체 감시를 붙이라고 정한 고시 조항입니다. 시행일은 2027년 2월
  중인데 정확한 날짜는 아직 확정되지 않았습니다.
summary: >
  시행령 제10조의20 제7호·제8호가 위임한 기준을 정한다. ① 외국 가상자산사업자와 거래관계 수립 전 신원확인·
  AML 조치 평가와 주기적 재평가. ② ㉮ FATF 권고 이행국 소재·국내와 유사한 수준의 AML 의무 이행·인허가 이행을
  모두 충족하고 저위험이면 이전 허용(시행령 제10조의10제2호 정보 확보 전제) ㉯ 그 외는 고객과 상대방이 동일한
  경우에 한해 허용 ㉰ FATF 고위험국 소재·인허가 미이행·고위험 평가 시 거래 제한. ③ 시행령 제10조의20제7호나목의
  고시 금액 = 1천만원. ④ 독점적 관리 권한 없는 주소(자기수탁 지갑)와는 위험이 현저히 높으면 해소 전까지
  제한, 그 외는 동일인일 때만 허용(법령상 의무 이행·국가기관 권한 행사 이전은 예외).
parent_reg: "REG:kr-fiu-supervisory-rule"
citation_path: "제28조의2 제1항~제4항"
language: "ko"
text_orig: >
  (②2호) 제1호 및 제3호에 해당하지 않는 경우에는 고객과 가상자산 이전거래의 상대방이 동일한 경우에 한해
  가상자산 이전거래를 허용하여야 한다. / (②3호 중) 외국 가상자산사업자가 FATF가 지정하는 조치를 요하는
  고위험 국가에 소재할 것 / (③) 영 제10조의20제7호나목에서 "금융정보분석원장이 정하여 고시하는 금액"이란
  1천만원을 말한다. / (④2호) 제1호에 해당하지 않는 경우에는 고객과 가상자산 이전거래의 상대방이 동일한 경우에
  한해 가상자산 이전거래를 허용할 것. 다만, 법령에 따른 의무의 이행 또는 국가기관의 적법한 권한 행사에 따라
  가상자산을 이전하는 경우에는 그러하지 아니하다. — 인용은 travel-rule 도시에 F-017·F-018 이 옮긴 문언까지만이다
tags: ["korea", "travel-rule", "self-hosted-wallet", "counterparty-due-diligence", "enacted-not-in-force"]

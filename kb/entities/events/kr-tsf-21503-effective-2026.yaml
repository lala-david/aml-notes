id: "EVT:kr-tsf-21503-effective-2026"
type: "EVT"
layer: "dynamic"
label:
  ko: "통신사기피해환급법 법률 제21503호 시행 — 가상자산거래소에 보이스피싱 임시조치 의무"
  en: "Telecom Fraud Refund Act No. 21503 enters into force — VA exchanges covered"
track: "C"
evt_kind: "legislative"
occurred_on: "2026-10-01"
announced_on: "2026-10-01"
date_precision: "day"
jurisdiction: "JUR:kr"
impact: "H"
plain: >
  2026-10-01 부터 가상자산거래소도 은행처럼 보이스피싱 의심 계정의 가상자산 이전을 멈추고(임시조치), 지급정지와
  피해환급 절차를 따라야 합니다.
summary: >
  법률 제21503호(2026-03-31 공포)가 부칙 제1조 「공포 후 6개월이 경과한 날」에 따라 2026-10-01 시행됐다. 가상자산
  거래소가 「금융회사등」에 포함되어 제2조의5 임시조치(이체·송금·출금 또는 가상자산 이전 지연·일시정지), 제2조의6
  거래목적 확인, 제4조 지급정지, 피해환급 의무를 진다. 법 제명도 「피해자산 환급」으로 바뀌었다.
significance: >
  가상자산거래소의 보이스피싱 대응이 자율규제(2025-05 출금지연제도, 2026-04-07 강화된 출금지연제도)에서 법정
  의무로 바뀐 시점이다. 한국에서 「이상거래」를 다루는 세 제도 — FDS/임시조치(이 법), 시장감시(가상자산이용자보호법
  제12조), STR(특금법) — 가 모두 가상자산거래소에 법적으로 걸리게 됐다.
tags: ["korea", "fraud", "voice-phishing", "in-force"]

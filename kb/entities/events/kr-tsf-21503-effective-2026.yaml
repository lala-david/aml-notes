curator_note: >
  공포 2026-03-31 + 「공포 후 6개월이 경과한 날」 = 2026-10-01 (FACT:0000210). 부칙 제3조~제5조로 임시조치·
  거래목적 확인·지급정지 개정규정은 시행 이후 발생 건부터 적용된다. 출금지연제도 경과(2025-05, 2026-04-07)는
  금융위 보도자료(fds 도시에 F-045, 확신도 B)이며 이 노드의 증거로 결속하지 않았다.

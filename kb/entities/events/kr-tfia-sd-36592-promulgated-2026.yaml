curator_note: >
  시행(2027-02-19)은 아직 발생하지 않았으므로 별도 EVT 를 만들지 않았다. 시행일 도래 시
  EVT:kr-tfia-sd-36592-effective-2027 을 만들고 법제처 「현행」 전환을 확인할 것. 언론의 2027-02-20 은 채택하지

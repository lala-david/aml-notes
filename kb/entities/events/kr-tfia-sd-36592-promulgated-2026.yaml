label:
  ko: "특금법 시행령 대통령령 제36592호 공포 (트래블룰 기준금액 폐지 확정)"
  en: "TFIA Enforcement Decree, Presidential Decree No. 36592 promulgated"
track: "C"
evt_kind: "legislative"
occurred_on: "2026-08-18"
announced_on: "2026-08-18"
date_precision: "day"
jurisdiction: "JUR:kr"
impact: "H"
plain: >
  트래블룰 100만원 기준을 없애는 시행령 개정이 공포됐습니다. 본칙은 2026-08-20 시행됐지만, 기준금액 폐지와 해외
  거래소·개인지갑 규율은 6개월 뒤인 2027-02-19 부터 적용됩니다.
summary: >
  2026-08-11 국무회의 의결을 거쳐 대통령령 제36592호가 2026-08-18 공포됐다. 본칙 2026-08-20 시행. 부칙 제1조
  단서로 제10조의2·제10조의5제6항·제10조의10·제10조의20·제16조의2제1호·제4호 개정규정은 공포 후 6개월이
  경과한 날(2027-02-19)부터 시행한다. 제10조의10 은 「1백만원 이상」→「모든 경우」, 제10조의20 은 해외 VASP 평가·
  자기수탁 주소 거래 기준과 1천만원 범위 자체 의심거래 감시체계를 신설한다.
significance: >
  2026-07-30 저장소가 proposed 로 기록한 하위법령 개정(CTR:00004)이 enacted 로 바뀐 시점이다. 한국 트래블룰은
  2027-02-19 부터 A형(의무에 금액)에서 「전건 + 요청 시 추가정보」 구조로 바뀌고, 해외 VASP·자기수탁 지갑과의
  이전에 처음으로 법령상 차등 규율이 생긴다. 2026-10-21 기준 해당 조문은 enacted-not-in-force 이며 효력 있는
  기준은 여전히 100만원이다.
tags: ["korea", "travel-rule", "enacted-not-in-force"]

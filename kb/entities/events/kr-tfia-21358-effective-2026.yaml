plain: >
  거래소 신고 제도를 강화한 특금법 개정이 2026-08-20 시행됐습니다. 같은 날 시행령 본칙과 FIU 감독규정
  개정(제2026-2호)도 함께 시행됐습니다.
summary: >
  법률 제21358호(2026-02-19 공포; 대주주 심사·신고 조건부 수리·퇴직자 제재통보)가 2026-08-20 시행됐다. 같은 날
  대통령령 제36592호 본칙과 FIU 고시 제2026-2호(감독규정)가 시행됐다. 2026-08-13 FIU·금감원은 이에 맞춘
  신고매뉴얼 전면 개정안을 공표했다.

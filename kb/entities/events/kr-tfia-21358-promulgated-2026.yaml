summary: >
  특금법 제7조(신고) 개정 법률이 공포되었다. 제1항 제1호의2 대주주 신고사항 신설,
  신고 불수리 사유 4개 → 8개 확대(재무상태·사회적 신용·내부통제·서류 허위),
  제10항 신고 수리 시 조건 부과권 신설. 시행일은 2026-08-20.
significance: >
  가상자산사업자 신고제가 사실상 인가제에 가까워지는 전환점이다. 불수리 사유
  확대와 조건 부과권 신설은 감독당국의 진입 통제 재량을 실질적으로 확대하며,
  기존 신고 사업자의 갱신·유지에도 영향을 미친다. 대주주 적격성이 신고사항에
  편입되면서 지배구조가 규제 대상으로 들어온다.
tags: ["korea", "tfia", "vasp-registration", "enacted-not-in-force"]

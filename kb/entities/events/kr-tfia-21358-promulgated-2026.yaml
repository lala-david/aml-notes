curator_note: >
  시행(2026-08-20) 은 아직 발생하지 않았으므로 별도 EVT 를 만들지 않았다.
  시행일 도래 시 EVT:kr-tfia-21358-effective-2026 을 생성하고 REG:kr-tfia 의
  pending_amendment_law_no STATE 를 종료할 것. → review_due 를 시행 직후로 설정.

  【설계 논점】 개정 법률의 생애주기를 어디에 붙일지가 미해결이다. 현재는
  REG:kr-tfia 의 속성(pending_amendment_law_no)으로 처리했으나, 엄밀하게는
  개정 법률(법률 제21358호)이 독립 REG 노드이고 AMENDS 엣지로 원법을 가리키는
  것이 맞다. 그렇게 하지 않으면 "개정법의 시행 상태"와 "원법의 시행 상태"가
  같은 attribute 를 놓고 STATE 구간 충돌(I-4)을 일으킨다.
  → ADR 로 결정 필요. 개정 법률 다수를 등재하기 전에 확정할 것.

id: "IND:x-proxy-domain-registration"
type: "IND"
layer: "semantic"
label:
  ko: "프록시·소유자 비공개 도메인 등록 이용자"
summary: >
  플랫폼 이용자가 인터넷 도메인을 프록시나 소유자 정보를 감추는 등록대행(DNS registrar)으로 등록해 두었다.
signal_type: "kyc"
tags: ["indicator", "kyc", "fatf-red-flag"]
evidence:
  - doc: "DOC:intl-fatf-va-red-flags-2020"
    confidence: "A"
    locator: "RF-A9 · para 13 · pp.9–10"
    quote: "Users entering the VASP platform having registered their Internet domain names through proxies or using domain name registrars (DNS) that suppress or redact the owners"
    retrieved: "2026-10-21"
created_at: "2026-10-21"
updated_at: "2026-10-21"
review_due: "2027-01-19"
curator_note: >
  **단일 지표만으로 범죄를 시사하지 않는다.** 원문 스스로 "The mere presence of a red flag
  indicator is not necessarily a basis for a suspicion of ML or TF"(para 8, p.4)라고 적는다.
  합리적 사업적 설명이 없는 상태에서 복수 지표가 동시 발현할 때 비로소 의심의 근거가 된다.

  확신도 A — FATF Red Flag Indicators(2020-09-14) 원문 RF-A9 에서 직접 옮겼다
  (research/2026-10-fatf-virtual-asset-reports.md §3A-3 에서 저장소 63지표와 대응 없음으로 확인).
  원문은 탐지 임계값을 정하지 않으므로 rule_sketch 를 두지 않았다.
  fp_risk 미기입 — 공개 근거 없음.

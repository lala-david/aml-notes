id: "ACTION:x-amend-node"
type: "ACTION"
layer: "kinetic"
label:
  ko: "노드 수정"
  en: "Amend node"
summary: >
  이미 등재된 항목의 내용이나 연결 관계를 고친다. 분류를 잘못한 것을 바로잡거나, 수치가 붙을 자리를
  옮기거나, 근거 문서를 다시 매거나, 확신도를 조정하는 일이 여기 속한다. 새로 만들거나 지우는 것과는
  구별한다.
action_kind: "governance"
tier: "L1-write"
tags: ["governance", "l1-write"]
change_set:
  creates: []
  modifies:
    - target: "any"
      properties: ["label", "summary", "tags", "edges", "evidence", "curator_note", "updated_at", "review_due"]
  never_touches: ["id", "type", "layer", "created_at"]
submission_criteria:
  - "변경 사유를 curator_note 에 기록한다"
  - "엣지 추가 시 술어가 온톨로지에 정의되어 있고 정의역·치역을 만족한다"
  - "증거를 제거하지 않는다 — 추가·교체만 허용"
  - "확신도 상향은 원문 확인 후에만"
side_effects:
  - "영향받는 파생물 캐시를 무효화한다"
  - "ALOG 레코드를 생성한다"
authorized_roles: ["ROLE:x-curator", "ROLE:x-ontologist"]
requires_proposal: true
created_at: "2026-07-30"
updated_at: "2026-07-30"
review_due: "2026-10-28"
curator_note: >
  이 액션은 **사후에 정의되었다.** 2026-07-30 작업에서 노드 수정을 반복 수행했으나
  대응하는 ACTION 노드가 없었다 — 03-kinetic-layer.md §3.1 에 11개 액션을 표로 나열하고
  실제로는 3개만 등재한 상태였기 때문이다.

  이것이 Kinetic 계층의 실질 문제를 드러낸다: **명세가 문서에만 있고 노드로 존재하지
  않으면 액션은 강제되지 않는다.** 표에 적힌 나머지 액션들도 노드로 등재해야 한다.
  → 재검토 과제.

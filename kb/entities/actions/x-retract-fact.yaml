id: "ACTION:x-retract-fact"
type: "ACTION"
layer: "kinetic"
label:
  ko: "사실 폐기"
  en: "Retract fact"
summary: >
  오류로 판명된 사실에 폐기 표시를 남긴다. **삭제가 아니다.** retracted_at 과
  사유를 기록하고, 정정값이 있으면 새 FACT 를 생성해 superseded_by 로 잇는다.
  덮어쓰기 금지 원칙의 집행 지점이다.
action_kind: "governance"
tier: "L2-write"
tags: ["governance", "l2-write", "correction"]
change_set:
  creates: ["FACT"]
  modifies:
    - target: "FACT"
      properties: ["retracted_at", "retraction_reason", "superseded_by"]
  never_touches: ["id", "claim", "value", "evidence", "recorded_at", "valid_from"]
submission_criteria:
  - "retraction_reason 이 비어 있지 않다"
  - "대상 FACT 가 이미 폐기 상태가 아니다"
  - "정정값이 있으면 새 FACT 가 함께 생성되고 superseded_by 로 연결된다"
side_effects:
  - "이 사실을 인용한 산문 문서에 재검토 플래그를 설정한다"
  - "관련 CTR 상충 레코드가 있으면 판정을 갱신한다"
  - "ALOG 레코드를 생성한다"
authorized_roles: ["ROLE:x-curator"]
requires_proposal: true
edges:
  - predicate: "REVERSED_BY"
    to: "ACTION:x-promote-fact"
created_at: "2026-07-30"
updated_at: "2026-07-30"
review_due: "2026-10-30"
curator_note: >
  never_touches 목록이 이 액션의 핵심이다 — 원 레코드의 주장·값·증거·기록시각은
  어떤 경우에도 변경되지 않는다. 이것이 보장되어야 "그때 우리는 무엇을 근거로
  판단했나"에 답할 수 있다 (ADR-0002 이중시간).

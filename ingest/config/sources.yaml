# 수집 소스 레지스트리
# 스키마: docs/ingestion/01-source-registry.md §2
# 근거: _research/wave1/ingestion-sources.md (실측 2026-07-30 02:31Z~02:55Z, 88개 후보)
#
# 등재 원칙
#   - probe.status 가 ok 인 것만 enabled: true
#   - unverified / failed 는 enabled: false + blocker 명시
#   - robots_ok 가 false 이면 수집기가 거부한다 (설정으로 우회 불가)
#
# 실측 표기
#   ok            : 200 응답 + 콘텐츠 확인
#   ok-unparsed   : 200/302 확인했으나 크기 제한으로 본문 미파싱
#   failed        : 접속 실패 (사유 기록)
#   unverified    : 열어보지 않음 — 검증된 것으로 취급 금지

version: "0.1.0"
updated: "2026-07-30"

defaults:
  user_agent: "aml-kb-collector/0.1 (+contact: <운영자 이메일 등록 필요>)"
  min_interval_seconds: 2
  max_concurrent_per_host: 1
  max_concurrent_total: 8
  retry: { attempts: 3, backoff_seconds: [2, 8, 32] }
  conditional_request: true
  fetch_strategy: "plain"

# ── 도메인별 페치 전략 (2파 실측, 2026-07-30) ──
# 봇 차단은 도메인마다 다르게 걸리며, 한 방식이 다른 방식보다 항상 낫지 않다.
# 1파는 표준 클라이언트만 써서 미국 연방기관 전체를 "차단"으로 오판했다.
fetch_strategies:
  browser_headers:
    desc: "브라우저 헤더 일체 부착 (User-Agent·Accept·Accept-Language·Sec-Fetch-*·Upgrade-Insecure-Requests)"
    domains:
      - fincen.gov
      - ofac.treasury.gov
      - home.treasury.gov
      - justice.gov
      - sec.gov
      - ecfr.gov
      - ca5.uscourts.gov
      - courtlistener.com
      - federalregister.gov
      - fatf-gafi.org
      - bis.org
      - iosco.org
  plain:
    desc: "표준 클라이언트. ⚠️ 아래 도메인은 브라우저 헤더를 붙이면 오히려 403 이 된다 (역전 사례)"
    domains:
      - dfs.ny.gov
      - dos.ny.gov
  blocked:
    desc: "양쪽 모두 실패 — 대체 경로 필수"
    domains:
      - congress.gov        # api.congress.gov 키 발급 외 경로 없음
      - govt.westlaw.com    # 뉴욕 공식 NYCRR 포털

